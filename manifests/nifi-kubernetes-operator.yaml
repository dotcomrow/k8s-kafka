spec:
  selector:
    matchLabels:
      control-plane: nifikop
      name: nifikop
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: nifikop
        name: nifikop
        app: nifikop
        operator: nifi
        release: nifikop
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: nifikop
      securityContext:
        runAsUser: 1000
      containers:
        - command:
            - /manager
          args:
            - -metrics-bind-address=:9090
            - -leader-elect
            - -cert-manager-enabled=false
            - -webhook-enabled=false
          image: "ghcr.io/konpyutaika/docker-images/nifikop:v1.17.0-release"
          imagePullPolicy: "Always"
          name: nifikop
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: WATCH_NAMESPACE
              value: kafka,dataflow
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: "nifikop"
            - name: LOG_LEVEL
              value: Info
            - name: LOG_ENCODING
              value: json
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 10
