# ============================================================================
# Kafka cluster.id generator — namespace: kafka
# ============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-clusterid-gen
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-clusterid-secret-writer
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","patch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-clusterid-secret-writer
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
- kind: ServiceAccount
  name: kafka-clusterid-gen
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-clusterid-secret-writer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gen-kafka-clusterid
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: kafka-clusterid-gen
      volumes:
      - name: work
        emptyDir: {}
      initContainers:
      - name: gen
        image: busybox:1.36.1
        command: ["/bin/sh","-c"]
        args:
        - |
          set -eu
          mkdir -p /work
          CID="$(cat /proc/sys/kernel/random/uuid 2>/dev/null || uuidgen 2>/dev/null || date +%s%N)"
          printf '%s' "${CID}" > /work/cluster.id
          ls -l /work/cluster.id
        volumeMounts: [{ name: work, mountPath: /work }]
      containers:
      - name: apply
        image: curlimages/curl:8.8.0
        command: ["/bin/sh","-c"]
        args:
        - |
          set -eu
          NAMESPACE="kafka"; SECRET_NAME="kafka-cluster-id"
          API="https://kubernetes.default.svc"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          CID="$(cat /work/cluster.id)"
          code="$(curl -s -o /dev/null -w '%{http_code}' --cacert "$CACERT" \
                 -H "Authorization: Bearer $TOKEN" \
                 "$API/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME" || true)"
          if [ "$code" != "200" ]; then
            b64="$(printf '%s' "$CID" | base64 | tr -d '\n')"
            printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","namespace":"%s"},"type":"Opaque","data":{"CLUSTER_ID":"%s"}}' \
              "$SECRET_NAME" "$NAMESPACE" "$b64" > /tmp/newsecret.json
            curl -sS -D /tmp/h.txt -o /tmp/r.txt -X POST --cacert "$CACERT" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary @/tmp/newsecret.json \
              "$API/api/v1/namespaces/$NAMESPACE/secrets"
          fi
        volumeMounts: [{ name: work, mountPath: /work }]

