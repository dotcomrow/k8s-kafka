# CPU-only manual VPAs for Kafka utility workloads.
# These preserve explicit memory/limit profiles while allowing CPU requests to learn down.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kafka-connect-cpu
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kafka-connect
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: linkerd-proxy
        mode: "Off"
      - containerName: vault-agent
        mode: "Off"
      - containerName: connect
        controlledResources: ["cpu"]
        controlledValues: "RequestsOnly"
        minAllowed:
          cpu: "25m"
        maxAllowed:
          cpu: "1"
---
