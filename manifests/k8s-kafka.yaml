# ============================================================================
# Continuous Annotation Watcher (wave 50) — JDBC Yugabyte connector
# ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootstrap-watcher
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  replicas: 1
  selector: { matchLabels: { app: bootstrap-watcher } }
  template:
    metadata:
      labels: { app: bootstrap-watcher }
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/exit-on-error: "false"

        vault.hashicorp.com/agent-inject-secret-yb.env: "secret/data/kafka/pgconfig"
        vault.hashicorp.com/agent-inject-template-yb.env: |
          {{- with secret "secret/data/kafka/pgconfig" -}}
          {{ with .Data.data.host }}PGHOST={{ . }}{{ end }}
          {{ with .Data.data.port }}PGPORT={{ . }}{{ end }}
          {{ with .Data.data.database }}PGDATABASE={{ . }}{{ end }}
          {{ with .Data.data.user }}PGUSER={{ . }}{{ end }}
          {{ with .Data.data.master_addresses }}YB_MASTER_ADDRESSES={{ . }}{{ end }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-pgpass.env: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-pgpass.env: |
          {{- with secret "secret/data/vaultadmin" -}}
          PGPASSWORD={{ .Data.data.value }}
          {{- end -}}

        vault.hashicorp.com/agent-inject-secret-bq.env: "secret/data/kafka/bq/config"
        vault.hashicorp.com/agent-inject-template-bq.env: |
          {{- with secret "secret/data/kafka/bq/config" -}}
          {{ with .Data.data.project }}BQ_PROJECT={{ . }}{{ end }}
          {{ with .Data.data.dataset }}BQ_DEFAULT_DATASET={{ . }}{{ end }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/kafka/bq/config"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/kafka/bq/config" -}}
          {{ .Data.data.sa_json }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-permissions-gcp-key.json: "0644"
    spec:
      serviceAccountName: bq-yb-bootstrap
      securityContext:
        fsGroup: 1000
      volumes:
      - name: state
        emptyDir: {}
      containers:
      - name: watcher
        image: yugabytedb/yugabyte:latest
        volumeMounts:
        - { name: state, mountPath: /state }
        env:
        - { name: CONNECT_URL, value: "http://kafka-connect.kafka.svc.internal.lan:8083" }
        - { name: SERVER_PREFIX, value: "yb" }
        - { name: SCAN_INTERVAL, value: "30" }
        command: ["/bin/bash","-lc"]
        args: 
        - |
          set -Eeuo pipefail
          PS4='+ [WATCHER] $(date -Is) '
          set -x

          esc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | tr -d '\n'; }
          mkresp() { mktemp /tmp/resp.XXXXXX.txt; }
          mktmp() { mktemp /tmp/tmp.XXXXXX.json; }

          api_get()   { local u="$1" rf; rf="$(mkresp)"; code=$(curl --connect-timeout 5 --max-time 120 -sS -D /tmp/h.txt -o "$rf" -w '%{http_code}' "$u" || true); echo "GET $u -> $code"; tail -c 2000 "$rf" 2>/dev/null || true; }
          api_put()   { local u="$1" f="$2" rf; rf="$(mkresp)"; code=$(curl --connect-timeout 5 --max-time 120 -sS -D /tmp/h.txt -o "$rf" -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @"$f" -X PUT "$u" || true); echo "PUT $u -> $code"; tail -c 2000 "$rf" 2>/dev/null || true; }
          api_post()  { local u="$1" f="$2" rf; rf="$(mkresp)"; code=$(curl --connect-timeout 5 --max-time 120 -sS -D /tmp/h.txt -o "$rf" -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @"$f" -X POST "$u" || true); echo "POST $u -> $code"; tail -c 2000 "$rf" 2>/dev/null || true; }
          api_delete(){ local u="$1" rf; rf="$(mkresp)"; code=$(curl --connect-timeout 5 --max-time 120 -sS -D /tmp/h.txt -o "$rf" -w '%{http_code}' -X DELETE "$u" || true); echo "DELETE $u -> $code"; tail -c 2000 "$rf" 2>/dev/null || true; }

          validate_config() {
            local plugin="$1" file="$2" rf; rf="$(mkresp)"
            local url="${CONNECT_URL}/connector-plugins/${plugin}/config/validate"
            code=$(curl --connect-timeout 5 --max-time 120 -sS -D /tmp/h.txt -o "$rf" -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @"$file" -X PUT "$url" || true)
            echo "VALIDATE ${plugin} -> $code"
            tail -c 2000 "$rf" 2>/dev/null || true
          }

          for f in /vault/secrets/yb.env /vault/secrets/pgpass.env /vault/secrets/bq.env /vault/secrets/gcp-key.json; do
            i=0; while [ ! -s "$f" ]; do i=$((i+1)); [ $i -gt 120 ] && echo "vault secrets missing: $f" >&2 && exit 1; sleep 2; done
            . "$f" 2>/dev/null || true
          done
          export PGPASSWORD
          PGHOST="${PGHOST:-yb-tserver-service.yugabyte.svc.cluster.local}"
          PGPORT="${PGPORT:-5433}"
          PGUSER="${PGUSER:-vaultadmin}"
          echo "[WATCHER] PGHOST=$PGHOST PGPORT=$PGPORT PGUSER=$PGUSER PGDATABASE=${PGDATABASE:-<ignored>}"

          until curl -fsS "${CONNECT_URL}/connectors" >/dev/null 2>&1; do echo "[WATCHER] waiting for connect REST…"; sleep 3; done
          echo "== Connector plugins =="; curl -fsS "${CONNECT_URL}/connector-plugins" | sed 's/.*/  &/'; echo "======================="

          list_dbs() {
            for DB in yugabyte postgres "${PGDATABASE:-}"; do
              [ -z "$DB" ] && continue
              URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${DB}?sslmode=disable"
              if /home/yugabyte/bin/ysqlsh "$URL" -Atc "select 1" >/dev/null 2>&1; then
                /home/yugabyte/bin/ysqlsh "$URL" -Atc "select datname from pg_database where datallowconn and datname not in ('template0','template1') order by 1" | sort -u
                return 0
              fi
            done
            echo "ERROR: cannot connect to a control DB to enumerate databases" >&2
            return 1
          }

          get_plan_for_db() {
            local DB="$1"
            local URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${DB}?sslmode=disable"
            /home/yugabyte/bin/ysqlsh "$URL" -q -A -t -F '|' -c "
              WITH t AS (
                SELECT n.nspname AS schema, c.relname AS table, d.description
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  LEFT JOIN pg_description d ON d.objoid = c.oid AND d.objsubid = 0
                WHERE c.relkind IN ('r','p') AND d.description IS NOT NULL
              ),
              j AS (
                SELECT schema, \"table\",
                       CASE WHEN description ~ '^[[:space:]]*\\{'
                            THEN (regexp_replace(description, '^[[:space:]]*', ''))::jsonb
                            ELSE NULL END AS jdesc
                FROM t
              ),
              b AS (
                SELECT schema, \"table\", jdesc->'bootstrap' AS b
                FROM j WHERE jdesc ? 'bootstrap'
              )
              SELECT schema, \"table\",
                    COALESCE(b->>'bq','') AS bq,
                    COALESCE(b->>'gcs_prefix', \"table\") AS gcs_prefix,
                    COALESCE(b->>'format','CSV') AS format,
                    COALESCE(b->>'header','true') AS header,
                    COALESCE(b->>'columns','') AS columns,
                    COALESCE((b->>'enabled')::boolean,false) AS enabled
              FROM b
              ORDER BY schema, \"table\";
            " || true
          }

          ensure_signal_table() {
            local DB="$1"
            local URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${DB}?sslmode=disable"
            /home/yugabyte/bin/ysqlsh "$URL" -Atc "CREATE TABLE IF NOT EXISTS public.debezium_signal (id varchar(64) PRIMARY KEY, type varchar(32) NOT NULL, data varchar(2048));" >/dev/null 2>&1 || true
          }

          signal_snapshot_table() {
            local DB="$1" SCHEMA="$2" TBL="$3"
            local URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${DB}?sslmode=disable"
            local ID="$(cat /proc/sys/kernel/random/uuid 2>/dev/null || uuidgen 2>/dev/null || date +%s%N)"
            local DATA="{\"data-collections\": [\"${SCHEMA}.${TBL}\"]}"
            /home/yugabyte/bin/ysqlsh "$URL" -Atc "INSERT INTO public.debezium_signal(id,type,data) VALUES ('${ID}','execute-snapshot','${DATA}');" >/dev/null 2>&1 || true
            echo "signaled snapshot for ${DB}.${SCHEMA}.${TBL}"
          }

          SERVER_PREFIX="${SERVER_PREFIX:-yb}"
          SCAN_INTERVAL="${SCAN_INTERVAL:-30}"

          while :; do
            mapfile -t DBS < <(list_dbs)
            echo "[WATCHER] DBs: ${DBS[*]}"
            printf '%s\n' "${DBS[@]}" > /state/_dbs.current || true

            for DB in "${DBS[@]}"; do
              PLAN="$(get_plan_for_db "$DB")"
              echo "[WATCHER] ${DB} plan lines: $(printf '%s\n' "$PLAN" | grep -c '|' || true)"
              SIG="$(printf '%s' "$PLAN" | sha256sum | awk '{print $1}')"
              LAST="/state/${DB}.plan.sig"
              if [ ! -f "$LAST" ] || [ "$SIG" != "$(cat "$LAST" 2>/dev/null || echo)" ]; then
                printf '%s' "$SIG" > "$LAST"
                printf '%s\n' "$PLAN" > "/state/${DB}.plan.tsv"
                echo "--- /state/${DB}.plan.tsv ---"; cat "/state/${DB}.plan.tsv" || true

                TABLES=""; TOPICS=""; T2MAP=""
                while IFS='|' read -r SCH TBL BQMAP PREFIX FMT HDR COLS ENA; do
                  [ -z "$SCH" ] && continue
                  [ "$ENA" != "t" ] && continue
                  FQ="${SCH}.${TBL}"
                  SERVER="${SERVER_PREFIX}_${DB}"
                  TOPIC="${SERVER}.${FQ}"
                  TABLES="${TABLES}${FQ},"
                  TOPICS="${TOPICS}${TOPIC},"
                  if [ -n "$BQMAP" ] && echo "$BQMAP" | grep -q '\.'; then
                    T2MAP="${T2MAP}${TOPIC}:${BQMAP},"
                  else
                    T2MAP="${T2MAP}${TOPIC}:${BQ_DEFAULT_DATASET}.${TBL},"
                  fi
                done < "/state/${DB}.plan.tsv"
                TABLES="${TABLES%,}"; TOPICS="${TOPICS%,}"; T2MAP="${T2MAP%,}"

                if [ -z "$TABLES" ]; then
                  echo "DB ${DB}: no enabled tables; removing connectors if present."
                  api_delete "${CONNECT_URL}/connectors/bq-sink-${DB}" || true
                  api_delete "${CONNECT_URL}/connectors/yb-source-${DB}" || true
                  rm -f "/state/${DB}.tables" "/state/${DB}.plan.tsv" "/state/${DB}.plan.sig" || true
                  continue
                fi

                ensure_signal_table "$DB"

                # ----- JDBC SOURCE CONNECTOR CONFIG -----
                SRC_PUT="$(mktmp)"
                {
                  echo '{'
                  echo '  "connector.class":"io.debezium.connector.yugabytedb.YugabyteDBConnector",'
                  echo '  "tasks.max":"1",'
                  echo "  \"database.hostname\":\"$(esc "$PGHOST")\","
                  echo "  \"database.port\":\"$(esc "$PGPORT")\","
                  echo "  \"database.user\":\"$(esc "$PGUSER")\","
                  echo "  \"database.password\":\"$(esc "$PGPASSWORD")\","
                  echo "  \"database.dbname\":\"$(esc "$DB")\","
                  echo "  \"database.server.name\":\"$(esc "${SERVER_PREFIX}_${DB}")\","
                  echo "  \"table.include.list\":\"$(esc "$TABLES")\","
                  echo '  "snapshot.mode":"initial",'
                  echo '  "incremental.snapshot.enabled":"true",'
                  echo '  "signal.data.collection":"public.debezium_signal",'
                  echo '  "transforms":"unwrap",'
                  echo '  "transforms.unwrap.type":"io.debezium.transforms.ExtractNewRecordState",'
                  echo '  "topic.creation.default.replication.factor":"1",'
                  echo '  "topic.creation.default.partitions":"1",'
                  echo '  "topic.creation.default.cleanup.policy":"delete"'
                  echo '}'
                } > "$SRC_PUT"
                SRC_POST="$(mktmp)"; { echo '{ "name":"yb-source-'"${DB}"'", "config": '; cat "$SRC_PUT"; echo ' }'; } > "$SRC_POST"

                echo "--- validating source config (yb-source-${DB}) ---"
                validate_config "io.debezium.connector.yugabytedb.YugabyteDBConnector" "$SRC_PUT" || true

                api_put  "${CONNECT_URL}/connectors/yb-source-${DB}/config" "$SRC_PUT" || \
                api_post "${CONNECT_URL}/connectors"                      "$SRC_POST"

                # small poll for status
                for i in $(seq 1 10); do
                  sleep 2
                  STATUS_CODE=$(curl -sS -o /tmp/s.json -w '%{http_code}' "${CONNECT_URL}/connectors/yb-source-${DB}/status" || true)
                  [ "$STATUS_CODE" = "200" ] && break
                done
                echo "yb-source-${DB} status ($STATUS_CODE):"; tail -c 2000 /tmp/s.json 2>/dev/null || true

                # ----- BigQuery SINK CONNECTOR CONFIG -----
                SINK_PUT="$(mktmp)"
                {
                  echo '{'
                  echo '  "connector.class":"com.wepay.kafka.connect.bigquery.BigQuerySinkConnector",'
                  echo '  "tasks.max":"1",'
                  echo "  \"topics\":\"$(esc "$TOPICS")\","
                  echo "  \"topic2TableMap\":\"$(esc "$T2MAP")\","
                  echo "  \"project\":\"$(esc "$BQ_PROJECT")\","
                  echo "  \"defaultDataset\":\"$(esc "$BQ_DEFAULT_DATASET")\","
                  echo '  "sanitizeTopics":"true",'
                  echo '  "autoCreateTables":"true",'
                  echo '  "allowNewBigQueryFields":"true",'
                  echo '  "allowBigQueryRequiredFieldRelaxation":"true",'
                  echo '  "keySource":"FILE",'
                  echo '  "keyfile": "/vault/secrets/gcp-key.json"'
                  echo '}'
                } > "$SINK_PUT"
                SINK_POST="$(mktmp)"; { echo '{ "name":"bq-sink-'"${DB}"'", "config": '; cat "$SINK_PUT"; echo ' }'; } > "$SINK_POST"

                echo "--- validating sink config (bq-sink-${DB}) ---"
                validate_config "com.wepay.kafka.connect.bigQuery.BigQuerySinkConnector" "$SINK_PUT" || true || true

                api_put  "${CONNECT_URL}/connectors/bq-sink-${DB}/config" "$SINK_PUT" || \
                api_post "${CONNECT_URL}/connectors"                      "$SINK_POST"

                for i in $(seq 1 10); do
                  sleep 2
                  STATUS_CODE=$(curl -sS -o /tmp/s2.json -w '%{http_code}' "${CONNECT_URL}/connectors/bq-sink-${DB}/status" || true)
                  [ "$STATUS_CODE" = "200" ] && break
                done
                echo "bq-sink-${DB} status ($STATUS_CODE):"; tail -c 2000 /tmp/s2.json 2>/dev/null || true

                CUR_LIST_FILE="/state/${DB}.tables"
                PREV_LIST="$(cat "$CUR_LIST_FILE" 2>/dev/null || true)"
                printf '%s' "$TABLES" > "$CUR_LIST_FILE"
                printf '%s' "$TABLES" | tr ',' '\n' | while read -r FQ; do
                  [ -z "$FQ" ] && continue
                  if ! printf '%s\n' "$PREV_LIST" | tr ',' '\n' | grep -qx "$FQ"; then
                    signal_snapshot_table "$DB" "${FQ%%.*}" "${FQ#*.}"
                  fi
                done
              fi
            done

            if [ -f /state/_dbs.seen ]; then
              comm -13 <(sort /state/_dbs.current) <(sort /state/_dbs.seen) | while read -r GONE; do
                [ -z "$GONE" ] && continue
                echo "DB ${GONE} disappeared; removing its connectors."
                api_delete "${CONNECT_URL}/connectors/bq-sink-${GONE}" || true
                api_delete "${CONNECT_URL}/connectors/yb-source-${GONE}" || true
                rm -f "/state/${GONE}.tables" "/state/${GONE}.plan.tsv" "/state/${GONE}.plan.sig" || true
              done
            fi
            mv /state/_dbs.current /state/_dbs.seen 2>/dev/null || true

            sleep "${SCAN_INTERVAL}"
          done
        resources:
          requests: { cpu: "200m", memory: "256Mi" }
          limits: { cpu: "1000m", memory: "1Gi" }
        readinessProbe:
          exec: { command: ["/bin/sh","-lc","test -s /vault/secrets/yb.env -a -s /vault/secrets/pgpass.env || true"] }
          initialDelaySeconds: 10
          periodSeconds: 10
