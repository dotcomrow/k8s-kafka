# ============================================================================
# Namespace & RBAC for data bootstrap pipeline (namespace: kafka)
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels: { app: bq-yb-bootstrap }
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bq-yb-bootstrap
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-ok-writer
  namespace: kafka
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get","list","create","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-ok-writer
  namespace: kafka
subjects:
- kind: ServiceAccount
  name: bq-yb-bootstrap
  namespace: kafka
roleRef:
  kind: Role
  name: bootstrap-ok-writer
  apiGroup: rbac.authorization.k8s.io

# ============================================================================
# Vault CONFIG job (wave 0) — RUNS IN NAMESPACE: vault
# - Sets up Vault DB engine, dynamic role, policy, k8s auth binding to SA in kafka ns
# - Requires Secret vault/vault-root-token with key VAULT_TOKEN
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yb-vault-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-yb-vault
          image: hashicorp/vault:1.15.4
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: AUTH_PATH
              value: "kubernetes"
            - name: DB_MOUNT
              value: "yugabyte-db"
            - name: DB_NAME_IN_VAULT
              value: "yugabyte"
            - name: POLICY_NAME
              value: "data-bootstrap"
            - name: K8S_ROLE_NAME
              value: "data-bootstrap"
            - name: SA_NAME
              value: "bq-yb-bootstrap"
            - name: SA_NAMESPACE
              value: "kafka"
            - name: DEFAULT_DB_TTL
              value: "1h"
            - name: DEFAULT_DB_MAX_TTL
              value: "24h"
            - name: YB_MASTER_ADDRESSES
              value: "yb-master-0.yugabyte.svc.cluster.local:7100,yb-master-1.yugabyte.svc.cluster.local:7100,yb-master-2.yugabyte.svc.cluster.local:7100"
            - name: BQ_BOOTSTRAP_LOCATION
              value: "US"
            - name: BQ_BOOTSTRAP_PROJECT
              value: "<path:secret/data/k8s-kafka-gcp-project-id#value>"
            - name: BQ_PROJECT
              value: "<path:secret/data/k8s-kafka-gcp-project-id#value>"

          command: ["/bin/sh","-c"]
          args: |
            set -euo pipefail

            # ================================================================
            # SEED VALUES (edit or populate dynamically in this script)
            # ================================================================
            # Yugabyte connection (what consumers will read via secret/kafka/pgconfig)
            PG_HOST="${PG_HOST:-yb-tserver-service.yugabyte.svc.cluster.local}"
            PG_PORT="${PG_PORT:-5433}"
            PG_DATABASE="${PG_DATABASE:-kafka}"
            PG_USER="${PG_USER:-vaultadmin}"               # password lives in secret/vaultadmin:value
            YB_MASTER_ADDRESSES="${YB_MASTER_ADDRESSES:-}" # optional, for yb-admin / CDC

            # BigQuery / GCS for bootstrap export
            BQ_BOOTSTRAP_PROJECT="${BQ_BOOTSTRAP_PROJECT:-}"  # e.g. my-gcp-project
            BQ_BOOTSTRAP_BUCKET="${BQ_BOOTSTRAP_BUCKET:-}"    # e.g. my-bootstrap-bucket
            BQ_BOOTSTRAP_LOCATION="${BQ_BOOTSTRAP_LOCATION:-}"# optional, e.g. US

            # BigQuery defaults for registrar / Connect
            BQ_PROJECT="${BQ_PROJECT:-}"            # e.g. my-gcp-project
            BQ_DEFAULT_DATASET="${BQ_DEFAULT_DATASET:-}"  # e.g. analytics
            # Raw JSON for a SA key that needs BigQuery & GCS perms (optional)
            # inside yb-vault-config before put_bq_config/put_bq_exporter_key
            SYNCED="$(vault kv get -format=json 'secret/k8s-kafka-gcp-sesrvice-account-json' 2>/dev/null || true)"
            if [ -n "$SYNCED" ]; then
              BQ_SA_JSON="$(echo "$SYNCED" | jq -r '.data.data.value')"
            fi

            # BigQuery sink version / misc knobs you may want to surface later
            BQ_SINK_VERSION="${BQ_SINK_VERSION:-2.6.1}"

            # ================================================================
            # Tools (apk if Alpine, else apt)
            # ================================================================
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq curl postgresql15-client netcat-openbsd >/dev/null
            else
              apt-get update -y >/dev/null
              apt-get install -y jq curl postgresql-client netcat-openbsd >/dev/null
              rm -rf /var/lib/apt/lists/*
            fi

            # ================================================================
            # Auth to Vault via root token
            # ================================================================
            until [ -s /vault-token/VAULT_TOKEN ]; do
              echo "🔁 waiting for /vault-token/VAULT_TOKEN..."; sleep 2
            done
            export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

            # ================================================================
            # Yugabyte admin password (single-value secret/vaultadmin:value)
            # ================================================================
            VAULTADMIN_USER="${PG_USER}"
            echo "🔐 Waiting for secret/${VAULTADMIN_USER}..."
            VAULTADMIN_PASS=""
            while :; do
              OUT="$(vault kv get -format=json "secret/${VAULTADMIN_USER}" 2>/dev/null || true)"
              if [ -n "${OUT}" ]; then
                VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.value // empty')"
                [ -n "${VAULTADMIN_PASS}" ] && break
              fi
              echo "⏳ secret/${VAULTADMIN_USER} not ready; retry in 5s..."; sleep 5
            done
            export PGPASSWORD="$VAULTADMIN_PASS"

            # ================================================================
            # Ensure DB reachable / exists (no connection definition is written)
            # ================================================================
            until getent hosts "$PG_HOST" >/dev/null 2>&1; do echo "🔄 waiting for DNS $PG_HOST..."; sleep 3; done
            until nc -z -w1 "$PG_HOST" "$PG_PORT";        do echo "⏳ waiting for DB $PG_HOST:$PG_PORT..."; sleep 3; done

            DB_EXISTS="$(psql -h "$PG_HOST" -p "$PG_PORT" -U "$VAULTADMIN_USER" -d postgres -Atc \
              "SELECT 1 FROM pg_database WHERE datname='${PG_DATABASE}'" || true)"
            if [ "${DB_EXISTS}" != "1" ]; then
              createdb -h "$PG_HOST" -p "$PG_PORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$PG_DATABASE"
            fi

            # ================================================================
            # Enable DB engine if missing (DO NOT write shared connection cfg)
            # ================================================================
            if ! vault secrets list -format=json | jq -e 'has("'"${DB_MOUNT}"'/")' >/dev/null 2>&1; then
              vault secrets enable -path="${DB_MOUNT}" database
            fi

            # ================================================================
            # Dynamic DB role for bootstrap jobs (uses existing connection cfg)
            # ================================================================
            cat >/tmp/sql_bootstrap_create.sql <<EOSQL
            CREATE ROLE "{{name}}" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';
            GRANT CONNECT ON DATABASE "${PG_DATABASE}" TO "{{name}}";
            GRANT USAGE ON SCHEMA public TO "{{name}}";
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO "{{name}}";
            GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO "{{name}}";
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "{{name}}";
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO "{{name}}";
            EOSQL

            cat >/tmp/sql_bootstrap_revoke.sql <<EOSQL
            REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public FROM "{{name}}";
            REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public FROM "{{name}}";
            DROP ROLE IF EXISTS "{{name}}";
            EOSQL

            vault write "${DB_MOUNT}/roles/bootstrap" \
              db_name="${DB_NAME_IN_VAULT}" \
              creation_statements=@/tmp/sql_bootstrap_create.sql \
              revocation_statements=@/tmp/sql_bootstrap_revoke.sql \
              default_ttl="${DEFAULT_DB_TTL}" \
              max_ttl="${DEFAULT_DB_MAX_TTL}"

            # ================================================================
            # Helpers to write multi-key KVv2 entries (secret/kafka/...)
            # ================================================================
            put_pgconfig() {
              local args=""
              [ -n "$PG_HOST" ] && args="$args host=$PG_HOST"
              [ -n "$PG_PORT" ] && args="$args port=$PG_PORT"
              [ -n "$PG_DATABASE" ] && args="$args database=$PG_DATABASE"
              [ -n "$PG_USER" ] && args="$args user=$PG_USER"
              [ -n "$YB_MASTER_ADDRESSES" ] && args="$args master_addresses=$YB_MASTER_ADDRESSES"
              if [ -n "$args" ]; then
                echo "➡️  Writing secret/kafka/pgconfig ($args)"
                # shellcheck disable=SC2086
                vault kv put secret/kafka/pgconfig $args >/dev/null
              else
                echo "ℹ️  No pgconfig fields set; skipping"
              fi
            }

            put_bq_bootstrap() {
              local args=""
              [ -n "$BQ_BOOTSTRAP_BUCKET" ]   && args="$args bucket=$BQ_BOOTSTRAP_BUCKET"
              [ -n "$BQ_BOOTSTRAP_PROJECT" ]  && args="$args project=$BQ_BOOTSTRAP_PROJECT"
              [ -n "$BQ_BOOTSTRAP_LOCATION" ] && args="$args location=$BQ_BOOTSTRAP_LOCATION"
              if [ -n "$args" ]; then
                echo "➡️  Writing secret/kafka/bq/bootstrap ($args)"
                # shellcheck disable=SC2086
                vault kv put secret/kafka/bq/bootstrap $args >/dev/null
              else
                echo "ℹ️  No bq/bootstrap fields set; skipping"
              fi
            }

            put_bq_config() {
              local args=""
              [ -n "$BQ_PROJECT" ]         && args="$args project=$BQ_PROJECT"
              [ -n "$BQ_DEFAULT_DATASET" ] && args="$args dataset=$BQ_DEFAULT_DATASET"
              if [ -n "$BQ_SA_JSON" ]; then
                printf '%s' "$BQ_SA_JSON" > /tmp/sa.json
                args="$args sa_json=@/tmp/sa.json"
              fi
              if [ -n "$args" ]; then
                echo "➡️  Writing secret/kafka/bq/config ($args)"
                # shellcheck disable=SC2086
                vault kv put secret/kafka/bq/config $args >/dev/null
              else
                echo "ℹ️  No bq/config fields set; skipping"
              fi
            }

            put_bq_exporter_key() {
              if [ -n "$BQ_SA_JSON" ]; then
                printf '%s' "$BQ_SA_JSON" > /tmp/bq-exporter.json
                echo "➡️  Writing secret/kafka/bq/exporter (sa_json)"
                vault kv put secret/kafka/bq/exporter sa_json=@/tmp/bq-exporter.json >/dev/null
              else
                echo "ℹ️  No SA JSON provided; skipping secret/kafka/bq/exporter"
              fi
            }

            # ================================================================
            # Write KVv2 entries (multi-key)
            # ================================================================
            put_pgconfig
            put_bq_bootstrap
            put_bq_config
            put_bq_exporter_key

            # ================================================================
            # Policy allowing kafka SA to read what we just wrote
            # ================================================================
            vault policy write "${POLICY_NAME}" - <<EOP
            path "${DB_MOUNT}/creds/bootstrap"           { capabilities = ["read"] }
            path "secret/data/kafka/pgconfig"            { capabilities = ["read"] }
            path "secret/data/kafka/bq/bootstrap"        { capabilities = ["read"] }
            path "secret/data/kafka/bq/config"           { capabilities = ["read"] }
            path "secret/data/kafka/bq/exporter"         { capabilities = ["read"] }
            path "secret/data/vaultadmin"                { capabilities = ["read"] }
            EOP

            # Bind SA in kafka namespace to this policy
            vault write auth/${AUTH_PATH}/role/${K8S_ROLE_NAME} \
              bound_service_account_names="${SA_NAME}" \
              bound_service_account_namespaces="${SA_NAMESPACE}" \
              policies="${POLICY_NAME}" \
              ttl="24h" >/dev/null

            echo "🎉 Vault dynamic role + multi-key KV seeds + policy + k8s auth configured."
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }

# ============================================================================
# One-shot Backfill Job (wave 2): discover COMMENT JSON, BigQuery -> GCS -> Yugabyte
# (namespace: kafka)
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bq-to-yb-bootstrap
  namespace: kafka
  labels: { app: bq-yb-bootstrap }
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: bq-yb-bootstrap }
      annotations:
        linkerd.io/inject: disabled
        vault.hashicorp.com/agent-inject: "enabled"
        vault.hashicorp.com/role: "data-bootstrap"

        # ---- GCP SA key (raw JSON from secret/kafka/bq/exporter.sa_json) ----
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/kafka/bq/exporter"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/kafka/bq/exporter" -}}
          {{ .Data.data.sa_json }}
          {{- end -}}

        # ---- Bootstrap env (BUCKET/PROJECT/LOCATION from secret/kafka/bq/bootstrap) ---
        vault.hashicorp.com/agent-inject-secret-bootstrap.env: "secret/data/kafka/bq/bootstrap"
        vault.hashicorp.com/agent-inject-template-bootstrap.env: |
          {{- with secret "secret/data/kafka/bq/bootstrap" -}}
          {{ with .Data.data.bucket }}BUCKET={{ . }}{{ end }}
          {{ with .Data.data.project }}PROJECT={{ . }}{{ end }}
          {{ with .Data.data.location }}LOCATION={{ . }}{{ end }}
          {{- end -}}

        # ---- DB config (PGHOST/PGPORT/PGDATABASE/PGUSER from secret/kafka/pgconfig) ---
        vault.hashicorp.com/agent-inject-secret-pg.env: "secret/data/kafka/pgconfig"
        vault.hashicorp.com/agent-inject-template-pg.env: |
          {{- with secret "secret/data/kafka/pgconfig" -}}
          {{ with .Data.data.host }}PGHOST={{ . }}{{ end }}
          {{ with .Data.data.port }}PGPORT={{ . }}{{ end }}
          {{ with .Data.data.database }}PGDATABASE={{ . }}{{ end }}
          {{ with .Data.data.user }}PGUSER={{ . }}{{ end }}
          {{ with .Data.data.master_addresses }}YB_MASTER_ADDRESSES={{ . }}{{ end }}
          {{- end -}}

        # ---- Yugabyte admin password (single-value at secret/vaultadmin:value) ----------
        vault.hashicorp.com/agent-inject-secret-pg-admin.env: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-pg-admin.env: |
          {{- with secret "secret/data/vaultadmin" -}}
          PGPASSWORD={{ .Data.data.value }}
          {{- end -}}
    spec:
      serviceAccountName: bq-yb-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: runner
        image: google/cloud-sdk:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: GOOGLE_APPLICATION_CREDENTIALS
            value: /vault/secrets/gcp-key.json
        volumeMounts:
          - name: vault-secrets
            mountPath: /vault/secrets
        command: ["/bin/sh","-lc"]
        args: |
          set -eu

          # Wait for Vault-injected files
          for f in /vault/secrets/bootstrap.env /vault/secrets/pg.env /vault/secrets/pg-admin.env /vault/secrets/gcp-key.json; do
            i=0
            while [ ! -s "$f" ]; do
              i=$((i+1)); [ $i -gt 120 ] && echo "❌ Timeout waiting for $f" && exit 1
              echo "⏳ Waiting for Vault secret $f..."; sleep 2
            done
          done

          # Load env from Vault
          . /vault/secrets/bootstrap.env     # BUCKET/PROJECT[/LOCATION]
          . /vault/secrets/pg.env            # PGHOST/PGPORT/PGDATABASE/PGUSER[/YB_MASTER_ADDRESSES]
          . /vault/secrets/pg-admin.env      # PGPASSWORD
          export PGPASSWORD

          # Safe defaults if a key was omitted from pgconfig
          : "${PGHOST:=yb-tserver-service.yugabyte.svc.cluster.local}"
          : "${PGPORT:=5433}"
          : "${PGDATABASE:=kafka}"
          : "${PGUSER:=vaultadmin}"

          echo "✅ Secrets loaded. PROJECT=${PROJECT:-unset} BUCKET=${BUCKET:-unset} PGHOST=${PGHOST}"

          # Tools
          apt-get update >/dev/null
          apt-get install -y --no-install-recommends postgresql-client jq >/dev/null
          apt-get clean; rm -rf /var/lib/apt/lists/*

          # Helpers
          get_columns() {
            local sch="$1" tbl="$2"
            PGPASSWORD="$PGPASSWORD" \
            psql "host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER sslmode=disable" -Atqc \
              "SELECT string_agg(quote_ident(column_name), ',')
               FROM information_schema.columns
               WHERE table_schema=$$${sch}$$ AND table_name=$$${tbl}$$
               ORDER BY ordinal_position;" | tr -d '\n'
          }

          check_empty() {
            local sch="$1" tbl="$2"
            local cnt
            cnt="$(PGPASSWORD="$PGPASSWORD" psql "host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER sslmode=disable" -Atqc "SELECT COUNT(*) FROM ${sch}.${tbl};" || echo "0")"
            if [ "$cnt" != "0" ] && [ -z "${ALLOW_NONEMPTY:-}" ]; then
              echo "❌ Target ${sch}.${tbl} not empty (count=${cnt})."; exit 1
            fi
          }

          # Discover flagged tables via COMMENT JSON
          SQL_DISCOVER="
          WITH c AS (
            SELECT n.nspname AS schema, c.relname AS table, d.description
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              LEFT JOIN pg_description d ON d.objoid = c.oid AND d.objsubid = 0
             WHERE c.relkind IN ('r','p') AND d.description IS NOT NULL
          ),
          j AS (
            SELECT schema, \"table\",
                   CASE WHEN left(description,1)='{' THEN description::jsonb ELSE NULL END AS jdesc
              FROM c
          )
          SELECT json_build_object(
                   'schema', schema,
                   'table',  \"table\",
                   'cfg',    jdesc -> 'bootstrap'
                 )
            FROM j
           WHERE jdesc ? 'bootstrap'
             AND COALESCE( (jdesc->'bootstrap'->>'enabled')::boolean, false ) = true;
          "

          DISCOVERED="$(PGPASSWORD="$PGPASSWORD" psql "host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER sslmode=disable" -Atqc "$SQL_DISCOVER" || true)"

          if [ -z "${DISCOVERED}" ]; then
            echo "ℹ️  No tables flagged for bootstrap (COMMENT JSON missing or enabled=false)."
          fi

          echo "$DISCOVERED" | while read -r ROW_JSON; do
            [ -z "$ROW_JSON" ] && continue
            SCH="$(echo "$ROW_JSON" | jq -r '.schema')"
            TBL="$(echo "$ROW_JSON" | jq -r '.table')"
            CFG="$(echo "$ROW_JSON" | jq -c '.cfg // {}')"

            BQ_TABLE="$(echo "$CFG" | jq -r '.bq // empty')"
            [ -z "$BQ_TABLE" ] && { echo "❌ ${SCH}.${TBL} missing 'bq' in COMMENT bootstrap config"; exit 1; }
            PREFIX="$(echo "$CFG" | jq -r '.gcs_prefix // "'$TBL'"')"
            FMT="$(echo "$CFG" | jq -r '.format // "CSV"')"
            HDR="$(echo "$CFG" | jq -r '.header // true')"
            COLS_OVERRIDE="$(echo "$CFG" | jq -r '.columns // empty')"

            if [ -z "$COLS_OVERRIDE" ] || [ "$COLS_OVERRIDE" = "null" ]; then
              COLS="$(get_columns "$SCH" "$TBL")"
            else
              COLS="$(echo "$COLS_OVERRIDE" | awk -F',' '{for(i=1;i<=NF;i++){gsub(/^ +| +$/,"",$i); printf "%s\"%s\"", (i>1?",":""), $i}}')"
            fi

            DEST_URI="gs://${BUCKET}/bootstrap/${PREFIX}/${PREFIX}-*.csv"
            [ -n "${LOCATION:-}" ] && BQ_LOC_FLAG="--location=${LOCATION}" || BQ_LOC_FLAG=""

            echo "➡️  Export BigQuery ${BQ_TABLE} → ${DEST_URI}"
            bq ${BQ_LOC_FLAG} --project_id="${PROJECT}" extract \
              --destination_format="${FMT}" \
              --field_delimiter="," \
              --print_header="${HDR}" \
              "${BQ_TABLE}" \
              "${DEST_URI}"

            echo "➡️  Import GCS → Yugabyte ${SCH}.${TBL}"
            check_empty "$SCH" "$TBL"
            gsutil cat "gs://${BUCKET}/bootstrap/${PREFIX}/${PREFIX}-*.csv" \
            | PGPASSWORD="$PGPASSWORD" psql "host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER sslmode=disable" \
                -v ON_ERROR_STOP=1 \
                -c "\copy ${SCH}.${TBL} (${COLS}) from stdin with (format csv, header ${HDR})"

            echo "✅ Imported ${SCH}.${TBL}"
          done

          # Completion flag
          kubectl -n kafka apply -f - <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: bootstrap.ok
            namespace: kafka
            labels: { app: bq-yb-bootstrap }
          data:
            status: "complete"
            completedAt: "__NOW__"
          EOF

          echo "🎉 Bootstrap complete."
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits:   { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: vault-secrets
          emptyDir: {}

# ============================================================================
# Kafka (wave 1): single-broker KRaft — official Apache image (namespace: kafka)
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  selector:
    app: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-hs
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterIP: None
  ports:
    - name: controller
      port: 9093
      targetPort: 9093
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: kafka-hs
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
      annotations:
        linkerd.io/inject: disabled
    spec:
      initContainers:
        - name: format-storage
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              if [ ! -f "/tmp/kraft-combined-logs/meta.properties" ]; then
                CLUSTER_ID="$("/opt/kafka/bin/kafka-storage.sh" random-uuid)"
                /opt/kafka/bin/kafka-storage.sh format \
                  -t "${CLUSTER_ID}" \
                  -c /opt/kafka/config/kraft/server.properties \
                  --ignore-formatted
                echo "Formatted with cluster.id=${CLUSTER_ID}"
              else
                echo "Storage already formatted; skipping."
              fi
          volumeMounts:
            - name: kafka-logs
              mountPath: /tmp/kraft-combined-logs
      containers:
        - name: broker
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.kafka.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-hs.kafka.svc.cluster.local:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
          volumeMounts:
            - name: kafka-logs
              mountPath: /tmp/kraft-combined-logs
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: kafka-logs
          emptyDir: {}

# ============================================================================
# Kafka Connect (wave 1): installs BigQuery Sink + Debezium YB gRPC (namespace: kafka)
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  ports:
    - name: rest
      port: 8083
      targetPort: 8083
  selector:
    app: kafka-connect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka-connect }
  template:
    metadata:
      labels: { app: kafka-connect }
      annotations:
        linkerd.io/inject: disabled
    spec:
      initContainers:
        - name: install-plugins
          image: confluentinc/cp-kafka-connect:7.6.1
          command:
            - bash
            - -lc
            - |
              mkdir -p /plugins
              apt-get update >/dev/null 2>&1 || true
              apt-get install -y unzip curl >/dev/null 2>&1 || true
              echo "Installing BigQuery Sink..."
              confluent-hub install --no-prompt --component-dir /plugins confluentinc/kafka-connect-bigquery:${BQ_SINK_VER}
              echo "Installing Yugabyte Debezium gRPC connector..."
              curl -fsSL "${YB_DEBEZIUM_URL}" -o /tmp/yb-connector.zip || wget -qO /tmp/yb-connector.zip "${YB_DEBEZIUM_URL}"
              unzip -o /tmp/yb-connector.zip -d /plugins >/dev/null 2>&1 || true
              echo "✅ Plugins ready in /plugins"
          env:
            - name: BQ_SINK_VER
              value: "2.6.1"
            - name: YB_DEBEZIUM_URL
              value: "https://downloads.yugabyte.com/debezium/dz.1.9.5.yb.grpc.2024.2.2/debezium-connector-yugabytedb-grpc.zip"
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      containers:
        - name: connect
          image: confluentinc/cp-kafka-connect:7.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              value: "kafka-connect"
            - name: CONNECT_REST_PORT
              value: "8083"
            - name: CONNECT_GROUP_ID
              value: "connect-cluster"
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: "_connect-configs"
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: "_connect-offsets"
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: "_connect-status"
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "true"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "true"
            - name: CONNECT_PLUGIN_PATH
              value: "/plugins"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      volumes:
        - name: plugins
          emptyDir: {}

# ============================================================================
# Registration Job (wave 3): Yugabyte→Kafka (Debezium) + Kafka→BigQuery (namespace: kafka)
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-yb-to-bq
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "data-bootstrap"

    # ---- Yugabyte PG config (multi-key from secret/kafka/pgconfig) ----
    vault.hashicorp.com/agent-inject-secret-yb: "secret/data/kafka/pgconfig"
    vault.hashicorp.com/agent-inject-template-yb: |
      {{- with secret "secret/data/kafka/pgconfig" -}}
      {{ with .Data.data.host }}PGHOST={{ . }}{{ end }}
      {{ with .Data.data.port }}PGPORT={{ . }}{{ end }}
      {{ with .Data.data.database }}PGDATABASE={{ . }}{{ end }}
      {{ with .Data.data.user }}PGUSER={{ . }}{{ end }}
      {{ with .Data.data.master_addresses }}YB_MASTER_ADDRESSES={{ . }}{{ end }}
      {{- end }}

    # ---- BigQuery config (multi-key from secret/kafka/bq/config) ----
    vault.hashicorp.com/agent-inject-secret-bq: "secret/data/kafka/bq/config"
    vault.hashicorp.com/agent-inject-template-bq: |
      {{- with secret "secret/data/kafka/bq/config" -}}
      {{ with .Data.data.project }}BQ_PROJECT={{ . }}{{ end }}
      {{ with .Data.data.dataset }}BQ_DEFAULT_DATASET={{ . }}{{ end }}
      {{ with .Data.data.sa_json }}BQ_KEY_JSON={{ . | toJSON }}{{ end }}
      {{- end }}

    # ---- DB password (single-value secret/vaultadmin:value) ----
    vault.hashicorp.com/agent-inject-secret-pgpass.env: "secret/data/vaultadmin"
    vault.hashicorp.com/agent-inject-template-pgpass.env: |
      {{- with secret "secret/data/vaultadmin" -}}
      PGPASSWORD={{ .Data.data.value }}
      {{- end }}
spec:
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
    spec:
      serviceAccountName: bq-yb-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: registrar
          image: yugabytedb/yugabyte:2024.2.2.0-b105
          command:
            - bash
            - -lc
            - |
              set -euo pipefail

              if ! command -v kubectl >/dev/null 2>&1; then
                VER="$(curl -fsSL https://dl.k8s.io/release/stable.txt || echo v1.29.0)"
                curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/${VER}/bin/linux/amd64/kubectl" \
                  || wget -qO /usr/local/bin/kubectl "https://dl.k8s.io/${VER}/bin/linux/amd64/kubectl"
                chmod +x /usr/local/bin/kubectl
              fi

              # Load Vault-injected env files
              for f in /vault/secrets/yb /vault/secrets/bq /vault/secrets/pgpass.env; do
                i=0
                while [ ! -s "$f" ]; do
                  i=$((i+1)); [ $i -gt 120 ] && echo "❌ Timeout waiting for $f" && exit 1
                  echo "⏳ Waiting for Vault secret $f..."; sleep 2
                done
                source "$f"
              done
              export PGPASSWORD

              echo "Waiting for bootstrap.ok..."
              until [ "$(kubectl -n kafka get configmap bootstrap.ok -o jsonpath='{.data.status}' 2>/dev/null || true)" = "complete" ]; do
                echo "  bootstrap.ok not ready"; sleep 5
              done

              echo "Waiting for Kafka Connect REST..."
              until curl -sf http://kafka-connect.kafka.svc.cluster.local:8083/connectors >/dev/null || \
                    wget -qO- http://kafka-connect.kafka.svc.cluster.local:8083/connectors >/dev/null; do
                echo "  connect not ready"; sleep 5
              done

              PGURL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=disable"

              echo "Discovering flagged tables from Yugabyte comments..."
              mapfile -t ROWS < <(
                /home/yugabyte/bin/ysqlsh "${PGURL}" -Atc "
                  with t as (
                    select table_schema, table_name,
                           obj_description((quote_ident(table_schema)||'.'||quote_ident(table_name))::regclass) as comment
                    from information_schema.tables
                    where table_type='BASE TABLE'
                      and table_schema not in ('pg_catalog','information_schema')
                  )
                  select table_schema||','||table_name||','||coalesce( (comment::jsonb -> 'bootstrap' ->> 'bq'), '' )
                  from t
                  where comment is not null
                    and ((comment::jsonb -> 'bootstrap' ->> 'enabled')::boolean is true);
                "
              )

              if [ ${#ROWS[@]} -eq 0 ]; then
                echo "No flagged tables found; exiting successfully."
                exit 0
              fi

              SERVER_NAME="yb"
              TABLE_INCLUDE_LIST=""
              TOPICS=""
              TOPIC2TABLEMAP=""

              for R in "${ROWS[@]}"; do
                SCHEMA="$(echo "$R" | cut -d, -f1)"
                TBL="$(echo "$R" | cut -d, -f2)"
                BQMAP="$(echo "$R" | cut -d, -f3-)"
                FQ="${SCHEMA}.${TBL}"
                TOPIC="${SERVER_NAME}.${FQ}"

                TABLE_INCLUDE_LIST="${TABLE_INCLUDE_LIST}${FQ},"
                TOPICS="${TOPICS}${TOPIC},"

                if [ -n "$BQMAP" ] && [[ "$BQMAP" == *.* ]]; then
                  TOPIC2TABLEMAP="${TOPIC2TABLEMAP}${TOPIC}:${BQMAP},"
                else
                  TOPIC2TABLEMAP="${TOPIC2TABLEMAP}${TOPIC}:${BQ_DEFAULT_DATASET}.${TBL},"
                fi
              done
              TABLE_INCLUDE_LIST="${TABLE_INCLUDE_LIST%,}"
              TOPICS="${TOPICS%,}"
              TOPIC2TABLEMAP="${TOPIC2TABLEMAP%,}"

              echo "Creating (or reusing) Yugabyte CDC stream id..."
              STREAM_ID="$(
                /home/yugabyte/bin/yb-admin -master_addresses ${YB_MASTER_ADDRESSES} create_change_data_stream ${PGDATABASE} 2>/dev/null | awk '{print $NF}'
              )"
              if [ -z "${STREAM_ID}" ]; then
                echo "❌ Could not obtain CDC stream id; verify yb-admin syntax/version and master addresses."; exit 1
              fi
              echo "CDC stream id: ${STREAM_ID}"

              echo "Registering Debezium Yugabyte gRPC source connector..."
              cat > /tmp/yb-source.json <<JSON
              {
                "name": "yb-source",
                "config": {
                  "connector.class": "io.debezium.connector.yugabytedb.YugabyteDBgRPCConnector",
                  "tasks.max": "1",
                  "database.hostname": "${PGHOST}",
                  "database.port": "${PGPORT}",
                  "database.master.addresses": "${YB_MASTER_ADDRESSES}",
                  "database.streamid": "${STREAM_ID}",
                  "database.user": "${PGUSER}",
                  "database.password": "${PGPASSWORD}",
                  "database.dbname": "${PGDATABASE}",
                  "database.server.name": "${SERVER_NAME}",
                  "table.include.list": "${TABLE_INCLUDE_LIST}",
                  "snapshot.mode": "never",
                  "transforms": "unwrap",
                  "transforms.unwrap.type": "io.debezium.connector.yugabytedb.transforms.YBExtractNewRecordState",
                  "topic.creation.default.replication.factor": "1",
                  "topic.creation.default.partitions": "1",
                  "topic.creation.default.cleanup.policy": "delete"
                }
              }
              JSON

              (curl -sf -X PUT -H 'Content-Type: application/json' --data-binary @/tmp/yb-source.json \
                http://kafka-connect.kafka.svc.cluster.local:8083/connectors/yb-source/config) \
              || curl -sf -X POST -H 'Content-Type: application/json' --data-binary @/tmp/yb-source.json \
                http://kafka-connect.kafka.svc.cluster.local:8083/connectors || { echo "❌ register source failed"; exit 1; }

              echo "Registering BigQuery Sink connector..."
              cat > /tmp/bq-sink.json <<JSON
              {
                "name": "bq-sink",
                "config": {
                  "connector.class": "com.wepay.kafka.connect.bigquery.BigQuerySinkConnector",
                  "tasks.max": "1",
                  "topics": "${TOPICS}",
                  "topic2TableMap": "${TOPIC2TABLEMAP}",
                  "project": "${BQ_PROJECT}",
                  "defaultDataset": "${BQ_DEFAULT_DATASET}",
                  "sanitizeTopics": "true",
                  "autoCreateTables": "false",
                  "allowNewBigQueryFields": "true",
                  "allowBigQueryRequiredFieldRelaxation": "true",
                  "keySource": "JSON",
                  "keyfile": ${BQ_KEY_JSON}
                }
              }
              JSON

              (curl -sf -X PUT -H 'Content-Type: application/json' --data-binary @/tmp/bq-sink.json \
                http://kafka-connect.kafka.svc.cluster.local:8083/connectors/bq-sink/config) \
              || curl -sf -X POST -H 'Content-Type: application/json' --data-binary @/tmp/bq-sink.json \
                http://kafka-connect.kafka.svc.cluster.local:8083/connectors || { echo "❌ register sink failed"; exit 1; }

              echo "✅ Connectors registered."
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
