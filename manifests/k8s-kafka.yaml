# ============================================================================
# Namespace & RBAC (namespace: kafka)
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels: { app: bq-yb-bootstrap }
  annotations:
    linkerd.io/inject: "disabled"
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=ctrl-node"
    field.cattle.io/projectId: "local:infrastructure"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bq-yb-bootstrap
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-ok-writer
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get","list","create","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-ok-writer
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
subjects:
- kind: ServiceAccount
  name: bq-yb-bootstrap
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bootstrap-ok-writer

# ============================================================================
# Kafka cluster.id generator — namespace: kafka
# ============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-clusterid-gen
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-clusterid-secret-writer
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","patch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-clusterid-secret-writer
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
subjects:
- kind: ServiceAccount
  name: kafka-clusterid-gen
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-clusterid-secret-writer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gen-kafka-clusterid
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: kafka-clusterid-gen
      volumes: [{ name: work, emptyDir: {} }]
      containers:
      - name: gen
        image: apache/kafka:3.9.0
        command: ["/bin/bash","-lc"]
        args:
          - |
            set -eu
            CID="$("/opt/kafka/bin/kafka-storage.sh" random-uuid)"
            echo "Generated cluster.id: ${CID}"
            printf '%s' "${CID}" > /work/cluster.id
            sleep 3
        volumeMounts: [{ name: work, mountPath: /work }]
      - name: apply
        image: curlimages/curl:8.8.0
        command: ["/bin/sh","-c"]
        args:
          - |
            set -eu
            NAMESPACE="kafka"; SECRET_NAME="kafka-cluster-id"
            API="https://kubernetes.default.svc"
            TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

            i=0; while [ ! -s /work/cluster.id ]; do
              i=$((i+1)); [ $i -gt 120 ] && echo "timeout waiting for /work/cluster.id" && exit 1; sleep 1
            done
            CID="$(cat /work/cluster.id)"

            code="$(curl -s -o /tmp/ex.json -w '%{http_code}' --cacert "$CACERT" \
                   -H "Authorization: Bearer $TOKEN" \
                   "$API/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME")"
            [ "$code" = "200" ] && { echo "Secret exists; nothing to do."; exit 0; }

            b64="$(printf '%s' "$CID" | base64 | tr -d '\n')"
            cat >/tmp/newsecret.json <<JSON
            {"apiVersion":"v1","kind":"Secret",
             "metadata":{"name":"$SECRET_NAME","namespace":"$NAMESPACE"},
             "type":"Opaque","data":{"CLUSTER_ID":"$b64"}}
            JSON
            curl -sS -X POST --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" --data-binary @/tmp/newsecret.json \
              "$API/api/v1/namespaces/$NAMESPACE/secrets" && echo "Created secret."
        volumeMounts: [{ name: work, mountPath: /work }]

# ============================================================================
# Vault CONFIG job — namespace: vault
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yb-vault-config
  namespace: vault
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  backoffLimit: 0
  template:
    metadata: { annotations: { linkerd.io/inject: "disabled" } }
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes: [{ name: root-token, secret: { secretName: vault-root-token } }]
      containers:
      - name: setup-yb-vault
        image: hashicorp/vault:1.15.4
        env:
        - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
        - { name: AUTH_PATH, value: "kubernetes" }
        - { name: PG_USER, value: "vaultadmin" }
        - { name: SA_NAME, value: "bq-yb-bootstrap" }
        - { name: SA_NAMESPACE, value: "kafka" }
        - { name: PG_HOST, value: "yb-tserver-service.yugabyte.svc.cluster.local" }
        - { name: PG_PORT, value: "5433" }
        - { name: PG_DATABASE, value: "kafka" }
        - { name: YB_MASTER_ADDRESSES, value: "yb-master-0.yugabyte.svc.cluster.local:7100,yb-master-1.yugabyte.svc.cluster.local:7100,yb-master-2.yugabyte.svc.cluster.local:7100" }
        - { name: BQ_BOOTSTRAP_LOCATION, value: "US" }
        - { name: BQ_BOOTSTRAP_PROJECT, value: "k8s-kafka-774d" }
        - { name: BQ_PROJECT, value: "k8s-kafka-774d" }
        - { name: BQ_BOOTSTRAP_BUCKET, value: "suncoast-systems-yb-bootstrap" }
        - { name: BQ_DEFAULT_DATASET, value: "yugabyte_backup" }
        command: ["/bin/sh","-c"]
        args:
          - |
            set -euo pipefail
            until [ -s /vault-token/VAULT_TOKEN ]; do echo "waiting for VAULT_TOKEN..."; sleep 2; done
            export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

            : "${PG_HOST:=yb-tserver-service.yugabyte.svc.cluster.local}"
            : "${PG_PORT:=5433}"
            : "${PG_DATABASE:=kafka}"
            : "${PG_USER:=vaultadmin}"
            : "${YB_MASTER_ADDRESSES:=}"

            : "${BQ_BOOTSTRAP_PROJECT:=}"; : "${BQ_BOOTSTRAP_BUCKET:=}"; : "${BQ_BOOTSTRAP_LOCATION:=}"
            : "${BQ_PROJECT:=}"; : "${BQ_DEFAULT_DATASET:=}"

            BQ_SA_JSON="$(vault kv get -field=value secret/k8s-kafka-gcp-service-account-json 2>/dev/null || true)"
            [ -n "$BQ_SA_JSON" ] && printf '%s' "$BQ_SA_JSON" > /tmp/sa.json || true

            echo "waiting for secret/${PG_USER}..."
            while :; do PASS="$(vault kv get -field=value "secret/${PG_USER}" 2>/dev/null || true)"; [ -n "$PASS" ] && break; echo "retry..."; sleep 5; done

            PG_ARGS=""; [ -n "$PG_HOST" ] && PG_ARGS="$PG_ARGS host=$PG_HOST"
            [ -n "$PG_PORT" ] && PG_ARGS="$PG_ARGS port=$PG_PORT"
            [ -n "$PG_DATABASE" ] && PG_ARGS="$PG_ARGS database=$PG_DATABASE"
            [ -n "$PG_USER" ] && PG_ARGS="$PG_ARGS user=$PG_USER"
            [ -n "$YB_MASTER_ADDRESSES" ] && PG_ARGS="$PG_ARGS master_addresses=$YB_MASTER_ADDRESSES"
            [ -n "$PG_ARGS" ] && vault kv put secret/kafka/pgconfig $PG_ARGS >/dev/null

            BOOT_ARGS=""; [ -n "$BQ_BOOTSTRAP_BUCKET" ] && BOOT_ARGS="$BOOT_ARGS bucket=$BQ_BOOTSTRAP_BUCKET"
            [ -n "$BQ_BOOTSTRAP_PROJECT" ] && BOOT_ARGS="$BOOT_ARGS project=$BQ_BOOTSTRAP_PROJECT"
            [ -n "$BQ_BOOTSTRAP_LOCATION" ] && BOOT_ARGS="$BOOT_ARGS location=$BQ_BOOTSTRAP_LOCATION"
            [ -n "$BOOT_ARGS" ] && vault kv put secret/kafka/bq/bootstrap $BOOT_ARGS >/dev/null

            CFG_ARGS=""; [ -n "$BQ_PROJECT" ] && CFG_ARGS="$CFG_ARGS project=$BQ_PROJECT"
            [ -n "$BQ_DEFAULT_DATASET" ] && CFG_ARGS="$CFG_ARGS dataset=$BQ_DEFAULT_DATASET"
            [ -s /tmp/sa.json ] && CFG_ARGS="$CFG_ARGS sa_json=@/tmp/sa.json"
            [ -n "$CFG_ARGS" ] && vault kv put secret/kafka/bq/config $CFG_ARGS >/dev/null
            [ -s /tmp/sa.json ] && vault kv put secret/kafka/bq/exporter sa_json=@/tmp/sa.json >/dev/null

            vault policy write data-bootstrap - <<'EOP'
            path "secret/data/kafka/pgconfig"     { capabilities = ["read"] }
            path "secret/data/kafka/bq/bootstrap" { capabilities = ["read"] }
            path "secret/data/kafka/bq/config"    { capabilities = ["read"] }
            path "secret/data/kafka/bq/exporter"  { capabilities = ["read"] }
            path "secret/data/vaultadmin"         { capabilities = ["read"] }
            EOP

            vault write auth/${AUTH_PATH}/role/data-bootstrap \
              bound_service_account_names="${SA_NAME}" \
              bound_service_account_namespaces="${SA_NAMESPACE}" \
              policies="data-bootstrap" ttl="24h" >/dev/null
        volumeMounts: [{ name: root-token, mountPath: /vault-token, readOnly: true }]

# ============================================================================
# One-shot Backfill Job (wave 2) — namespace: kafka
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bq-to-yb-bootstrap
  namespace: kafka
  labels: { app: bq-yb-bootstrap }
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels: { app: bq-yb-bootstrap }
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/exit-on-error: "false"
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/kafka/bq/exporter"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/kafka/bq/exporter" -}}
          {{ .Data.data.sa_json }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-bootstrap.env: "secret/data/kafka/bq/bootstrap"
        vault.hashicorp.com/agent-inject-template-bootstrap.env: |
          {{- with secret "secret/data/kafka/bq/bootstrap" -}}
          {{ with .Data.data.bucket }}BUCKET={{ . }}{{ end }}
          {{ with .Data.data.project }}PROJECT={{ . }}{{ end }}
          {{ with .Data.data.location }}LOCATION={{ . }}{{ end }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-pg.env: "secret/data/kafka/pgconfig"
        vault.hashicorp.com/agent-inject-template-pg.env: |
          {{- with secret "secret/data/kafka/pgconfig" -}}
          {{ with .Data.data.host }}PGHOST={{ . }}{{ end }}
          {{ with .Data.data.port }}PGPORT={{ . }}{{ end }}
          {{ with .Data.data.database }}PGDATABASE={{ . }}{{ end }}
          {{ with .Data.data.user }}PGUSER={{ . }}{{ end }}
          {{ with .Data.data.master_addresses }}YB_MASTER_ADDRESSES={{ . }}{{ end }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-pg-admin.env: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-pg-admin.env: |
          {{- with secret "secret/data/vaultadmin" -}}
          PGPASSWORD={{ .Data.data.value }}
          {{- end -}}
    spec:
      serviceAccountName: bq-yb-bootstrap
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes: [{ name: work, emptyDir: {} }]
      containers:
      # 1) planner — time out & NO_TABLES if Vault files never arrive
      - name: planner
        image: yugabytedb/yugabyte:latest
        volumeMounts: [{ name: work, mountPath: /work }]
        command: ["/bin/bash","-lc"]
        args:
          - |
            set -euo pipefail
            # wait up to 120s for Vault files; else assume NO_TABLES and exit 0
            for f in /vault/secrets/pg.env /vault/secrets/pg-admin.env; do
              i=0; while [ ! -s "$f" ]; do
                i=$((i+1)); [ $i -gt 60 ] && echo "NO_TABLES" > /work/NO_TABLES && exit 0
                sleep 2
              done
              . "$f"
            done
            export PGPASSWORD
            : "${PGHOST:=yb-tserver-service.yugabyte.svc.cluster.local}"
            : "${PGPORT:=5433}"
            : "${PGDATABASE:=kafka}"
            : "${PGUSER:=vaultadmin}"
            PGURL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=disable"

            for i in $(seq 1 60); do
              /home/yugabyte/bin/ysqlsh "${PGURL}" -Atc "select 1" >/dev/null 2>&1 && break
              [ "$i" -eq 60 ] && echo "NO_TABLES" > /work/NO_TABLES && exit 0
              sleep 2
            done

            /home/yugabyte/bin/ysqlsh "${PGURL}" -A -t -F '|' -c "
            WITH t AS (
              SELECT n.nspname AS schema, c.relname AS table, d.description
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                LEFT JOIN pg_description d ON d.objoid = c.oid AND d.objsubid = 0
               WHERE c.relkind IN ('r','p') AND d.description IS NOT NULL
            ),
            j AS (
              SELECT schema, \"table\", CASE WHEN left(description,1)='{' THEN description::jsonb ELSE NULL END AS jdesc
                FROM t
            ),
            b AS (
              SELECT schema, \"table\", jdesc->'bootstrap' AS b
                FROM j WHERE jdesc ? 'bootstrap'
            )
            SELECT schema, \"table\",
                   COALESCE(b->>'bq','') AS bq,
                   COALESCE(b->>'gcs_prefix', \"table\") AS gcs_prefix,
                   COALESCE(b->>'format','CSV') AS format,
                   COALESCE(b->>'header','true') AS header,
                   COALESCE(b->>'columns','') AS columns
              FROM b
             WHERE COALESCE( (b->>'enabled')::boolean, false ) = true;
            " > /work/plan.tsv

            [ -s /work/plan.tsv ] || echo "NO_TABLES" > /work/NO_TABLES
      # 2) importer — exits immediately if NO_TABLES
      - name: importer
        image: yugabytedb/yugabyte:latest
        volumeMounts: [{ name: work, mountPath: /work }]
        command: ["/bin/bash","-lc"]
        args:
          - |
            set -euo pipefail
            if [ -f /work/NO_TABLES ]; then touch /work/DONE; exit 0; fi

            . /vault/secrets/pg.env
            . /vault/secrets/pg-admin.env
            export PGPASSWORD
            : "${PGHOST:=yb-tserver-service.yugabyte.svc.cluster.local}"
            : "${PGPORT:=5433}"
            : "${PGDATABASE:=kafka}"
            : "${PGUSER:=vaultadmin}"
            PGURL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=disable"

            i=0; while [ ! -s /work/plan.tsv ]; do
              i=$((i+1)); [ $i -gt 300 ] && echo "Timeout waiting for plan.tsv" && exit 1; sleep 2
            done

            get_columns() {
              local sch="$1" tbl="$2"
              /home/yugabyte/bin/ysqlsh "${PGURL}" -A -t -c "
                SELECT string_agg(quote_ident(column_name), ',')
                FROM information_schema.columns
                WHERE table_schema='${sch}' AND table_name='${tbl}'
                ORDER BY ordinal_position;
              " | tr -d '\n'
            }

            while IFS='|' read -r SCH TBL BQMAP PREFIX FMT HDR COLS; do
              [ -z "${SCH}" ] && continue
              : "${PREFIX:=${TBL}}"; : "${FMT:=CSV}"; : "${HDR:=true}"
              INDIR="/work/in/${PREFIX}"; READY="${INDIR}/READY"
              j=0; while [ ! -f "${READY}" ]; do
                j=$((j+1)); [ $j -gt 360 ] && echo "Timeout waiting for ${READY}" && exit 1
                sleep 2
              done
              if [ -z "${COLS}" ] || [ "${COLS}" = "null" ]; then COLS="$(get_columns "${SCH}" "${TBL}")"; fi
              cat ${INDIR}/*.csv \
                | /home/yugabyte/bin/ysqlsh "${PGURL}" -v ON_ERROR_STOP=1 \
                    -c "\copy ${SCH}.${TBL} (${COLS}) from stdin with (format csv, header ${HDR});"
            done < /work/plan.tsv

            touch /work/DONE
      # 3) cloudsdk — exits immediately if NO_TABLES
      - name: cloudsdk
        image: google/cloud-sdk:latest
        env:
        - { name: GOOGLE_APPLICATION_CREDENTIALS, value: /vault/secrets/gcp-key.json }
        - { name: CLOUDSDK_CORE_DISABLE_PROMPTS, value: "1" }
        volumeMounts: [{ name: work, mountPath: /work }]
        command: ["/bin/bash","-lc"]
        args:
          - |
            set -euo pipefail
            if [ -f /work/NO_TABLES ]; then exit 0; fi

            for f in /vault/secrets/bootstrap.env /vault/secrets/gcp-key.json; do
              j=0; while [ ! -s "$f" ]; do
                j=$((j+1)); [ $j -gt 180 ] && echo "Timeout waiting for $f" && exit 1; sleep 2
              done
            done
            . /vault/secrets/bootstrap.env
            : "${PROJECT:?missing PROJECT}"
            : "${BUCKET:?missing BUCKET}"
            : "${LOCATION:=}"
            if [ -n "${LOCATION}" ]; then BQ_LOC_FLAG=(--location="${LOCATION}"); else BQ_LOC_FLAG=(); fi

            i=0; while [ ! -s /work/plan.tsv ]; do
              i=$((i+1)); [ $i -gt 300 ] && echo "Timeout waiting for plan.tsv" && exit 1; sleep 2
            done

            while IFS='|' read -r SCH TBL BQMAP PREFIX FMT HDR COLS; do
              [ -z "${SCH}" ] && continue
              : "${PREFIX:=${TBL}}"; : "${FMT:=CSV}"; : "${HDR:=true}"
              DEST_URI="gs://${BUCKET}/bootstrap/${PREFIX}/${PREFIX}-*.csv"
              bq "${BQ_LOC_FLAG[@]}" --project_id="${PROJECT}" extract \
                --destination_format="${FMT}" --field_delimiter="," --print_header="${HDR}" \
                "${BQMAP}" "${DEST_URI}"

              OUTDIR="/work/in/${PREFIX}"; mkdir -p "${OUTDIR}"
              gsutil -m cp "gs://${BUCKET}/bootstrap/${PREFIX}/${PREFIX}-*.csv" "${OUTDIR}/"
              touch "${OUTDIR}/READY"
            done < /work/plan.tsv
      # 4) flagger — creates/updates bootstrap.ok
      - name: flagger
        image: curlimages/curl:8.8.0
        volumeMounts: [{ name: work, mountPath: /work }]
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -e
            API="https://kubernetes.default.svc"
            TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            DATA='{"apiVersion":"v1","kind":"ConfigMap","metadata":{"name":"bootstrap.ok","namespace":"kafka","labels":{"app":"bq-yb-bootstrap"}},"data":{"status":"complete","completedAt":"__NOW__"}}'

            if [ ! -f /work/NO_TABLES ]; then
              for i in $(seq 1 360); do [ -f /work/DONE ] && break; sleep 2; done
            fi

            code="$(curl -s -o /tmp/cm.json -w '%{http_code}' --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/kafka/configmaps/bootstrap.ok" || true)"
            if [ "$code" = "200" ]; then
              curl -sS -X PATCH --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/merge-patch+json" \
                --data-binary "$DATA" "$API/api/v1/namespaces/kafka/configmaps/bootstrap.ok" >/dev/null
            else
              curl -sS -X POST --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                --data-binary "$DATA" "$API/api/v1/namespaces/kafka/configmaps" >/dev/null
            fi
            echo "bootstrap.ok created/updated."

# ============================================================================
# Kafka (wave 3): single-broker KRaft
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  type: ClusterIP
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
  selector: { app: kafka }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-hs
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  clusterIP: None
  ports: [{ name: controller, port: 9093, targetPort: 9093 }]
  selector: { app: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  serviceName: kafka-hs
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata:
      labels: { app: kafka }
      annotations: { linkerd.io/inject: "disabled" }
    spec:
      volumes: [{ name: kafka-logs, emptyDir: {} }]
      initContainers:
      - name: format-storage
        image: apache/kafka:3.9.0
        imagePullPolicy: IfNotPresent
        env:
        - name: CLUSTER_ID
          valueFrom: { secretKeyRef: { name: kafka-cluster-id, key: CLUSTER_ID } }
        command: ["/bin/bash","-lc"]
        args:
          - |
            set -euo pipefail
            META="/tmp/kraft-combined-logs/meta.properties"
            if [ -f "$META" ]; then
              echo "meta.properties present; not reformatting."; grep -E '^cluster\.id=' "$META" || true
            else
              /opt/kafka/bin/kafka-storage.sh format \
                -t "${CLUSTER_ID}" -c /opt/kafka/config/kraft/server.properties --ignore-formatted
            fi
        volumeMounts: [{ name: kafka-logs, mountPath: /tmp/kraft-combined-logs }]
      containers:
      - name: broker
        image: apache/kafka:3.9.0
        imagePullPolicy: IfNotPresent
        env:
        - name: CLUSTER_ID
          valueFrom:
            secretKeyRef:
              name: kafka-cluster-id
              key: CLUSTER_ID
        - { name: KAFKA_NODE_ID, value: "1" }
        - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
        - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
        - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
        - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.kafka.svc.cluster.local:9092" }
        - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
        - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-hs.kafka.svc.cluster.local:9093" }
        - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
        - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
        - { name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs" }
        ports:
        - { containerPort: 9092 }
        - { containerPort: 9093 }
        volumeMounts: [{ name: kafka-logs, mountPath: /tmp/kraft-combined-logs }]

# ============================================================================
# Kafka Connect (wave 4)
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "4" }
spec:
  type: ClusterIP
  ports: [{ name: rest, port: 8083, targetPort: 8083 }]
  selector: { app: kafka-connect }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "4" }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-connect } }
  template:
    metadata:
      labels: { app: kafka-connect }
      annotations: { linkerd.io/inject: "disabled" }
    spec:
      volumes: [{ name: plugins, emptyDir: {} }]
      initContainers:
      - name: install-bq
        image: confluentinc/cp-kafka-connect:7.6.1
        command: ["/bin/bash","-lc"]
        args: |
            set -e
            mkdir -p /plugins
            apt-get update >/dev/null 2>&1 || true
            apt-get install -y unzip curl >/dev/null 2>&1 || true
            confluent-hub install --no-prompt --component-dir /plugins \
              wepay/kafka-connect-bigquery:2.5.7
        volumeMounts: [{ name: plugins, mountPath: /plugins }]

        # 2) Copy Yugabyte Debezium gRPC connector from Quay image
      - name: fetch-yb-debezium
        image: quay.io/yugabyte/debezium-connector:dz.1.9.5.yb.grpc.2024.2.2
        command: ["/bin/sh","-lc"]
        args: |
            set -eu
            mkdir -p /plugins/yugabytedb
            # Most Yugabyte images place the connector jars under /kafka-connect
            if [ -d /kafka-connect ]; then
              cp -R /kafka-connect/* /plugins/yugabytedb/
            elif [ -d /debezium-connector ]; then
              cp -R /debezium-connector/* /plugins/yugabytedb/
            else
              echo "Could not find connector payload in image" >&2; ls -la /
              exit 1
            fi
        volumeMounts: [{ name: plugins, mountPath: /plugins }]
      containers:
      - name: connect
        image: confluentinc/cp-kafka-connect:7.6.1
        imagePullPolicy: IfNotPresent
        env:
        - name: CLUSTER_ID
          valueFrom:
            secretKeyRef:
              name: kafka-cluster-id
              key: CLUSTER_ID
        - { name: CONNECT_PLUGIN_PATH, value: "/plugins" }
        - { name: CONNECT_BOOTSTRAP_SERVERS, value: "kafka.kafka.svc.cluster.local:9092" }
        - { name: CONNECT_REST_ADVERTISED_HOST_NAME, value: "kafka-connect" }
        - { name: CONNECT_REST_PORT, value: "8083" }
        - { name: CONNECT_GROUP_ID, value: "connect-cluster" }
        - { name: CONNECT_CONFIG_STORAGE_TOPIC, value: "_connect-configs" }
        - { name: CONNECT_OFFSET_STORAGE_TOPIC, value: "_connect-offsets" }
        - { name: CONNECT_STATUS_STORAGE_TOPIC, value: "_connect-status" }
        - { name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR, value: "1" }
        - { name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR, value: "1" }
        - { name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR, value: "1" }
        - { name: CONNECT_KEY_CONVERTER, value: "org.apache.kafka.connect.json.JsonConverter" }
        - { name: CONNECT_VALUE_CONVERTER, value: "org.apache.kafka.connect.json.JsonConverter" }
        - { name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE, value: "true" }
        - { name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE, value: "true" }
        - { name: CONNECT_PLUGIN_PATH, value: "/plugins" }
        - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
        ports:
        - { containerPort: 8083 }
        readinessProbe:
          httpGet: { path: /connectors, port: 8083 }
          initialDelaySeconds: 20
          periodSeconds: 5
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits: { cpu: "1000m", memory: "1Gi" }
        volumeMounts: [{ name: plugins, mountPath: /plugins }]

# ============================================================================
# Registration Job (wave 5)
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-yb-to-bq
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-inject-secret-yb: "secret/data/kafka/pgconfig"
        vault.hashicorp.com/agent-inject-template-yb: |
          {{- with secret "secret/data/kafka/pgconfig" -}}
          {{ with .Data.data.host }}PGHOST={{ . }}{{ end }}
          {{ with .Data.data.port }}PGPORT={{ . }}{{ end }}
          {{ with .Data.data.database }}PGDATABASE={{ . }}{{ end }}
          {{ with .Data.data.user }}PGUSER={{ . }}{{ end }}
          {{ with .Data.data.master_addresses }}YB_MASTER_ADDRESSES={{ . }}{{ end }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-bq: "secret/data/kafka/bq/config"
        vault.hashicorp.com/agent-inject-template-bq: |
          {{- with secret "secret/data/kafka/bq/config" -}}
          {{ with .Data.data.project }}BQ_PROJECT={{ . }}{{ end }}
          {{ with .Data.data.dataset }}BQ_DEFAULT_DATASET={{ . }}{{ end }}
          {{ with .Data.data.sa_json }}BQ_KEY_JSON={{ . | toJSON }}{{ end }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-pgpass.env: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-pgpass.env: |
          {{- with secret "secret/data/vaultadmin" -}}
          PGPASSWORD={{ .Data.data.value }}
          {{- end }}
    spec:
      serviceAccountName: bq-yb-bootstrap
      restartPolicy: OnFailure
      initContainers:
      - name: wait-bootstrap-ok
        image: curlimages/curl:8.8.0
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -e
            API="https://kubernetes.default.svc"
            TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            until [ "$(curl -sS --cacert "${CACERT}" -H "Authorization: Bearer ${TOKEN}" \
              "${API}/api/v1/namespaces/kafka/configmaps/bootstrap.ok" \
              | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')" = "complete" ]; do
              sleep 5
            done
      containers:
      - name: registrar
        image: yugabytedb/yugabyte:latest
        command: ["/bin/bash","-lc"]
        args:
          - |
            set -euo pipefail
            for f in /vault/secrets/yb /vault/secrets/bq /vault/secrets/pgpass.env; do
              i=0; while [ ! -s "$f" ]; do i=$((i+1)); [ $i -gt 120 ] && exit 1; sleep 2; done
              . "$f"
            done
            export PGPASSWORD
            until curl -fsS http://kafka-connect.kafka.svc.cluster.local:8083/connectors >/dev/null 2>&1; do sleep 5; done

            PGURL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=disable"
            mapfile -t ROWS < <(
              /home/yugabyte/bin/ysqlsh "${PGURL}" -Atc "
                with t as (
                  select table_schema, table_name,
                         obj_description((quote_ident(table_schema)||'.'||quote_ident(table_name))::regclass) as comment
                  from information_schema.tables
                  where table_type='BASE TABLE'
                    and table_schema not in ('pg_catalog','information_schema')
                )
                select table_schema||','||table_name||','||coalesce( (comment::jsonb -> 'bootstrap' ->> 'bq'), '' )
                from t
                where comment is not null
                  and ((comment::jsonb -> 'bootstrap' ->> 'enabled')::boolean is true);
              "
            )
            [ ${#ROWS[@]} -eq 0 ] && exit 0

            SERVER_NAME="yb"
            TABLE_INCLUDE_LIST=""; TOPICS=""; TOPIC2TABLEMAP=""
            for R in "${ROWS[@]}"; do
              SCHEMA="$(echo "$R" | cut -d, -f1)"
              TBL="$(echo "$R" | cut -d, -f2)"
              BQMAP="$(echo "$R" | cut -d, -f3-)"
              FQ="${SCHEMA}.${TBL}"
              TOPIC="${SERVER_NAME}.${FQ}"
              TABLE_INCLUDE_LIST="${TABLE_INCLUDE_LIST}${FQ},"
              TOPICS="${TOPICS}${TOPIC},"
              if [ -n "$BQMAP" ] && [[ "$BQMAP" == *.* ]]; then
                TOPIC2TABLEMAP="${TOPIC2TABLEMAP}${TOPIC}:${BQMAP},"
              else
                TOPIC2TABLEMAP="${TOPIC2TABLEMAP}${TOPIC}:${BQ_DEFAULT_DATASET}.${TBL},"
              fi
            done
            TABLE_INCLUDE_LIST="${TABLE_INCLUDE_LIST%,}"
            TOPICS="${TOPICS%,}"
            TOPIC2TABLEMAP="${TOPIC2TABLEMAP%,}"

            cat > /tmp/yb-source.json <<JSON
            {"name":"yb-source","config":{
              "connector.class":"io.debezium.connector.yugabytedb.YugabyteDBgRPCConnector",
              "tasks.max":"1",
              "database.hostname":"${PGHOST}",
              "database.port":"${PGPORT}",
              "database.master.addresses":"${YB_MASTER_ADDRESSES}",
              "database.user":"${PGUSER}",
              "database.password":"${PGPASSWORD}",
              "database.dbname":"${PGDATABASE}",
              "database.server.name":"${SERVER_NAME}",
              "table.include.list":"${TABLE_INCLUDE_LIST}",
              "snapshot.mode":"never",
              "transforms":"unwrap",
              "transforms.unwrap.type":"io.debezium.connector.yugabytedb.transforms.YBExtractNewRecordState",
              "topic.creation.default.replication.factor":"1",
              "topic.creation.default.partitions":"1",
              "topic.creation.default.cleanup.policy":"delete"}}
            JSON
            curl -fsS -X PUT -H 'Content-Type: application/json' --data-binary @/tmp/yb-source.json \
              http://kafka-connect.kafka.svc.cluster.local:8083/connectors/yb-source/config \
              || curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/yb-source.json \
                   http://kafka-connect.kafka.svc.cluster.local:8083/connectors

            cat > /tmp/bq-sink.json <<JSON
            {"name":"bq-sink","config":{
              "connector.class":"com.wepay.kafka.connect.bigquery.BigQuerySinkConnector",
              "tasks.max":"1",
              "topics":"${TOPICS}",
              "topic2TableMap":"${TOPIC2TABLEMAP}",
              "project":"${BQ_PROJECT}",
              "defaultDataset":"${BQ_DEFAULT_DATASET}",
              "sanitizeTopics":"true",
              "autoCreateTables":"false",
              "allowNewBigQueryFields":"true",
              "allowBigQueryRequiredFieldRelaxation":"true",
              "keySource":"JSON",
              "keyfile": ${BQ_KEY_JSON} }}
            JSON
            curl -fsS -X PUT -H 'Content-Type: application/json' --data-binary @/tmp/bq-sink.json \
              http://kafka-connect.kafka.svc.cluster.local:8083/connectors/bq-sink/config \
              || curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/bq-sink.json \
                   http://kafka-connect.kafka.svc.cluster.local:8083/connectors
