# ============================================================================
# Namespace & RBAC (namespace: kafka)
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels: { app: bq-yb-bootstrap }
  annotations:
    linkerd.io/inject: "disabled"
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=ctrl-node"
    field.cattle.io/projectId: "local:infrastructure"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bq-yb-bootstrap
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-ok-writer
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get","list","create","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-ok-writer
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
subjects:
- kind: ServiceAccount
  name: bq-yb-bootstrap
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bootstrap-ok-writer

# ============================================================================
# Kafka cluster.id generator — namespace: kafka
# ============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-clusterid-gen
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-clusterid-secret-writer
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","patch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-clusterid-secret-writer
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "0" }
subjects:
- kind: ServiceAccount
  name: kafka-clusterid-gen
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-clusterid-secret-writer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gen-kafka-clusterid
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations: { linkerd.io/inject: "disabled" }
    spec:
      restartPolicy: Never
      serviceAccountName: kafka-clusterid-gen
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        - name: gen
          image: busybox:1.36.1
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              mkdir -p /work
              CID="$(cat /proc/sys/kernel/random/uuid 2>/dev/null || uuidgen 2>/dev/null || date +%s%N)"
              echo "Generated cluster.id: ${CID}"
              printf '%s' "${CID}" > /work/cluster.id
              ls -l /work/cluster.id
          volumeMounts: [{ name: work, mountPath: /work }]
      containers:
        - name: apply
          image: curlimages/curl:8.8.0
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              PS4='+ [APPLY] $(date -Is) '
              set -x
              NAMESPACE="kafka"; SECRET_NAME="kafka-cluster-id"
              API="https://kubernetes.default.svc"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

              # initContainer guarantees this exists, but keep a fallback just in case
              if [ ! -s /work/cluster.id ]; then
                CID="$(cat /proc/sys/kernel/random/uuid 2>/dev/null || date +%s%N)"
                printf '%s' "$CID" > /work/cluster.id
              fi
              CID="$(cat /work/cluster.id)"

              code="$(curl -s -o /tmp/ex.json -w '%{http_code}' --cacert "$CACERT" \
                     -H "Authorization: Bearer $TOKEN" \
                     "$API/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME" || true)"

              if [ "$code" = "200" ]; then
                echo "Secret exists; nothing to do."
                exit 0
              fi

              b64="$(printf '%s' "$CID" | base64 | tr -d '\n')"
              printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","namespace":"%s"},"type":"Opaque","data":{"CLUSTER_ID":"%s"}}' \
                "$SECRET_NAME" "$NAMESPACE" "$b64" > /tmp/newsecret.json

              curl -sS -D /tmp/h.txt -o /tmp/r.txt -X POST --cacert "$CACERT" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                --data-binary @/tmp/newsecret.json \
                "$API/api/v1/namespaces/$NAMESPACE/secrets" && echo "Created secret."

              echo "=== response headers ==="; cat /tmp/h.txt
              echo "=== body ==="; cat /tmp/r.txt
          volumeMounts: [{ name: work, mountPath: /work }]

# ============================================================================
# Vault CONFIG job — namespace: vault
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yb-vault-config
  namespace: vault
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  backoffLimit: 0
  template:
    metadata: { annotations: { linkerd.io/inject: "disabled" } }
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes: [{ name: root-token, secret: { secretName: vault-root-token } }]
      containers:
      - name: setup-yb-vault
        image: hashicorp/vault:1.15.4
        env:
        - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
        - { name: AUTH_PATH, value: "kubernetes" }
        - { name: PG_USER, value: "vaultadmin" }
        - { name: SA_NAME, value: "bq-yb-bootstrap" }
        - { name: SA_NAMESPACE, value: "kafka" }
        - { name: PG_HOST, value: "yb-tserver-service.yugabyte.svc.cluster.local" }
        - { name: PG_PORT, value: "5433" }
        - { name: PG_DATABASE, value: "kafka" }
        - { name: YB_MASTER_ADDRESSES, value: "yb-master-0.yb-master-service.yugabyte.svc.cluster.local:7100,yb-master-1.yb-master-service.yugabyte.svc.cluster.local:7100,yb-master-2.yb-master-service.yugabyte.svc.cluster.local:7100" }
        - { name: BQ_BOOTSTRAP_LOCATION, value: "US" }
        - { name: BQ_BOOTSTRAP_PROJECT, value: "k8s-kafka-774d" }
        - { name: BQ_PROJECT, value: "k8s-kafka-774d" }
        - { name: BQ_BOOTSTRAP_BUCKET, value: "suncoast-systems-yb-bootstrap" }
        - { name: BQ_DEFAULT_DATASET, value: "yugabyte_backup" }
        command: ["/bin/sh","-c"]
        args: 
        - |
          set -eu
          PS4='+ [VAULTCFG] $(date -Is) '
          set -x
          trap 'echo "[VAULTCFG] failed; dumping debug"; env | sort; exit 1' ERR
          until [ -s /vault-token/VAULT_TOKEN ]; do echo "waiting for VAULT_TOKEN..."; sleep 2; done
          export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
          : "${PGHOST:=yb-tserver-service.yugabyte.svc.cluster.local}"
          : "${PGPORT:=5433}"
          : "${PGDATABASE:=kafka}"
          : "${PGUSER:=vaultadmin}"
          : "${YB_MASTER_ADDRESSES:=}"
          : "${BQ_BOOTSTRAP_PROJECT:=}"; : "${BQ_BOOTSTRAP_BUCKET:=}"; : "${BQ_BOOTSTRAP_LOCATION:=}"
          : "${BQ_PROJECT:=}"; : "${BQ_DEFAULT_DATASET:=}"
          echo "→ Pulling GCP SA JSON from Vault (masked)…"
          BQ_SA_JSON="$(vault kv get -field=value secret/k8s-kafka-gcp-service-account-json 2>/dev/null || true)"
          [ -n "$BQ_SA_JSON" ] && printf '%s' "$BQ_SA_JSON" > /tmp/sa.json || true
          echo "→ Waiting for secret/${PGUSER} password in Vault…"
          while :; do PASS="$(vault kv get -field=value "secret/${PGUSER}" 2>/dev/null || true)"; [ -n "$PASS" ] && break; echo "retry..."; sleep 5; done
          PG_ARGS=""; [ -n "$PGHOST" ] && PG_ARGS="$PG_ARGS host=$PGHOST"
          [ -n "$PGPORT" ] && PG_ARGS="$PG_ARGS port=$PGPORT"
          [ -n "$PGDATABASE" ] && PG_ARGS="$PG_ARGS database=$PGDATABASE"
          [ -n "$PGUSER" ] && PG_ARGS="$PG_ARGS user=$PGUSER"
          [ -n "$YB_MASTER_ADDRESSES" ] && PG_ARGS="$PG_ARGS master_addresses=$YB_MASTER_ADDRESSES"
          [ -n "$PG_ARGS" ] && vault kv put secret/kafka/pgconfig $PG_ARGS >/dev/null && echo "→ Wrote secret/kafka/pgconfig"
          BOOT_ARGS=""; [ -n "$BQ_BOOTSTRAP_BUCKET" ] && BOOT_ARGS="$BOOT_ARGS bucket=$BQ_BOOTSTRAP_BUCKET"
          [ -n "$BQ_BOOTSTRAP_PROJECT" ] && BOOT_ARGS="$BOOT_ARGS project=$BQ_BOOTSTRAP_PROJECT"
          [ -n "$BQ_BOOTSTRAP_LOCATION" ] && BOOT_ARGS="$BOOT_ARGS location=$BQ_BOOTSTRAP_LOCATION"
          [ -n "$BOOT_ARGS" ] && vault kv put secret/kafka/bq/bootstrap $BOOT_ARGS >/dev/null && echo "→ Wrote secret/kafka/bq/bootstrap"
          CFG_ARGS=""; [ -n "$BQ_PROJECT" ] && CFG_ARGS="$CFG_ARGS project=$BQ_PROJECT"
          [ -n "$BQ_DEFAULT_DATASET" ] && CFG_ARGS="$CFG_ARGS dataset=$BQ_DEFAULT_DATASET"
          [ -s /tmp/sa.json ] && CFG_ARGS="$CFG_ARGS sa_json=@/tmp/sa.json"
          [ -n "$CFG_ARGS" ] && vault kv put secret/kafka/bq/config $CFG_ARGS >/dev/null || true
          [ -s /tmp/sa.json ] && vault kv put secret/kafka/bq/exporter sa_json=@/tmp/sa.json >/dev/null && echo "→ Wrote secret/kafka/bq/exporter"
          vault policy write data-bootstrap - <<'EOP'
          path "secret/data/kafka/pgconfig"     { capabilities = ["read"] }
          path "secret/data/kafka/bq/bootstrap" { capabilities = ["read"] }
          path "secret/data/kafka/bq/config"    { capabilities = ["read"] }
          path "secret/data/kafka/bq/exporter"  { capabilities = ["read"] }
          path "secret/data/vaultadmin"         { capabilities = ["read"] }
          EOP
          vault write auth/${AUTH_PATH}/role/data-bootstrap \
            bound_service_account_names="${SA_NAME}" \
            bound_service_account_namespaces="${SA_NAMESPACE}" \
            policies="data-bootstrap" ttl="24h" >/dev/null
          echo "✅ Vault config done."
        volumeMounts: [{ name: root-token, mountPath: /vault-token, readOnly: true }]

# ============================================================================
# DB init job (wave 2)
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yb-db-init
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/exit-on-error: "false"
        vault.hashicorp.com/agent-inject-secret-pg.env: "secret/data/kafka/pgconfig"
        vault.hashicorp.com/agent-inject-template-pg.env: |
          {{- with secret "secret/data/kafka/pgconfig" -}}
          {{ with .Data.data.host }}PGHOST={{ . }}{{ end }}
          {{ with .Data.data.port }}PGPORT={{ . }}{{ end }}
          {{ with .Data.data.database }}PGDATABASE={{ . }}{{ end }}
          {{ with .Data.data.user }}PGUSER={{ . }}{{ end }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-pg-admin.env: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-pg-admin.env: |
          {{- with secret "secret/data/vaultadmin" -}}
          PGPASSWORD={{ .Data.data.value }}
          {{- end -}}
    spec:
      restartPolicy: Never
      serviceAccountName: bq-yb-bootstrap
      containers:
      - name: initdb
        image: yugabytedb/yugabyte:latest
        command: ["/bin/bash","-lc"]
        args: 
        - |
          set -Eeuo pipefail
          PS4='+ [DBINIT] $(date -Is) '
          set -x
          for f in /vault/secrets/pg.env /vault/secrets/pg-admin.env; do
            i=0; while [ ! -s "$f" ]; do
              i=$((i+1)); [ $i -gt 120 ] && echo "[DBINIT] missing $f" >&2 && exit 1; sleep 2
            done
            . "$f"
          done
          : "${PGHOST:=yb-tserver-service.yugabyte.svc.cluster.local}"
          : "${PGPORT:=5433}"
          : "${PGDATABASE:=kafka}"
          : "${PGUSER:=vaultadmin}"
          export PGPASSWORD
          CONTROL_DB=""
          for DB in yugabyte postgres; do
            /home/yugabyte/bin/ysqlsh -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$DB" -Atc "select 1" >/dev/null 2>&1 \
              && { CONTROL_DB="$DB"; break; }
          done
          [ -z "$CONTROL_DB" ] && { echo "[DBINIT] cannot reach control DB as $PGUSER"; exit 1; }
          DBNAME="$PGDATABASE"
          /home/yugabyte/bin/ysqlsh -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$CONTROL_DB" -v ON_ERROR_STOP=1 -v dbname="$DBNAME" <<'SQL'
          SELECT format('CREATE DATABASE %I OWNER vaultadmin', :'dbname')
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'dbname');
          \gexec
          SQL
          /home/yugabyte/bin/ysqlsh -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$DBNAME" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.debezium_signal (
            id   varchar(64) PRIMARY KEY,
            type varchar(32) NOT NULL,
            data varchar(2048)
          );
          SELECT 'CREATE PUBLICATION dbz_publication FOR ALL TABLES'
          WHERE NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'dbz_publication');
          \gexec
          SQL

# ============================================================================
# One-shot Backfill Job (wave 3)
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bq-to-yb-bootstrap
  namespace: kafka
  labels: { app: bq-yb-bootstrap }
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels: { app: bq-yb-bootstrap }
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/exit-on-error: "false"
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/kafka/bq/exporter"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/kafka/bq/exporter" -}}
          {{ .Data.data.sa_json }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-bootstrap.env: "secret/data/kafka/bq/bootstrap"
        vault.hashicorp.com/agent-inject-template-bootstrap.env: |
          {{- with secret "secret/data/kafka/bq/bootstrap" -}}
          {{ with .Data.data.bucket }}BUCKET={{ . }}{{ end }}
          {{ with .Data.data.project }}PROJECT={{ . }}{{ end }}
          {{ with .Data.data.location }}LOCATION={{ . }}{{ end }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-pg.env: "secret/data/kafka/pgconfig"
        vault.hashicorp.com/agent-inject-template-pg.env: |
          {{- with secret "secret/data/kafka/pgconfig" -}}
          {{ with .Data.data.host }}PGHOST={{ . }}{{ end }}
          {{ with .Data.data.port }}PGPORT={{ . }}{{ end }}
          {{ with .Data.data.database }}PGDATABASE={{ . }}{{ end }}
          {{ with .Data.data.user }}PGUSER={{ . }}{{ end }}
          {{ with .Data.data.master_addresses }}YB_MASTER_ADDRESSES={{ . }}{{ end }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-pg-admin.env: "secret/data/vaultadmin"
        vault.hashicorp.com/agent-inject-template-pg-admin.env: |
          {{- with secret "secret/data/vaultadmin" -}}
          PGPASSWORD={{ .Data.data.value }}
          {{- end -}}
    spec:
      serviceAccountName: bq-yb-bootstrap
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes: [{ name: work, emptyDir: {} }]
      containers:
      - name: planner
        image: yugabytedb/yugabyte:latest
        volumeMounts: [{ name: work, mountPath: /work }]
        command: ["/bin/bash","-lc"]
        args: 
        - |
          set -Eeuo pipefail
          PS4='+ [PLANNER] $(date -Is) '
          set -x
          trap 'echo "[PLANNER] FAIL: env:"; env | sort; echo "--- plan.tsv ---"; cat /work/plan.tsv 2>/dev/null || true; exit 1' ERR
          for f in /vault/secrets/pg.env /vault/secrets/pg-admin.env; do
            i=0; while [ ! -s "$f" ]; do
              i=$((i+1)); [ $i -gt 60 ] && echo "NO_TABLES" > /work/NO_TABLES && exit 0
              sleep 2
            done
            . "$f"
          done
          export PGPASSWORD
          : "${PGHOST:=yb-tserver-service.yugabyte.svc.cluster.local}"
          : "${PGPORT:=5433}"
          : "${PGDATABASE:=kafka}"
          : "${PGUSER:=vaultadmin}"
          PGURL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=disable"
          echo "[PLANNER] Using ${PGURL%:*}***"
          for i in $(seq 1 60); do
            /home/yugabyte/bin/ysqlsh "${PGURL}" -Atc "select 1" >/dev/null 2>&1 && break
            [ "$i" -eq 60 ] && echo "NO_TABLES" > /work/NO_TABLES && exit 0
            sleep 2
          done
          SQL="
          WITH t AS (
            SELECT n.nspname AS schema, c.relname AS table, d.description
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              LEFT JOIN pg_description d ON d.objoid = c.oid AND d.objsubid = 0
             WHERE c.relkind IN ('r','p') AND d.description IS NOT NULL
          ),
          j AS (
            SELECT schema, \"table\",
                   CASE WHEN description ~ '^[[:space:]]*\\{'
                        THEN (regexp_replace(description, '^[[:space:]]*', ''))::jsonb
                        ELSE NULL END AS jdesc
              FROM t
          ),
          b AS (
            SELECT schema, \"table\", jdesc->'bootstrap' AS b
              FROM j WHERE jdesc ? 'bootstrap'
          )
          SELECT schema, \"table\",
                 COALESCE(b->>'bq','') AS bq,
                 COALESCE(b->>'gcs_prefix', \"table\") AS gcs_prefix,
                 COALESCE(b->>'format','CSV') AS format,
                 COALESCE(b->>'header','true') AS header,
                 COALESCE(b->>'columns','') AS columns
            FROM b
           WHERE COALESCE( (b->>'enabled')::boolean, false ) = true;
          "
          /home/yugabyte/bin/ysqlsh "${PGURL}" -q -A -t -F '|' -c "$SQL" > /work/plan.tsv
          echo "[PLANNER] Plan rows: $(grep -c '|' /work/plan.tsv || true)"
          echo "--- plan.tsv ---"; cat /work/plan.tsv || true
          [ -s /work/plan.tsv ] || echo "NO_TABLES" > /work/NO_TABLES
      - name: importer
        image: yugabytedb/yugabyte:latest
        volumeMounts: [{ name: work, mountPath: /work }]
        command: ["/bin/bash","-lc"]
        args: 
        - |
          set -Eeuo pipefail
          PS4='+ [IMPORTER] $(date -Is) '
          set -x
          trap 'echo "[IMPORTER] FAIL; listing /work"; ls -R /work || true; exit 1' ERR
          if [ -f /work/NO_TABLES ]; then
            echo "[IMPORTER] NO_TABLES flag set; exiting."
            touch /work/DONE
            exit 0
          fi
          . /vault/secrets/pg.env
          . /vault/secrets/pg-admin.env
          export PGPASSWORD
          : "${PGHOST:=yb-tserver-service.yugabyte.svc.cluster.local}"
          : "${PGPORT:=5433}"
          : "${PGDATABASE:=kafka}"
          : "${PGUSER:=vaultadmin}"
          PGURL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=disable"
          i=0
          while [ ! -s /work/plan.tsv ]; do
            if [ -f /work/NO_TABLES ]; then
              echo "[IMPORTER] NO_TABLES flag appeared while waiting; exiting."
              touch /work/DONE
              exit 0
            fi
            i=$((i+1))
            [ $i -gt 300 ] && echo "Timeout waiting for plan.tsv" && exit 1
            sleep 2
          done
          get_columns() {
            local sch="$1" tbl="$2"
            /home/yugabyte/bin/ysqlsh "${PGURL}" -q -A -t -c "
              SELECT string_agg(quote_ident(column_name), ',')
              FROM information_schema.columns
              WHERE table_schema='${sch}' AND table_name='${tbl}'
              ORDER BY ordinal_position;
            " | tr -d '\n'
          }
          while IFS='|' read -r SCH TBL BQMAP PREFIX FMT HDR COLS; do
            [ -z "${SCH}" ] && continue
            : "${PREFIX:=${TBL}}"; : "${FMT:=CSV}"; : "${HDR:=true}"
            INDIR="/work/in/${PREFIX}"; READY="${INDIR}/READY"
            j=0; while [ ! -f "${READY}" ]; do
              j=$((j+1)); [ $j -gt 360 ] && echo "Timeout waiting for ${READY}" && exit 1
              sleep 2
            done
            if [ -z "${COLS}" ] || [ "${COLS}" = "null" ]; then COLS="$(get_columns "${SCH}" "${TBL}")"; fi
            echo "[IMPORTER] Loading ${SCH}.${TBL}"
            cat ${INDIR}/*.csv \
              | /home/yugabyte/bin/ysqlsh "${PGURL}" -v ON_ERROR_STOP=1 -q \
                  -c "COPY ${SCH}.${TBL} (${COLS}) FROM STDIN WITH (FORMAT csv, HEADER ${HDR});"
          done < /work/plan.tsv
          touch /work/DONE
      - name: cloudsdk
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
        env:
        - { name: GOOGLE_APPLICATION_CREDENTIALS, value: /vault/secrets/gcp-key.json }
        - { name: CLOUDSDK_CORE_DISABLE_PROMPTS, value: "1" }
        volumeMounts: [{ name: work, mountPath: /work }]
        command: ["/bin/bash","-lc"]
        args: 
        - |
          set -Eeuo pipefail
          PS4='+ [CLOUDSDK] $(date -Is) '
          set -x
          trap 'echo "[CLOUDSDK] FAIL; list /work"; ls -R /work || true; exit 1' ERR
          if [ -f /work/NO_TABLES ]; then
            echo "[CLOUDSDK] NO_TABLES flag; skipping."
            exit 0
          fi
          for f in /vault/secrets/bootstrap.env /vault/secrets/gcp-key.json; do
            j=0; while [ ! -s "$f" ]; do
              j=$((j+1)); [ $j -gt 180 ] && echo "Timeout waiting for $f" && exit 1; sleep 2
            done
          done
          . /vault/secrets/bootstrap.env
          : "${PROJECT:?missing PROJECT}"
          : "${BUCKET:?missing BUCKET}"
          : "${LOCATION:=}"
          if [ -n "${LOCATION}" ]; then BQ_LOC_FLAG=(--location="${LOCATION}"); else BQ_LOC_FLAG=(); fi
          i=0
          while [ ! -s /work/plan.tsv ]; do
            if [ -f /work/NO_TABLES ]; then
              echo "[CLOUDSDK] NO_TABLES flag appeared while waiting; skipping."
              exit 0
            fi
            i=$((i+1)); [ $i -gt 300 ] && echo "Timeout waiting for plan.tsv" && exit 1
            sleep 2
          done
          while IFS='|' read -r SCH TBL BQMAP PREFIX FMT HDR COLS; do
            [ -z "${SCH}" ] && continue
            : "${PREFIX:=${TBL}}"; : "${FMT:=CSV}"; : "${HDR:=true}"
            if [ -z "${BQMAP}" ] && [ -n "${PROJECT}" ]; then
              echo "[CLOUDSDK] Skipping ${SCH}.${TBL}: empty BQ mapping"
              continue
            fi
            echo "[CLOUDSDK] Exporting ${BQMAP} → gs://${BUCKET}/bootstrap/${PREFIX}/${PREFIX}-*.csv"
            DEST_URI="gs://${BUCKET}/bootstrap/${PREFIX}/${PREFIX}-*.csv"
            bq "${BQ_LOC_FLAG[@]}" --project_id="${PROJECT}" extract \
              --destination_format="${FMT}" --field_delimiter="," --print_header="${HDR}" \
              "${BQMAP}" "${DEST_URI}"
            OUTDIR="/work/in/${PREFIX}"; mkdir -p "${OUTDIR}"
            gsutil -m -o "GSUtil:parallel_process_count=1" cp "gs://${BUCKET}/bootstrap/${PREFIX}/${PREFIX}-*.csv" "${OUTDIR}/"
            touch "${OUTDIR}/READY"
          done < /work/plan.tsv
      - name: flagger
        image: curlimages/curl:8.8.0
        volumeMounts: [{ name: work, mountPath: /work }]
        command: ["/bin/sh","-lc"]
        args: 
        - |
          set -eu
          PS4='+ [FLAGGER] $(date -Is) '
          set -x
          API="https://kubernetes.default.svc"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          NOW="$(date -Is)"
          DATA='{"apiVersion":"v1","kind":"ConfigMap","metadata":{"name":"bootstrap.ok","namespace":"kafka","labels":{"app":"bq-yb-bootstrap"}},"data":{"status":"complete","completedAt":"'"$NOW"'"}}'
          if [ ! -f /work/NO_TABLES ]; then
            for i in $(seq 1 360); do [ -f /work/DONE ] && break; sleep 2; done
          fi
          code="$(curl -s -o /tmp/cm.json -w '%{http_code}' --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" "$API/api/v1/namespaces/kafka/configmaps/bootstrap.ok" || true)"
          if [ "$code" = "200" ]; then
            curl -sS -X PATCH --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/merge-patch+json" \
              --data-binary "$DATA" "$API/api/v1/namespaces/kafka/configmaps/bootstrap.ok" >/dev/null
          else
            curl -sS -X POST --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary "$DATA" "$API/api/v1/namespaces/kafka/configmaps" >/dev/null
          fi
          echo "bootstrap.ok created/updated."

# ============================================================================
# Kafka (wave 3): single-broker KRaft
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  type: ClusterIP
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
  selector: { app: kafka }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-hs
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  clusterIP: None
  ports: [{ name: controller, port: 9093, targetPort: 9093 }]
  selector: { app: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  serviceName: kafka-hs
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata:
      labels: { app: kafka }
      annotations: { linkerd.io/inject: "disabled" }
    spec:
      securityContext:
        fsGroup: 1000
      volumes: [{ name: kafka-logs, emptyDir: {} }]
      initContainers:
      - name: format-storage
        image: apache/kafka:3.9.0
        imagePullPolicy: IfNotPresent
        env:
        - name: CLUSTER_ID
          valueFrom: { secretKeyRef: { name: kafka-cluster-id, key: CLUSTER_ID } }
        command: ["/bin/bash","-lc"]
        args: 
        - |
          set -Eeuo pipefail
          PS4='+ [KAFKA-FMT] $(date -Is) '
          set -x
          META="/tmp/kraft-combined-logs/meta.properties"
          if [ -f "$META" ]; then
            echo "meta.properties present; not reformatting."; grep -E '^cluster\.id=' "$META" || true
          else
            /opt/kafka/bin/kafka-storage.sh format \
              -t "${CLUSTER_ID}" -c /opt/kafka/config/kraft/server.properties --ignore-formatted
          fi
        volumeMounts: [{ name: kafka-logs, mountPath: /tmp/kraft-combined-logs }]
      containers:
      - name: broker
        image: apache/kafka:3.9.0
        imagePullPolicy: IfNotPresent
        env:
        - name: CLUSTER_ID
          valueFrom:
            secretKeyRef:
              name: kafka-cluster-id
              key: CLUSTER_ID
        - { name: KAFKA_NODE_ID, value: "1" }
        - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
        - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
        - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
        - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.kafka.svc.internal.lan:9092" }
        - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
        - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-hs.kafka.svc.internal.lan:9093" }
        - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
        - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
        - { name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs" }
        ports:
        - { containerPort: 9092 }
        - { containerPort: 9093 }
        readinessProbe:
          tcpSocket: { port: 9092 }
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits: { cpu: "1500m", memory: "2Gi" }
        volumeMounts: [{ name: kafka-logs, mountPath: /tmp/kraft-combined-logs }]

# ============================================================================
# Kafka Connect (wave 4) — Vault-injected GCP keyfile
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "4" }
spec:
  type: ClusterIP
  ports: [{ name: rest, port: 8083, targetPort: 8083 }]
  selector: { app: kafka-connect }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-log4j
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "4" }
data:
  log4j.properties: |
    log4j.rootLogger=INFO, stdout
    log4j.appender.stdout=org.apache.log4j.ConsoleAppender
    log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
    log4j.appender.stdout.layout.ConversionPattern=[%d{ISO8601}] %-5p %c - %m%n

    log4j.logger.org.apache.kafka.connect.runtime.rest=WARN
    log4j.logger.org.apache.kafka.connect.runtime=INFO
    log4j.logger.io.debezium=DEBUG
    log4j.logger.io.debezium.connector.yugabytedb=DEBUG
    log4j.logger.com.wepay.kafka.connect.bigquery=DEBUG
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: kafka
  annotations: { argocd.argoproj.io/sync-wave: "4" }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-connect } }
  template:
    metadata:
      labels: { app: kafka-connect }
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/exit-on-error: "false"
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/kafka/bq/config"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/kafka/bq/config" -}}
          {{ .Data.data.sa_json }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-permissions-gcp-key.json: "0644"
    spec:
      serviceAccountName: bq-yb-bootstrap
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
      volumes:
      - { name: plugins, emptyDir: {} }
      - name: log4j
        configMap:
          name: kafka-connect-log4j
          items:
          - key: log4j.properties
            path: log4j.properties
      initContainers:
      - name: install-bq
        image: confluentinc/cp-kafka-connect:7.6.1
        command: ["/bin/bash","-lc"]
        args: 
        - |
          set -Eeuo pipefail
          PS4='+ [INSTALL-BQ] $(date -Is) '
          set -x
          mkdir -p /plugins
          confluent-hub install --no-prompt --component-dir /plugins \
            wepay/kafka-connect-bigquery:2.5.7
        volumeMounts: [{ name: plugins, mountPath: /plugins }]
      - name: fetch-yb-connector
        image: quay.io/yugabyte/debezium-connector:latest
        command: ["/bin/sh","-lc"]
        args: 
        - |
          set -eu
          PS4='+ [FETCH-YB] $(date -Is) '
          set -x
          mkdir -p /out/yugabytedb
          for SRC in /plugins /kafka/connect /kafka/connectors /kafka/connect/yugabytedb /opt/kafka/connect /opt/kafka/plugins /debezium-connector /kafka; do
            if [ -d "$SRC" ] && [ -n "$(ls -A "$SRC" 2>/dev/null || true)" ]; then
              echo "Found YugabyteDB connector payload at $SRC"
              cp -R "$SRC"/* /out/yugabytedb/
              # Drop CloudEvents converter if present (not needed)
              find /out/yugabytedb -type f \( -iname '*cloudevents*.jar' -o -iname 'debezium-converter-cloud-events-*.jar' \) -print -delete || true
              exit 0
            fi
          done
          echo "Could not find connector payload"; exit 1
        volumeMounts:
        - { name: plugins, mountPath: /out }
      containers:
      - name: connect
        image: quay.io/debezium/connect:1.9.7.Final
        imagePullPolicy: IfNotPresent
        env:
        - name: CLUSTER_ID
          valueFrom:
            secretKeyRef:
              name: kafka-cluster-id
              key: CLUSTER_ID

        - { name: REST_HOST_NAME, value: "0.0.0.0" }
        - { name: REST_PORT, value: "8083" }
        - { name: ADVERTISED_HOST_NAME, value: "kafka-connect.kafka.svc.internal.lan" }
        - { name: ADVERTISED_PORT, value: "8083" }

        - { name: KAFKA_LOG4J_OPTS, value: "-Dlog4j.configuration=file:/kafka/etc/log4j.properties" }

        - { name: BOOTSTRAP_SERVERS, value: "kafka.kafka.svc.internal.lan:9092" }
        - { name: GROUP_ID, value: "connect-cluster" }
        - { name: CONFIG_STORAGE_TOPIC, value: "_connect-configs" }
        - { name: OFFSET_STORAGE_TOPIC,  value: "_connect-offsets" }
        - { name: STATUS_STORAGE_TOPIC,  value: "_connect-status" }
        - { name: CONFIG_STORAGE_REPLICATION_FACTOR, value: "1" }
        - { name: OFFSET_STORAGE_REPLICATION_FACTOR,  value: "1" }
        - { name: STATUS_STORAGE_REPLICATION_FACTOR,  value: "1" }

        - { name: KEY_CONVERTER, value: "org.apache.kafka.connect.json.JsonConverter" }
        - { name: VALUE_CONVERTER, value: "org.apache.kafka.connect.json.JsonConverter" }
        - { name: KEY_CONVERTER_SCHEMAS_ENABLE, value: "true" }
        - { name: VALUE_CONVERTER_SCHEMAS_ENABLE, value: "true" }

        - { name: CONNECT_PLUGIN_PATH, value: "/plugins,/plugins/share/java,/plugins/share/confluent-hub-components,/plugins/yugabytedb" }

        - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
        - { name: GOOGLE_APPLICATION_CREDENTIALS, value: "/vault/secrets/gcp-key.json" }

        ports:
        - { containerPort: 8083 }

        readinessProbe:
          httpGet: { path: /connectors, port: 8083 }
          initialDelaySeconds: 60
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /, port: 8083 }
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests: { cpu: "250m", memory: "768Mi" }
          limits: { cpu: "1000m", memory: "1.5Gi" }
        volumeMounts:
        - { name: plugins, mountPath: /plugins }
        - { name: log4j,  mountPath: /kafka/etc }

