# ============================================================================
# Namespace & RBAC
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: data-bootstrap
  labels: { app: bq-yb-bootstrap }
  annotations:
    linkerd.io/inject: disabled
    field.cattle.io/projectId: local:infrastructure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bq-yb-bootstrap
  namespace: data-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-ok-writer
  namespace: data-bootstrap
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get","list","create","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-ok-writer
  namespace: data-bootstrap
subjects:
- kind: ServiceAccount
  name: bq-yb-bootstrap
roleRef:
  kind: Role
  name: bootstrap-ok-writer
  apiGroup: rbac.authorization.k8s.io

# ============================================================================
# One-shot Job: discover flagged tables (via COMMENT JSON), BQ -> GCS -> Yugabyte
# Vault secrets required (adjust paths to your mounts):
#   - secret/data/gcp/bq-exporter        -> key_json
#   - secret/data/platform/bq-bootstrap  -> bucket, project, (optional) location
#   - secret/data/platform/yugabyte      -> host, port, database
#   - yugabyte-db/creds/bootstrap        -> username, password (dynamic YSQL creds)
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bq-to-yb-bootstrap
  namespace: data-bootstrap
  labels: { app: bq-yb-bootstrap }
  annotations:
    argocd.argoproj.io/hook: Sync
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: bq-yb-bootstrap }
      annotations:
        linkerd.io/inject: disabled
        vault.hashicorp.com/agent-inject: "enabled"
        # ---- GCP SA key -----------------------------------------------------
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/gcp/bq-exporter"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/gcp/bq-exporter" -}}
          {{ .Data.data.key_json }}
          {{- end -}}
        # ---- Bootstrap env (bucket/project/location) ------------------------
        vault.hashicorp.com/agent-inject-secret-bootstrap.env: "secret/data/platform/bq-bootstrap"
        vault.hashicorp.com/agent-inject-template-bootstrap.env: |
          {{- with secret "secret/data/platform/bq-bootstrap" -}}
          BUCKET={{ .Data.data.bucket }}
          PROJECT={{ .Data.data.project }}
          {{- if .Data.data.location }}LOCATION={{ .Data.data.location }}{{ end }}
          {{- end -}}
        # ---- Yugabyte connection (host/port/db) -----------------------------
        vault.hashicorp.com/agent-inject-secret-pg-static.env: "secret/data/platform/yugabyte"
        vault.hashicorp.com/agent-inject-template-pg-static.env: |
          {{- with secret "secret/data/platform/yugabyte" -}}
          PGHOST={{ .Data.data.host }}
          PGPORT={{ .Data.data.port }}
          PGDATABASE={{ .Data.data.database }}
          {{- end -}}
        # ---- Yugabyte dynamic creds (DB secrets engine) ---------------------
        vault.hashicorp.com/agent-inject-secret-pg-creds.env: "yugabyte-db/creds/bootstrap"
        vault.hashicorp.com/agent-inject-template-pg-creds.env: |
          {{- with secret "yugabyte-db/creds/bootstrap" -}}
          PGUSER={{ .Data.username }}
          PGPASSWORD={{ .Data.password }}
          {{- end -}}
    spec:
      serviceAccountName: bq-yb-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: runner
        image: google/cloud-sdk:latest   # has bq/gsutil/kubectl; we'll apt-get psql + jq
        imagePullPolicy: IfNotPresent
        env:
          - name: GOOGLE_APPLICATION_CREDENTIALS
            value: /vault/secrets/gcp-key.json
        volumeMounts:
          - name: vault-secrets
            mountPath: /vault/secrets
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -eu

            # --- Wait for Vault-injected files --------------------------------
            for f in /vault/secrets/bootstrap.env /vault/secrets/pg-static.env /vault/secrets/pg-creds.env /vault/secrets/gcp-key.json; do
              i=0
              while [ ! -s "$f" ]; do
                i=$((i+1)); [ $i -gt 120 ] && echo "❌ Timeout waiting for $f" && exit 1
                echo "⏳ Waiting for Vault secret $f..."; sleep 2
              done
            done

            # --- Load env ------------------------------------------------------
            . /vault/secrets/bootstrap.env
            . /vault/secrets/pg-static.env
            . /vault/secrets/pg-creds.env

            echo "✅ Secrets loaded. PROJECT=${PROJECT:-unset} BUCKET=${BUCKET:-unset} PGHOST=${PGHOST:-unset}"

            # --- Tools ---------------------------------------------------------
            apt-get update >/dev/null
            apt-get install -y --no-install-recommends postgresql-client jq >/dev/null
            apt-get clean; rm -rf /var/lib/apt/lists/*

            # --- Helper: compute quoted column list (e.g., "id","email",...) ---
            get_columns() {
              local sch="$1" tbl="$2"
              PGPASSWORD="$PGPASSWORD" \
              psql "host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER sslmode=disable" -Atqc \
                "SELECT string_agg(quote_ident(column_name), ',')
                   FROM information_schema.columns
                  WHERE table_schema=$$${sch}$$ AND table_name=$$${tbl}$$
               ORDER BY ordinal_position;" | tr -d '\n'
            }

            # --- Helper: ensure target table empty unless overridden -----------
            check_empty() {
              local sch="$1" tbl="$2"
              local sql="SELECT COUNT(*) FROM ${sch}.${tbl};"
              local cnt
              cnt="$(PGPASSWORD="$PGPASSWORD" psql "host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER sslmode=disable" -Atqc "$sql" || echo "0")"
              if [ "$cnt" != "0" ] && [ -z "${ALLOW_NONEMPTY:-}" ]; then
                echo "❌ Target ${sch}.${tbl} is not empty (count=${cnt}). Set ALLOW_NONEMPTY=1 to bypass."; exit 1
              fi
            }

            # --- Discover flagged tables via COMMENT JSON ----------------------
            SQL_DISCOVER="
            WITH c AS (
              SELECT n.nspname AS schema, c.relname AS table, d.description
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                LEFT JOIN pg_description d ON d.objoid = c.oid AND d.objsubid = 0
               WHERE c.relkind IN ('r','p') AND d.description IS NOT NULL
            ),
            j AS (
              SELECT schema, \"table\",
                     CASE WHEN left(description,1)='{' THEN description::jsonb ELSE NULL END AS jdesc
                FROM c
            )
            SELECT json_build_object(
                     'schema', schema,
                     'table',  \"table\",
                     'cfg',    jdesc -> 'bootstrap'
                   )
              FROM j
             WHERE jdesc ? 'bootstrap'
               AND COALESCE( (jdesc->'bootstrap'->>'enabled')::boolean, false ) = true;
            "

            DISCOVERED="$(PGPASSWORD="$PGPASSWORD" psql "host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER sslmode=disable" -Atqc "$SQL_DISCOVER" || true)"

            if [ -z "${DISCOVERED}" ]; then
              echo "ℹ️  No tables flagged for bootstrap (COMMENT JSON missing or enabled=false). Nothing to do."
            fi

            echo "$DISCOVERED" | while read -r ROW_JSON; do
              [ -z "$ROW_JSON" ] && continue
              SCH="$(echo "$ROW_JSON" | jq -r '.schema')"
              TBL="$(echo "$ROW_JSON" | jq -r '.table')"
              CFG="$(echo "$ROW_JSON" | jq -c '.cfg // {}')"

              BQ_TABLE="$(echo "$CFG" | jq -r '.bq // empty')"
              [ -z "$BQ_TABLE" ] && { echo "❌ ${SCH}.${TBL} missing 'bq' in COMMENT bootstrap config"; exit 1; }
              PREFIX="$(echo "$CFG" | jq -r '.gcs_prefix // "'$TBL'"')"
              FMT="$(echo "$CFG" | jq -r '.format // "CSV"')"
              HDR="$(echo "$CFG" | jq -r '.header // true')"
              COLS_OVERRIDE="$(echo "$CFG" | jq -r '.columns // empty')"

              # Compute columns if not provided
              if [ -z "$COLS_OVERRIDE" ] || [ "$COLS_OVERRIDE" = "null" ]; then
                COLS="$(get_columns "$SCH" "$TBL")"
              else
                # Turn user-supplied list into properly quoted idents
                # e.g. id,email -> "id","email"
                COLS="$(echo "$COLS_OVERRIDE" | awk -F',' '{for(i=1;i<=NF;i++){gsub(/^ +| +$/,"",$i); printf "%s\"%s\"", (i>1?",":""), $i}}')"
              fi

              DEST_URI="gs://${BUCKET}/bootstrap/${PREFIX}/${PREFIX}-*.csv"
              [ -n "${LOCATION:-}" ] && BQ_LOC_FLAG="--location=${LOCATION}" || BQ_LOC_FLAG=""

              echo "➡️  Export BigQuery ${BQ_TABLE} → ${DEST_URI}"
              bq ${BQ_LOC_FLAG} --project_id="${PROJECT}" extract \
                --destination_format="${FMT}" \
                --field_delimiter="," \
                --print_header="${HDR}" \
                "${BQ_TABLE}" \
                "${DEST_URI}"

              echo "➡️  Import GCS → Yugabyte ${SCH}.${TBL}"
              check_empty "$SCH" "$TBL"

              gsutil cat "gs://${BUCKET}/bootstrap/${PREFIX}/${PREFIX}-*.csv" \
              | PGPASSWORD="$PGPASSWORD" psql "host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER sslmode=disable" \
                  -v ON_ERROR_STOP=1 \
                  -c "\copy ${SCH}.${TBL} (${COLS}) from stdin with (format csv, header ${HDR})"

              echo "✅ Imported ${SCH}.${TBL}"
            done

            # --- Completion flag ------------------------------------------------
            kubectl -n data-bootstrap apply -f - <<'EOF'
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: bootstrap.ok
              namespace: data-bootstrap
              labels: { app: bq-yb-bootstrap }
            data:
              status: "complete"
              completedAt: "__NOW__"
            EOF

            echo "🎉 Bootstrap complete."
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits:   { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: vault-secrets
          emptyDir: {}

# ============================================================================
# Kafka (single-broker, KRaft) — official Apache image (no Bitnami)
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: data-bootstrap
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  selector:
    app: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-hs
  namespace: data-bootstrap
spec:
  clusterIP: None
  ports:
    - name: controller
      port: 9093
      targetPort: 9093
  selector:
    app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: data-bootstrap
spec:
  serviceName: kafka-hs
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
      annotations:
        linkerd.io/inject: disabled
    spec:
      initContainers:
        - name: format-storage
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              # Idempotent: format only if not already formatted
              if [ ! -f "/tmp/kraft-combined-logs/meta.properties" ]; then
                CLUSTER_ID="$("/opt/kafka/bin/kafka-storage.sh" random-uuid)"
                /opt/kafka/bin/kafka-storage.sh format \
                  -t "${CLUSTER_ID}" \
                  -c /opt/kafka/config/kraft/server.properties \
                  --ignore-formatted
                echo "Formatted with cluster.id=${CLUSTER_ID}"
              else
                echo "Storage already formatted; skipping."
              fi
          volumeMounts:
            - name: kafka-logs
              mountPath: /tmp/kraft-combined-logs
      containers:
        - name: broker
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092 # PLAINTEXT
            - containerPort: 9093 # CONTROLLER
          env:
            # KRaft single node, combined mode
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.data-bootstrap.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-hs.data-bootstrap.svc.cluster.local:9093"
            # Single-broker-friendly settings
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # Log directory must match what was formatted in initContainer
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
          volumeMounts:
            - name: kafka-logs
              mountPath: /tmp/kraft-combined-logs
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: kafka-logs
          emptyDir: {}

# ============================================================================
# Kafka Connect (self-managed) — installs BigQuery Sink + Debezium YB gRPC
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: data-bootstrap
spec:
  type: ClusterIP
  ports:
    - name: rest
      port: 8083
      targetPort: 8083
  selector:
    app: kafka-connect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: data-bootstrap
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka-connect }
  template:
    metadata:
      labels: { app: kafka-connect }
      annotations:
        linkerd.io/inject: disabled
    spec:
      initContainers:
        - name: install-plugins
          image: confluentinc/cp-kafka-connect:7.6.1
          command:
            - bash
            - -lc
            - |
              mkdir -p /plugins
              apt-get update >/dev/null 2>&1 || true
              apt-get install -y unzip curl >/dev/null 2>&1 || true
              echo "Installing BigQuery Sink..."
              confluent-hub install --no-prompt --component-dir /plugins confluentinc/kafka-connect-bigquery:${BQ_SINK_VER}
              echo "Installing Yugabyte Debezium gRPC connector..."
              curl -fsSL "${YB_DEBEZIUM_URL}" -o /tmp/yb-connector.zip || wget -qO /tmp/yb-connector.zip "${YB_DEBEZIUM_URL}"
              unzip -o /tmp/yb-connector.zip -d /plugins >/dev/null 2>&1 || true
              echo "✅ Plugins ready in /plugins"
          env:
            - name: BQ_SINK_VER
              value: "2.6.1"
            - name: YB_DEBEZIUM_URL
              value: "https://downloads.yugabyte.com/debezium/dz.1.9.5.yb.grpc.2024.2.2/debezium-connector-yugabytedb-grpc.zip"
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      containers:
        - name: connect
          image: confluentinc/cp-kafka-connect:7.6.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: "kafka.data-bootstrap.svc.cluster.local:9092"
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              value: "kafka-connect"
            - name: CONNECT_REST_PORT
              value: "8083"
            - name: CONNECT_GROUP_ID
              value: "connect-cluster"
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: "_connect-configs"
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: "_connect-offsets"
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: "_connect-status"
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            # JSON converters (free & simple)
            - name: CONNECT_KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "true"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "true"
            - name: CONNECT_PLUGIN_PATH
              value: "/plugins"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      volumes:
        - name: plugins
          emptyDir: {}

# ============================================================================
# Job: register Yugabyte→Kafka (Debezium) and Kafka→BigQuery connectors
# - waits for bootstrap.ok ConfigMap (status=complete)
# - discovers flagged tables from COMMENT JSON
# - creates Yugabyte CDC stream id (yb-admin)
# - registers source & sink to Kafka Connect REST
# - secrets from Vault (YB + BigQuery)
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-yb-to-bq
  namespace: data-bootstrap
spec:
  backoffLimit: 2
  template:
    metadata:
      annotations:
        linkerd.io/inject: disabled
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "platform"
        # Yugabyte (include master addresses)
        vault.hashicorp.com/agent-inject-secret-yb: "secret/data/platform/yugabyte"
        vault.hashicorp.com/agent-inject-template-yb: |
          {{- with secret "secret/data/platform/yugabyte" -}}
          PGHOST={{ .Data.data.host }}
          PGPORT={{ .Data.data.port }}
          PGDATABASE={{ .Data.data.database }}
          PGUSER={{ .Data.data.user }}
          PGPASSWORD={{ .Data.data.password }}
          YB_MASTER_ADDRESSES={{ .Data.data.master_addresses }}
          {{- end }}
        # BigQuery SA JSON + defaults
        vault.hashicorp.com/agent-inject-secret-bq: "secret/data/gcp/bigquery"
        vault.hashicorp.com/agent-inject-template-bq: |
          {{- with secret "secret/data/gcp/bigquery" -}}
          BQ_PROJECT={{ .Data.data.project }}
          BQ_DEFAULT_DATASET={{ .Data.data.dataset }}
          BQ_KEY_JSON={{ .Data.data.service_account_json | toJSON }}
          {{- end }}
    spec:
      serviceAccountName: bq-yb-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: registrar
          image: yugabytedb/yugabyte:2024.2.2.0-b105
          command:
            - bash
            - -lc
            - |
              # Load secrets
              source /vault/secrets/yb
              source /vault/secrets/bq

              echo "Waiting for bootstrap.ok..."
              until [ "$(kubectl -n data-bootstrap get configmap bootstrap.ok -o jsonpath='{.data.status}' 2>/dev/null)" = "complete" ]; do
                echo "  bootstrap.ok not ready"; sleep 5
              done

              echo "Waiting for Kafka Connect REST..."
              until curl -sf http://kafka-connect.data-bootstrap.svc.cluster.local:8083/connectors >/dev/null || wget -qO- http://kafka-connect.data-bootstrap.svc.cluster.local:8083/connectors >/dev/null; do
                echo "  connect not ready"; sleep 5
              done

              export PGPASSWORD
              PGURL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=disable"

              echo "Discovering flagged tables from Yugabyte comments..."
              mapfile -t ROWS < <(
                /home/yugabyte/bin/ysqlsh "${PGURL}" -Atc "
                  with t as (
                    select table_schema, table_name,
                           obj_description((quote_ident(table_schema)||'.'||quote_ident(table_name))::regclass) as comment
                    from information_schema.tables
                    where table_type='BASE TABLE'
                      and table_schema not in ('pg_catalog','information_schema')
                  )
                  select table_schema||','||table_name||','||coalesce( (comment::jsonb -> 'bootstrap' ->> 'bq'), '' )
                  from t
                  where comment is not null
                    and ((comment::jsonb -> 'bootstrap' ->> 'enabled')::boolean is true);
                "
              )

              if [ ${#ROWS[@]} -eq 0 ]; then
                echo "No flagged tables found; exiting successfully."
                exit 0
              fi

              SERVER_NAME="yb"
              TABLE_INCLUDE_LIST=""
              TOPICS=""
              TOPIC2TABLEMAP=""

              for R in "${ROWS[@]}"; do
                SCHEMA="$(echo "$R" | cut -d, -f1)"
                TBL="$(echo "$R" | cut -d, -f2)"
                BQMAP="$(echo "$R" | cut -d, -f3-)"
                FQ="${SCHEMA}.${TBL}"
                TOPIC="${SERVER_NAME}.${FQ}"

                TABLE_INCLUDE_LIST="${TABLE_INCLUDE_LIST}${FQ},"
                TOPICS="${TOPICS}${TOPIC},"

                if [ -n "$BQMAP" ] && [[ "$BQMAP" == *.* ]]; then
                  TOPIC2TABLEMAP="${TOPIC2TABLEMAP}${TOPIC}:${BQMAP},"
                else
                  TOPIC2TABLEMAP="${TOPIC2TABLEMAP}${TOPIC}:${BQ_DEFAULT_DATASET}.${TBL},"
                fi
              done
              TABLE_INCLUDE_LIST="${TABLE_INCLUDE_LIST%,}"
              TOPICS="${TOPICS%,}"
              TOPIC2TABLEMAP="${TOPIC2TABLEMAP%,}"

              echo "Creating (or reusing) Yugabyte CDC stream id..."
              STREAM_ID="$(
                /home/yugabyte/bin/yb-admin -master_addresses ${YB_MASTER_ADDRESSES} create_change_data_stream ${PGDATABASE} 2>/dev/null | awk '{print $NF}'
              )"
              if [ -z "${STREAM_ID}" ]; then
                echo "❌ Could not obtain CDC stream id; verify yb-admin syntax/version and master addresses."; exit 1
              fi
              echo "CDC stream id: ${STREAM_ID}"

              echo "Registering Debezium Yugabyte gRPC source connector..."
              cat > /tmp/yb-source.json <<JSON
              {
                "name": "yb-source",
                "config": {
                  "connector.class": "io.debezium.connector.yugabytedb.YugabyteDBgRPCConnector",
                  "tasks.max": "1",
                  "database.hostname": "${PGHOST}",
                  "database.port": "${PGPORT}",
                  "database.master.addresses": "${YB_MASTER_ADDRESSES}",
                  "database.streamid": "${STREAM_ID}",
                  "database.user": "${PGUSER}",
                  "database.password": "${PGPASSWORD}",
                  "database.dbname": "${PGDATABASE}",
                  "database.server.name": "${SERVER_NAME}",
                  "table.include.list": "${TABLE_INCLUDE_LIST}",
                  "snapshot.mode": "never",
                  "transforms": "unwrap",
                  "transforms.unwrap.type": "io.debezium.connector.yugabytedb.transforms.YBExtractNewRecordState",
                  "topic.creation.default.replication.factor": "1",
                  "topic.creation.default.partitions": "1",
                  "topic.creation.default.cleanup.policy": "delete"
                }
              }
              JSON

              (curl -sf -X PUT -H 'Content-Type: application/json' --data-binary @/tmp/yb-source.json \
                http://kafka-connect.data-bootstrap.svc.cluster.local:8083/connectors/yb-source/config) \
              || curl -sf -X POST -H 'Content-Type: application/json' --data-binary @/tmp/yb-source.json \
                http://kafka-connect.data-bootstrap.svc.cluster.local:8083/connectors || { echo "❌ register source failed"; exit 1; }

              echo "Registering BigQuery Sink connector..."
              cat > /tmp/bq-sink.json <<JSON
              {
                "name": "bq-sink",
                "config": {
                  "connector.class": "com.wepay.kafka.connect.bigquery.BigQuerySinkConnector",
                  "tasks.max": "1",
                  "topics": "${TOPICS}",
                  "topic2TableMap": "${TOPIC2TABLEMAP}",
                  "project": "${BQ_PROJECT}",
                  "defaultDataset": "${BQ_DEFAULT_DATASET}",
                  "sanitizeTopics": "true",
                  "autoCreateTables": "false",
                  "allowNewBigQueryFields": "true",
                  "allowBigQueryRequiredFieldRelaxation": "true",
                  "keySource": "JSON",
                  "keyfile": ${BQ_KEY_JSON}
                }
              }
              JSON

              (curl -sf -X PUT -H 'Content-Type: application/json' --data-binary @/tmp/bq-sink.json \
                http://kafka-connect.data-bootstrap.svc.cluster.local:8083/connectors/bq-sink/config) \
              || curl -sf -X POST -H 'Content-Type: application/json' --data-binary @/tmp/bq-sink.json \
                http://kafka-connect.data-bootstrap.svc.cluster.local:8083/connectors || { echo "❌ register sink failed"; exit 1; }

              echo "✅ Connectors registered."
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
