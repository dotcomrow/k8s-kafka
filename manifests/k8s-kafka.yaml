# ============================================================================
# Namespace & RBAC (namespace: kafka)
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    app: bq-yb-bootstrap
  annotations:
    linkerd.io/inject: "disabled"
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=ctrl-node"
    field.cattle.io/projectId: "local:infrastructure"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bq-yb-bootstrap
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootstrap-ok-writer
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get","list","create","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootstrap-ok-writer
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
- kind: ServiceAccount
  name: bq-yb-bootstrap
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bootstrap-ok-writer

# ============================================================================
# Kafka cluster.id generator — namespace: kafka
# ============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-clusterid-gen
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-clusterid-secret-writer
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get","create","patch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-clusterid-secret-writer
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
- kind: ServiceAccount
  name: kafka-clusterid-gen
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-clusterid-secret-writer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gen-kafka-clusterid
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: kafka-clusterid-gen
      volumes:
      - name: work
        emptyDir: {}
      initContainers:
      - name: gen
        image: busybox:1.36.1
        command: ["/bin/sh","-c"]
        args:
        - |
          set -eu
          mkdir -p /work
          CID="$(cat /proc/sys/kernel/random/uuid 2>/dev/null || uuidgen 2>/dev/null || date +%s%N)"
          printf '%s' "${CID}" > /work/cluster.id
          ls -l /work/cluster.id
        volumeMounts: [{ name: work, mountPath: /work }]
      containers:
      - name: apply
        image: curlimages/curl:8.8.0
        command: ["/bin/sh","-c"]
        args:
        - |
          set -eu
          NAMESPACE="kafka"; SECRET_NAME="kafka-cluster-id"
          API="https://kubernetes.default.svc"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          CID="$(cat /work/cluster.id)"
          code="$(curl -s -o /dev/null -w '%{http_code}' --cacert "$CACERT" \
                 -H "Authorization: Bearer $TOKEN" \
                 "$API/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME" || true)"
          if [ "$code" != "200" ]; then
            b64="$(printf '%s' "$CID" | base64 | tr -d '\n')"
            printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","namespace":"%s"},"type":"Opaque","data":{"CLUSTER_ID":"%s"}}' \
              "$SECRET_NAME" "$NAMESPACE" "$b64" > /tmp/newsecret.json
            curl -sS -D /tmp/h.txt -o /tmp/r.txt -X POST --cacert "$CACERT" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary @/tmp/newsecret.json \
              "$API/api/v1/namespaces/$NAMESPACE/secrets"
          fi
        volumeMounts: [{ name: work, mountPath: /work }]

# ============================================================================
# Vault CONFIG job — namespace: vault
# ============================================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: yb-vault-config
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
      - name: root-token
        secret: { secretName: vault-root-token }
      containers:
      - name: setup-yb-vault
        image: hashicorp/vault:1.15.4
        env:
        - { name: VAULT_ADDR, value: "http://vault.vault.svc.cluster.local:8200" }
        - { name: AUTH_PATH, value: "kubernetes" }
        - { name: PG_USER, value: "vaultadmin" }
        - { name: SA_NAME, value: "bq-yb-bootstrap" }
        - { name: SA_NAMESPACE, value: "kafka" }
        - { name: PG_HOST, value: "yb-tserver-service.yugabyte.svc.cluster.local" }
        - { name: PG_PORT, value: "5433" }
        - { name: PG_DATABASE, value: "kafka" }
        - { name: YB_MASTER_ADDRESSES, value: "yb-master-0.yb-master-service.yugabyte.svc.cluster.local:7100,yb-master-1.yb-master-service.yugabyte.svc.cluster.local:7100,yb-master-2.yb-master-service.yugabyte.svc.cluster.local:7100" }
        - { name: BQ_BOOTSTRAP_LOCATION, value: "US" }
        - { name: BQ_BOOTSTRAP_PROJECT, value: "k8s-kafka-774d" }
        - { name: BQ_PROJECT, value: "k8s-kafka-774d" }
        - { name: BQ_BOOTSTRAP_BUCKET, value: "suncoast-systems-yb-bootstrap" }
        - { name: BQ_DEFAULT_DATASET, value: "yugabyte_backup" }
        command: ["/bin/sh","-c"]
        args:
        - |
          set -eu
          until [ -s /vault-token/VAULT_TOKEN ]; do sleep 2; done
          export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
          BQ_SA_JSON="$(vault kv get -field=value secret/k8s-kafka-gcp-service-account-json 2>/dev/null || true)"
          [ -n "$BQ_SA_JSON" ] && printf '%s' "$BQ_SA_JSON" > /tmp/sa.json || true
          # Check if the Kafka database exists in Yugabyte, and create it if it doesn't
          until [ -s /vault-token/VAULT_TOKEN ]; do sleep 2; done
          export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
          while :; do PASS="$(vault kv get -field=value "secret/${PG_USER}" 2>/dev/null || true)"; [ -n "$PASS" ] && break; sleep 5; done
          # Install PostgreSQL client to use psql
          apk add --no-cache postgresql-client

          # Export the PGPASSWORD environment variable to avoid syntax issues
          export PGPASSWORD="$PASS"
          PSQL_CMD="psql -h $PG_HOST -p $PG_PORT -U $PG_USER"

          # Check if the Kafka database exists in Yugabyte, and create it if it doesn't
          DB_EXISTS=$($PSQL_CMD -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$PG_DATABASE'")
          if [ "$DB_EXISTS" != "1" ]; then
            $PSQL_CMD -d postgres -c "CREATE DATABASE $PG_DATABASE"
          fi

          # Grant necessary privileges to the user on the Kafka database
          $PSQL_CMD -d $PG_DATABASE -c "ALTER SCHEMA public OWNER TO \"$PG_USER\""
          $PSQL_CMD -d $PG_DATABASE -c "GRANT ALL ON SCHEMA public TO \"$PG_USER\""
          $PSQL_CMD -d $PG_DATABASE -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"$PG_USER\""
          $PSQL_CMD -d $PG_DATABASE -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO \"$PG_USER\""
          $PSQL_CMD -d $PG_DATABASE -c "GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO \"$PG_USER\""
          $PSQL_CMD -d $PG_DATABASE -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO \"$PG_USER\""
          $PSQL_CMD -d $PG_DATABASE -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO \"$PG_USER\""
          $PSQL_CMD -d $PG_DATABASE -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO \"$PG_USER\""
          $PSQL_CMD -d $PG_DATABASE -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TYPES TO \"$PG_USER\""
          $PSQL_CMD -d postgres -c "GRANT CREATE ON DATABASE \"$PG_DATABASE\" TO \"$PG_USER\""
          PG_ARGS="host=$PG_HOST port=$PG_PORT database=$PG_DATABASE user=$PG_USER"
          [ -n "${YB_MASTER_ADDRESSES:-}" ] && PG_ARGS="$PG_ARGS master_addresses=$YB_MASTER_ADDRESSES"
          vault kv put secret/kafka/pgconfig $PG_ARGS >/dev/null
          vault kv put secret/kafka/bq/bootstrap bucket="$BQ_BOOTSTRAP_BUCKET" project="$BQ_BOOTSTRAP_PROJECT" location="$BQ_BOOTSTRAP_LOCATION" >/dev/null
          CFG="project=$BQ_PROJECT dataset=$BQ_DEFAULT_DATASET"
          [ -s /tmp/sa.json ] && CFG="$CFG sa_json=@/tmp/sa.json"
          vault kv put secret/kafka/bq/config $CFG >/dev/null
          [ -s /tmp/sa.json ] && vault kv put secret/kafka/bq/exporter sa_json=@/tmp/sa.json >/dev/null
          vault policy write data-bootstrap - <<'EOP'
          path "secret/data/kafka/pgconfig"     { capabilities = ["read"] }
          path "secret/data/kafka/bq/bootstrap" { capabilities = ["read"] }
          path "secret/data/kafka/bq/config"    { capabilities = ["read"] }
          path "secret/data/kafka/bq/exporter"  { capabilities = ["read"] }
          path "secret/data/vaultadmin"         { capabilities = ["read"] }
          EOP
          vault write auth/${AUTH_PATH}/role/data-bootstrap \
            bound_service_account_names="${SA_NAME}" \
            bound_service_account_namespaces="${SA_NAMESPACE}" \
            policies="data-bootstrap" ttl="24h" >/dev/null
        volumeMounts: [{ name: root-token, mountPath: /vault-token, readOnly: true }]

# ============================================================================
# Kafka (wave 3): single-broker KRaft
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
  selector: { app: kafka }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-hs
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  clusterIP: None
  ports: [{ name: controller, port: 9093, targetPort: 9093 }]
  selector: { app: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  serviceName: kafka-hs
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata:
      labels: { app: kafka }
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/exit-on-error: "false"
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/kafka/bq/config"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/kafka/bq/config" -}}
          {{ .Data.data.sa_json }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-permissions-gcp-key.json: "0644"
    spec:
      serviceAccountName: bq-yb-bootstrap
      securityContext:
        fsGroup: 1000
        runAsUser: 0
      volumes: [{ name: kafka-logs, emptyDir: {} }]
      initContainers:
      - name: format-storage
        image: apache/kafka:3.9.0
        env:
        - name: CLUSTER_ID
          valueFrom: { secretKeyRef: { name: kafka-cluster-id, key: CLUSTER_ID } }
        command: ["/bin/bash","-lc"]
        args:
        - |
          set -eu
          META="/tmp/kraft-combined-logs/meta.properties"
          if [ ! -f "$META" ]; then
            /opt/kafka/bin/kafka-storage.sh format -t "${CLUSTER_ID}" -c /opt/kafka/config/kraft/server.properties --ignore-formatted
          fi
        volumeMounts: [{ name: kafka-logs, mountPath: /tmp/kraft-combined-logs }]
      containers:
      - name: broker
        image: apache/kafka:3.9.0
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /vault/secrets/gcp-key.json
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka.kafka.svc.internal.lan:9092"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@kafka-0.kafka-hs.kafka.svc.internal.lan:9093"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - { name: CLUSTER_ID, valueFrom: { secretKeyRef: { name: kafka-cluster-id, key: CLUSTER_ID } } }
        - { name: KAFKA_NODE_ID, value: "1" }
        - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
        - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
        - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
        - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.kafka.svc.internal.lan:9092" }
        - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
        - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka-hs.kafka.svc.internal.lan:9093" }
        - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
        - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
        - { name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs" }
        - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
        ports:
        - { containerPort: 9092 }
        - { containerPort: 9093 }
        readinessProbe:
          tcpSocket: { port: 9092 }
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits: { cpu: "1500m", memory: "2Gi" }
        volumeMounts: [{ name: kafka-logs, mountPath: /tmp/kraft-combined-logs }]
---
# ===========================================================================
# Schema Registry (wave 4)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-registry-config
  namespace: kafka
data:
  schema-registry.properties: |
    # The address the socket server listens on.
    listeners=http://0.0.0.0:8081

    # Updated to point to the correct Kafka bootstrap servers
    kafkastore.bootstrap.servers=PLAINTEXT://kafka.kafka.svc.cluster.local:9092

    # The name of the topic to store schemas in
    kafkastore.topic=_schemas

    # If true, API requests that fail will include extra debugging information, including stack traces
    debug=false

    metadata.encoder.secret=REPLACE_ME_WITH_HIGH_ENTROPY_STRING

    resource.extension.class=io.confluent.dekregistry.DekRegistryResourceExtension
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: kafka
  labels:
    app: schema-registry
  annotations:
    argocd.argoproj.io/sync-wave: "49"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      serviceAccountName: schema-registry
      volumes:
        - name: kafka-tools
          emptyDir: {}
        - name: schema-registry-config-volume
          configMap:
            name: schema-registry-config
            items: [{ key: schema-registry.properties, path: schema-registry.properties }]
      initContainers:
        - name: install-kafka-tools
          image: confluentinc/cp-kafka:7.7.1
          command: ["sh", "-c", "cp /usr/bin/kafka-* /opt/kafka-tools/ && chmod +x /opt/kafka-tools/kafka-*"]
          volumeMounts:
          - name: kafka-tools
            mountPath: /opt/kafka-tools
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.7.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          command: ["/bin/sh", "-c"]
          volumeMounts:
            - name: kafka-tools
              mountPath: /opt/kafka-tools
            - name: schema-registry-config-volume
              mountPath: /etc/schema-registry/schema-registry.properties
              subPath: schema-registry.properties
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /vault/secrets/gcp-key.json
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: "schema-registry"
            # Match your broker’s advertised listener
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.internal.lan:9092"
            # Single-node RF
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: SCHEMA_REGISTRY_COMPATIBILITY_LEVEL
              value: "BACKWARD"
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC
              value: "_schemas"
            - name: SCHEMA_REGISTRY_DEBUG
              value: "true"
            - name: LOG_DIR
              value: "/tmp"
            - name: LOG_FILE
              value: "schema-registry.log"
            - name: SCHEMA_REGISTRY_LOG4J_OPTS
              value: "-Dlog4j.configuration=file:/etc/schema-registry/log4j.properties -Dlog4j.log.file=/tmp/schema-registry.log"
            - name: SCHEMA_REGISTRY_KAFKASTORE_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-cluster-id
                  key: CLUSTER_ID
          args:
            - |
              set -eu;
              echo "Starting Schema Registry with configuration:";
              env | grep SCHEMA_REGISTRY;
              echo "Contents of /etc/confluent/docker/run:";
              cat /etc/confluent/docker/run;
              echo "Running preflight checks...";
              /etc/confluent/docker/ensure || { echo "Preflight checks failed"; exit 1; };
              echo "Preflight checks completed successfully.";
              echo "Launching Schema Registry...";
              LOG_PATH="$LOG_DIR/$LOG_FILE";
              export LOG4J_LOG_FILE="$LOG_PATH";
              echo "Redirecting logs to $LOG_PATH";
              /etc/confluent/docker/launch || { echo "Launch failed"; exit 1; };
          readinessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: kafka
  labels:
    app: schema-registry
  annotations:
    argocd.argoproj.io/sync-wave: "49"
spec:
  type: ClusterIP
  selector:
    app: schema-registry
  ports:
    - name: http
      port: 8081
      targetPort: http

# ============================================================================
# Kafka Connect (wave 4) — with BigQuery + YB gRPC connectors
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  ports: [{ name: rest, port: 8083, targetPort: 8083 }]
  selector: { app: kafka-connect }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-log4j
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  log4j.properties: |
    log4j.rootLogger=INFO,stdout
    log4j.appender.stdout=org.apache.log4j.ConsoleAppender
    log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
    log4j.appender.stdout.layout.ConversionPattern=[%d{ISO8601}] %-5p %c - %m%n
    log4j.logger.io.debezium=DEBUG
    log4j.logger.io.debezium.connector.yugabytedb=DEBUG
    log4j.logger.com.wepay.kafka.connect.bigquery=DEBUG
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-connect } }
  template:
    metadata:
      labels: { app: kafka-connect }
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/exit-on-error: "false"
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/kafka/bq/config"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/kafka/bq/config" -}}
          {{ .Data.data.sa_json }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-permissions-gcp-key.json: "0644"
    spec:
      serviceAccountName: bq-yb-bootstrap
      securityContext: { fsGroup: 1000 }
      terminationGracePeriodSeconds: 30
      volumes:
      - { name: plugins, emptyDir: {} }
      - name: log4j
        configMap:
          name: kafka-connect-log4j
          items: [{ key: log4j.properties, path: log4j.properties }]
      initContainers:
      - name: install-bq
        image: confluentinc/cp-kafka-connect:7.6.1
        command: ["/bin/bash","-lc"]
        args:
        - |
          set -eu
          mkdir -p /plugins
          confluent-hub install --no-prompt --component-dir /plugins wepay/kafka-connect-bigquery:2.5.7
        volumeMounts: [{ name: plugins, mountPath: /plugins }]
      - name: fetch-yb-connector
        image: curlimages/curl:8.8.0
        env:
        - name: YB_CONNECTOR_URL
          value: "https://github.com/yugabyte/debezium-connector-yugabytedb/releases/download/vdz.1.9.5.yb.grpc.2024.2.3/debezium-connector-yugabytedb-dz.1.9.5.yb.grpc.2024.2.3.jar"
        command: ["/bin/sh","-lc"]
        args:
          - |
            set -eu

            echo "[FETCH-YB] preparing plugin dirs..."
            mkdir -p /plugins/yb /plugins/yb/debezium-postgres /plugins/yb/yugabytedb-grpc

            copy_if_dir() { d="$1"; [ -d "$d" ] && cp -R "$d"/. /plugins/yb/ || true; }

            # 1) Copy anything embedded in the image (if present)
            for C in \
              /kafka/connect/yugabytedb \
              /opt/kafka/connect/yugabytedb \
              /debezium-connector/yugabytedb \
              /opt/debezium-connector/yugabytedb \
              /kafka/connect/debezium-connector-postgres \
              /debezium-connector/debezium-connector-postgres \
              /opt/kafka/connect/yugabytedb/debezium-connector-postgres
            do
              copy_if_dir "$C"
            done

            # 2) Fetch the Yugabyte gRPC connector JAR
            if [ -n "${YB_CONNECTOR_URL:-}" ]; then
              echo "[FETCH-YB] downloading Yugabyte gRPC connector from: ${YB_CONNECTOR_URL}"
              fname="$(basename "${YB_CONNECTOR_URL%%\?*}")"
              tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
              curl -fL --retry 5 --retry-delay 2 -o "$tmp/$fname" "$YB_CONNECTOR_URL"
              case "$fname" in
                *.jar) cp "$tmp/$fname" "/plugins/yb/yugabytedb-grpc/$fname" ;;
                *)     cp "$tmp/$fname" "/plugins/yb/$fname" ;;
              esac
            fi

            # 3) Filename heuristic sorting (no unzip dependency)
            set +e
            for J in /plugins/yb/*.jar; do
              [ -f "$J" ] || continue
              b="$(basename "$J" | tr '[:upper:]' '[:lower:]')"
              case "$b" in
                *yugabytedb*connector*|*connector*yugabytedb*|*yugabyte*grpc*)
                  mv -f "$J" /plugins/yb/yugabytedb-grpc/
                  ;;
                *)
                  mv -f "$J" /plugins/yb/debezium-postgres/
                  ;;
              esac
            done
            set -e

            # 4) Validate presence
            if ! find /plugins/yb/yugabytedb-grpc -type f -name '*.jar' -print | head -n1 | grep -q . ; then
              echo "[FETCH-YB] ERROR: YugabyteDB gRPC connector not found after download."
              echo "           Check network/URL or supply a reachable YB_CONNECTOR_URL."
              exit 1
            fi

            echo "[FETCH-YB] Installed files:"
            find /plugins/yb -maxdepth 2 -type f -name '*.jar' -print | sed 's/^/  /'
        volumeMounts:
          - { name: plugins, mountPath: /plugins }

      - name: create-connect-topics
        image: apache/kafka:3.9.0
        command: ["/bin/bash","-lc"]
        args:
        - |
          set -eu
          BOOT=kafka.kafka.svc.cluster.local:9092
          for t in _connect-configs _connect-offsets _connect-status; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOT" --list | grep -qx "$t" || \
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BOOT" --create --topic "$t" --partitions 1 --replication-factor 1 --config cleanup.policy=compact
          done
      containers:
      - name: connect
        image: confluentinc/cp-kafka-connect:7.6.1
        env:
        - name: CONNECT_PLUGIN_DISCOVERY
          value: "only_scan"
        - name: CONNECT_PLUGIN_PATH
          value: "/plugins/wepay-kafka-connect-bigquery,/plugins/yb/debezium-postgres,/plugins/yb/yugabytedb-grpc"
        - name: CONNECT_BOOTSTRAP_SERVERS
          value: "kafka.kafka.svc.internal.lan:9092"
        - name: CONNECT_GROUP_ID
          value: "connect-cluster"
        - name: CONNECT_CONFIG_STORAGE_TOPIC
          value: "_connect-configs"
        - name: CONNECT_OFFSET_STORAGE_TOPIC
          value: "_connect-offsets"
        - name: CONNECT_STATUS_STORAGE_TOPIC
          value: "_connect-status"
        - name: CONNECT_INTERNAL_KEY_CONVERTER
          value: "org.apache.kafka.connect.json.JsonConverter"
        - name: CONNECT_INTERNAL_VALUE_CONVERTER
          value: "org.apache.kafka.connect.json.JsonConverter"
        - name: CONNECT_INTERNAL_KEY_CONVERTER_SCHEMAS_ENABLE
          value: "true"
        - name: CONNECT_INTERNAL_VALUE_CONVERTER_SCHEMAS_ENABLE
          value: "true"
        - name: KAFKA_LOG4J_OPTS
          value: "-Dlog4j.configuration=file:/kafka/etc/log4j.properties"
        - name: CONNECT_CONFIG_PROVIDERS
          value: "env"
        - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
          value: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"
        - name: CONNECT_BOOTSTRAP_SERVERS
          value: "kafka.kafka.svc.internal.lan:9092"
        # optional:
        - name: CONNECT_REST_ADVERTISED_HOST_NAME
          value: "kafka-connect.kafka.svc.internal.lan"
        - name: YB_MASTER_ADDRESSES
          value: "yb-master-0.yb-master-service.yugabyte.svc.cluster.local:7100,yb-master-1.yb-master-service.yugabyte.svc.cluster.local:7100,yb-master-2.yb-master-service.yugabyte.svc.cluster.local:7100"
        - { name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR, value: "1" }
        - { name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR, value: "1" }
        - { name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR, value: "1" }
        - { name: CONNECT_KEY_CONVERTER, value: "org.apache.kafka.connect.json.JsonConverter" }
        - { name: CONNECT_VALUE_CONVERTER, value: "org.apache.kafka.connect.json.JsonConverter" }
        - { name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE, value: "true" }
        - { name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE, value: "true" }
        - { name: CONNECT_REST_ADVERTISED_HOST_NAME, value: "kafka-connect.kafka.svc.internal.lan" }
        - { name: CONNECT_REST_PORT, value: "8083" }
        - { name: GOOGLE_APPLICATION_CREDENTIALS, value: "/vault/secrets/gcp-key.json" }
        ports: [{ containerPort: 8083 }]
        readinessProbe:
          httpGet: { path: /connectors, port: 8083 }
          initialDelaySeconds: 60
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: { path: /, port: 8083 }
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests: { cpu: "250m", memory: "768Mi" }
          limits: { cpu: "1000m", memory: "1.5Gi" }
        volumeMounts:
        - { name: plugins, mountPath: /plugins }
        - { name: log4j,  mountPath: /kafka/etc }
# ============================================================================
# Kafka UI + oauth2-proxy (waves 45-46)
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "45"
spec:
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  selector: { app: kafka-ui }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "45"
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-ui } }
  template:
    metadata:
      labels: { app: kafka-ui }
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      containers:
      - name: ui
        image: provectuslabs/kafka-ui:v0.7.2
        ports: [{ containerPort: 8080, name: http }]
        env:
        - { name: KAFKA_CLUSTERS_0_NAME, value: "local" }
        - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka.kafka.svc.internal.lan:9092" }
        - { name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY, value: "http://schema-registry.kafka.svc.internal.lan:8081" }
        readinessProbe:
          httpGet: { path: /, port: http }
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests: { cpu: "100m", memory: "128Mi" }
          limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: kafka
type: Opaque
stringData:
  client_id: "<path:secret/data/k8s-kafka-kafka-gui-oauth-clientid#value>"
  client_secret: "<path:secret/data/k8s-kafka-kafka-gui-oauth-clientsecret#value>"
  cookie_secret: "<path:secret/data/k8s-kafka-kafka-gui-oauth-cookiesecret#value>"
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "46"
spec:
  ports: [{ name: http, port: 4180, targetPort: 4180 }]
  selector: { app: oauth2-proxy }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "46"
spec:
  replicas: 1
  selector: { matchLabels: { app: oauth2-proxy } }
  template:
    metadata:
      labels: { app: oauth2-proxy }
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      containers:
      - name: proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        ports: [{ containerPort: 4180, name: http }]
        args:
          - --provider=github
          - --http-address=0.0.0.0:4180
          - --upstream=http://kafka-ui.kafka.svc.cluster.local:8080/
          - --redirect-url=https://kafka-gui.app.suncoast.systems/oauth2/callback
          - --cookie-secure=true
          - --cookie-samesite=lax
          - --cookie-refresh=1h
          - --cookie-expire=8h
          - --email-domain=*
          - --set-authorization-header=true
          - --pass-authorization-header=true
          - --pass-access-token=true
          - --skip-provider-button=true
          - --allowed-group=dotcomrow:kafka_gui_users
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom: { secretKeyRef: { name: oauth2-proxy-secrets, key: client_id } }
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: oauth2-proxy-secrets, key: client_secret } }
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom: { secretKeyRef: { name: oauth2-proxy-secrets, key: cookie_secret } }
        readinessProbe:
          httpGet: { path: /ping, port: http }
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits: { cpu: "300m", memory: "256Mi" }

# ============================================================================
# REFACTORED Table Sync Controller (wave 50) — uses your packaged image
# ============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: table-sync-config
  namespace: kafka
data:
  orchestrator.yaml: |
    yugabytedb:
      host: yb-tserver-service.yugabyte.svc.cluster.local
      port: 5433
      user: vaultadmin
      password: <path:secret/data/vaultadmin#value>
      database: kafka
      master_addresses: "yb-master-0.yb-master-service.yugabyte.svc.cluster.local:7100,yb-master-1.yb-master-service.yugabyte.svc.cluster.local:7100,yb-master-2.yb-master-service.yugabyte.svc.cluster.local:7100"
      excluded_databases: "postgres,yugabyte,vaultadmin,system_platform,kafka"
    
    bigquery:
      credentials_path: /vault/secrets/gcp-key.json

    redis:
      url: redis://:<path:secret/data/redis#password>@redis-0.redis-headless.redis.svc.cluster.local:6379/0
      cacheKey: "table-sync-cache"
      default_ttl: 300
      cache_keys:
        row_counts: "row_counts"
    
    kafka_connect:
      url: http://kafka-connect.kafka.svc.internal.lan:8083
      schema_registry_url: http://schema-registry.kafka.svc.internal.lan:8081
      bootstrap: http://kafka.kafka.svc.internal.lan:9092
    
    logging:
      level: DEBUG
      enable_cloud_logging: true
    
    health_check:
      port: 8080
    
    processing:
      table_scanner: 
        max_scan_threads: 10
        scan_interval_seconds: 300

      database_prep:
        max_preparation_threads: 2
        scan_interval_seconds: 90

      cache_check:
        max_cache_check_threads: 6
        scan_interval_seconds: 90

      connector_cleanup:
        max_connector_cleanup_threads: 4
        scan_interval_seconds: 90
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootstrap-watcher
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  replicas: 1
  selector:
    matchLabels: { app: bootstrap-watcher }
  template:
    metadata:
      labels: { app: bootstrap-watcher }
      annotations:
        linkerd.io/inject: "disabled"

        # ---- VAULT agent: render env files this app expects per README ----
        vault.hashicorp.com/agent-inject-permissions-gcp-key.json: "0644"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/exit-on-error: "false"

        # TEMP_STORAGE_BUCKET from bootstrap
        vault.hashicorp.com/agent-inject-secret-bootstrap.env: "secret/data/kafka/bq/bootstrap"
        vault.hashicorp.com/agent-inject-template-bootstrap.env: |
          {{- with secret "secret/data/kafka/bq/bootstrap" -}}
          {{ with .Data.data.bucket }}TEMP_STORAGE_BUCKET={{ . }}{{ end }}
          {{- end -}}

        # GCP SA JSON used by the app (and by BigQuery libs)
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/kafka/bq/config"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/kafka/bq/config" -}}
          {{ .Data.data.sa_json }}
          {{- end -}}
        
    spec:
      serviceAccountName: bq-yb-bootstrap
      securityContext: { fsGroup: 1000 }
      containers:
      - name: table-sync
        image: ghcr.io/dotcomrow/table-sync-image:ts-20251021-181942
        imagePullPolicy: Always
        env:
          - name: CONFIG_PATH
            value: "/app/config/orchestrator.yaml"
          - name: GOOGLE_APPLICATION_CREDENTIALS
            value: "/vault/secrets/gcp-key.json"
        volumeMounts:
          - name: config
            mountPath: /app/config
        command: ["/bin/sh","-lc"]
        args:
          - |
            #!/bin/bash
            set -eu

            # Source any environment files from vault
            for f in /vault/secrets/*.env; do
              [ -s "$f" ] && set -a && . "$f" && set +a
            done

            # Start the application
            exec python /app/src/table_sync_orchestrator.py /app/config/orchestrator.yaml 2>&1
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 20
        resources:
          requests: { cpu: "200m", memory: "256Mi" }
          limits: { cpu: "1000m", memory: "1Gi" }
      volumes:
        - name: config
          configMap:
            name: table-sync-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schema-registry
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: schema-registry-secret-access
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kafka-cluster-id"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: schema-registry-secret-access-binding
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: schema-registry-secret-access
subjects:
  - kind: ServiceAccount
    name: schema-registry
    namespace: kafka