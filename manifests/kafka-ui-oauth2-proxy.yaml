# ============================================================================
# Kafka UI + oauth2-proxy (waves 45-46)
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "45"
spec:
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
  selector: { app: kafka-ui }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "45"
  labels:
    platform.suncoast.systems/vpa-exclude: "true"
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka-ui } }
  template:
    metadata:
      labels: { app: kafka-ui }
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      containers:
      - name: ui
        image: ghcr.io/kafbat/kafka-ui:latest
        ports: [{ containerPort: 8080, name: http }]
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
        env:
        - { name: KAFKA_CLUSTERS_0_NAME, value: "local" }
        - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka.kafka.svc.internal.lan:9092" }
        - name: KAFKA_UI_USERNAME
          valueFrom:
            secretKeyRef:
              name: kafka-security-credentials
              key: kafka_ui_username
        - name: KAFKA_UI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kafka-security-credentials
              key: kafka_ui_password
        - { name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL, value: "SASL_PLAINTEXT" }
        - { name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM, value: "SCRAM-SHA-256" }
        - { name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG, value: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="$(KAFKA_UI_USERNAME)" password="$(KAFKA_UI_PASSWORD)";' }
        - { name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY, value: "http://schema-registry.kafka.svc.internal.lan:8081" }
        readinessProbe:
          httpGet: { path: /actuator/health, port: http }
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /actuator/health, port: http }
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
        startupProbe:
          httpGet: { path: /actuator/health, port: http }
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: kafka
type: Opaque
stringData:
  client_id: "<path:secret/data/keycloak-client-id-kafka-gui-proxy#value>"
  client_secret: "<path:secret/data/keycloak-client-secret-kafka-gui-proxy#value>"
  cookie_secret: "<path:secret/data/k8s-kafka-kafka-gui-keycloak-cookiesecret#value>"
  internal_oidc_issuer_url: "<path:secret/data/k8s-kafka-keycloak-internal-oidc-issuer-url#value>"
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "46"
    teleport.dev/name: "kafka-gui"
    teleport.dev/description: "Kafka GUI"
    teleport.dev/protocol: "http"
    teleport.dev/public_addr: "kafka-gui.teleport.app.suncoast.systems"
    teleport.dev/labels: "environment=production,service=kafka"
  labels:
    teleport.dev/enroll: "true"
    app.kubernetes.io/name: kafka-gui
    app.kubernetes.io/component: kafka
    teleport.dev/app: "kafka-gui"
spec:
  ports: [{ name: http, port: 4180, targetPort: 4180 }]
  selector: { app: oauth2-proxy }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "46"
spec:
  replicas: 1
  selector: { matchLabels: { app: oauth2-proxy } }
  template:
    metadata:
      labels: { app: oauth2-proxy }
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      containers:
      - name: proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        ports: [{ containerPort: 4180, name: http }]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        args:
          - --provider=keycloak-oidc
          - --http-address=0.0.0.0:4180
          - --upstream=http://kafka-ui.kafka.svc.cluster.local:8080/
          - --redirect-url=https://kafka-gui.teleport.app.suncoast.systems/oauth2/callback
          - --code-challenge-method=S256
          - --cookie-secure=true
          - --cookie-samesite=lax
          - --cookie-refresh=1h
          - --cookie-expire=8h
          - --email-domain=*
          - --set-authorization-header=true
          - --pass-authorization-header=true
          - --pass-access-token=true
          - --skip-provider-button=true
          - --allowed-role=platform_batch_internal_ui_user
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom: { secretKeyRef: { name: oauth2-proxy-secrets, key: client_id } }
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: oauth2-proxy-secrets, key: client_secret } }
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom: { secretKeyRef: { name: oauth2-proxy-secrets, key: cookie_secret } }
        - name: OAUTH2_PROXY_OIDC_ISSUER_URL
          valueFrom: { secretKeyRef: { name: oauth2-proxy-secrets, key: internal_oidc_issuer_url } }
        readinessProbe:
          httpGet: { path: /ping, port: http }
          initialDelaySeconds: 5
          periodSeconds: 5
