# ============================================================================
# Batch processing examples (waves 50-52)
# - Kafka example topics and seed data
# - Flink SQL job submission for Kafka input/output pipeline
# - NiFi flow reference mounted into the NiFi pod
# ============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-processing-examples-config
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  input_topic: "batch.example.nifi.raw.v1"
  output_topic: "batch.example.flink.enriched.v1"
  input_consumer_group: "flink-batch-example-v1"
  flink_pipeline_name: "batch-example-nifi-to-flink"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-kafka-example-reference
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "50"
data:
  kafka-batch-reference.md: |-
    # NiFi to Kafka Example Flow (Reference)

    This file is mounted at `/opt/nifi/nifi-current/conf/examples/kafka-batch-reference.md`
    in the NiFi pod and shows a minimal end-to-end example.

    ## Goal
    Publish records from NiFi into Kafka topic `batch.example.nifi.raw.v1` using the
    existing service principal and SCRAM auth.

    ## Processor chain
    1. `GenerateFlowFile`
    2. `UpdateAttribute`
    3. `PublishKafka_2_6`

    ## Suggested processor properties

    `GenerateFlowFile`
    - Run Schedule: `15 sec`
    - Custom Text:
      `event_source=nifi|event_time=${now():format("yyyy-MM-dd'T'HH:mm:ssXXX")}|event_id=${UUID()}`

    `UpdateAttribute`
    - `kafka.topic`: `batch.example.nifi.raw.v1`

    `PublishKafka_2_6`
    - Topic Name: `${kafka.topic}`
    - Delivery Guarantee: `at_least_once`
    - request.timeout.ms: `30000`
    - max.block.ms: `60000`
    - Security Protocol: `${BATCH_KAFKA_SECURITY_PROTOCOL}`
    - SASL Mechanism: `${BATCH_KAFKA_SASL_MECHANISM}`
    - SASL JAAS Config:
      `org.apache.kafka.common.security.scram.ScramLoginModule required username="${BATCH_KAFKA_USERNAME}" password="${BATCH_KAFKA_PASSWORD}";`
    - bootstrap.servers:
      `${BATCH_KAFKA_BOOTSTRAP_SERVERS}`

    ## Optional verification chain
    Add `ConsumeKafka_2_6` pointing to topic `batch.example.flink.enriched.v1` and
    connect to `LogAttribute` to verify Flink-enriched records arriving from Kafka.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-kafka-topics
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "50"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-bootstrap
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: admin_username
            - name: KAFKA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: admin_password
            - name: INPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: input_topic
            - name: OUTPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: output_topic
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              CLIENT_CFG="/tmp/kafka-admin.properties"
              cat > "${CLIENT_CFG}" <<EOF
              security.protocol=${KAFKA_SECURITY_PROTOCOL}
              sasl.mechanism=${KAFKA_SASL_MECHANISM}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_ADMIN_USERNAME}" password="${KAFKA_ADMIN_PASSWORD}";
              EOF

              echo "Waiting for Kafka API..."
              until /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                --command-config "${CLIENT_CFG}" \
                --list >/dev/null 2>&1; do
                sleep 5
              done

              ensure_topic() {
                local topic="$1"
                if /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                  --command-config "${CLIENT_CFG}" \
                  --list | grep -qx "${topic}"; then
                  echo "Topic already exists: ${topic}"
                else
                  echo "Creating topic: ${topic}"
                  /opt/kafka/bin/kafka-topics.sh \
                    --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                    --command-config "${CLIENT_CFG}" \
                    --create \
                    --topic "${topic}" \
                    --partitions 3 \
                    --replication-factor 1
                fi
              }

              ensure_topic "${INPUT_TOPIC}"
              ensure_topic "${OUTPUT_TOPIC}"
              echo "Kafka example topics are ready."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-kafka-seed-input
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "51"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed-input-topic
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_NIFI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_username
            - name: KAFKA_NIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_password
            - name: INPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: input_topic
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              CLIENT_CFG="/tmp/kafka-nifi.properties"
              cat > "${CLIENT_CFG}" <<EOF
              security.protocol=${KAFKA_SECURITY_PROTOCOL}
              sasl.mechanism=${KAFKA_SASL_MECHANISM}
              sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_NIFI_USERNAME}" password="${KAFKA_NIFI_PASSWORD}";
              EOF

              echo "Seeding ${INPUT_TOPIC} with example records as NiFi principal..."
              tmp_payload="$(mktemp)"
              for i in $(seq 1 25); do
                printf 'event_source=nifi-seed|event_index=%03d|event_time=%s|event_id=%s\n' \
                  "${i}" \
                  "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  "$(cat /proc/sys/kernel/random/uuid)" >> "${tmp_payload}"
              done

              /opt/kafka/bin/kafka-console-producer.sh \
                --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                --producer.config "${CLIENT_CFG}" \
                --topic "${INPUT_TOPIC}" < "${tmp_payload}"

              echo "Seed data written to ${INPUT_TOPIC}."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-example-flink-submit
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "52"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: submit-flink-job
          image: flink:1.20.3-scala_2.12-java17
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: flink_username
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: flink_password
            - name: INPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: input_topic
            - name: OUTPUT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: output_topic
            - name: INPUT_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: input_consumer_group
            - name: FLINK_PIPELINE_NAME
              valueFrom:
                configMapKeyRef:
                  name: batch-processing-examples-config
                  key: flink_pipeline_name
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail

              FLINK_REST="http://flink-jobmanager.kafka.svc.cluster.local:8081"
              CONNECTOR_JAR_URL="https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.3.0-1.20/flink-sql-connector-kafka-3.3.0-1.20.jar"
              CONNECTOR_JAR_PATH="/tmp/flink-sql-connector-kafka-3.3.0-1.20.jar"

              http_probe() {
                local url="$1"
                if command -v curl >/dev/null 2>&1; then
                  curl -fsS "${url}" >/dev/null
                elif command -v wget >/dev/null 2>&1; then
                  wget -qO- "${url}" >/dev/null
                else
                  echo "Neither curl nor wget is available in the container."
                  exit 1
                fi
              }

              echo "Waiting for Flink JobManager REST API..."
              until http_probe "${FLINK_REST}/overview"; do
                sleep 5
              done

              if [ ! -f "${CONNECTOR_JAR_PATH}" ]; then
                echo "Downloading Flink Kafka SQL connector..."
                if command -v curl >/dev/null 2>&1; then
                  curl -fL --retry 5 --retry-delay 2 \
                    "${CONNECTOR_JAR_URL}" \
                    -o "${CONNECTOR_JAR_PATH}"
                elif command -v wget >/dev/null 2>&1; then
                  wget -O "${CONNECTOR_JAR_PATH}" "${CONNECTOR_JAR_URL}"
                else
                  echo "Neither curl nor wget is available in the container."
                  exit 1
                fi
              fi

              cat > /tmp/batch-example.sql <<EOF
              ADD JAR 'file://${CONNECTOR_JAR_PATH}';
              SET 'pipeline.name' = '${FLINK_PIPELINE_NAME}';

              CREATE TABLE nifi_input (
                raw_line STRING
              ) WITH (
                'connector' = 'kafka',
                'topic' = '${INPUT_TOPIC}',
                'properties.bootstrap.servers' = '${KAFKA_BOOTSTRAP_SERVERS}',
                'properties.group.id' = '${INPUT_CONSUMER_GROUP}',
                'properties.security.protocol' = '${KAFKA_SECURITY_PROTOCOL}',
                'properties.sasl.mechanism' = '${KAFKA_SASL_MECHANISM}',
                'properties.sasl.jaas.config' = 'org.apache.flink.kafka.shaded.org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";',
                'scan.startup.mode' = 'earliest-offset',
                'format' = 'raw'
              );

              CREATE TABLE flink_output (
                raw_line STRING
              ) WITH (
                'connector' = 'kafka',
                'topic' = '${OUTPUT_TOPIC}',
                'properties.bootstrap.servers' = '${KAFKA_BOOTSTRAP_SERVERS}',
                'properties.security.protocol' = '${KAFKA_SECURITY_PROTOCOL}',
                'properties.sasl.mechanism' = '${KAFKA_SASL_MECHANISM}',
                'properties.sasl.jaas.config' = 'org.apache.flink.kafka.shaded.org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";',
                'format' = 'raw'
              );

              INSERT INTO flink_output
              SELECT CONCAT('flink-processed|', raw_line)
              FROM nifi_input;
              EOF

              echo "Submitting Flink SQL pipeline from /tmp/batch-example.sql"
              /opt/flink/bin/sql-client.sh \
                -Drest.address=flink-jobmanager.kafka.svc.cluster.local \
                -Drest.port=8081 \
                -f /tmp/batch-example.sql
              echo "Flink SQL submission completed."
