apiVersion: v1
kind: ServiceAccount
metadata:
  name: schema-registry
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: schema-registry-secret-access
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kafka-cluster-id"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: schema-registry-secret-access-binding
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: schema-registry-secret-access
subjects:
  - kind: ServiceAccount
    name: schema-registry
    namespace: kafka
