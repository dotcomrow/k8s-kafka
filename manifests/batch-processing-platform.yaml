# ============================================================================
# Batch processing platform (waves 47-48)
# - Apache NiFi: flow orchestration and schedule-driven ingestion
# - Apache Flink: distributed batch compute cluster
# ============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-kafka-config
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "47"
data:
  bootstrap_servers: "kafka.kafka.svc.internal.lan:9092"
  security_protocol: "SASL_PLAINTEXT"
  sasl_mechanism: "SCRAM-SHA-256"
---
apiVersion: v1
kind: Secret
metadata:
  name: batch-ui-keycloak-proxy-secrets
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "47"
type: Opaque
stringData:
  internal_oidc_issuer_url: "<path:secret/data/k8s-kafka-keycloak-internal-oidc-issuer-url#value>"
  internal_oidc_discovery_url: "<path:secret/data/k8s-kafka-keycloak-internal-oidc-discovery-url#value>"
  nifi_oidc_client_id: "<path:secret/data/keycloak-client-id-nifi-gui#value>"
  nifi_oidc_client_secret: "<path:secret/data/keycloak-client-secret-nifi-gui#value>"
  nifi_keystore_password: "<path:secret/data/k8s-kafka-nifi-keystore-password#value>"
  flink_client_id: "<path:secret/data/keycloak-client-id-flink-gui-proxy#value>"
  flink_client_secret: "<path:secret/data/keycloak-client-secret-flink-gui-proxy#value>"
  flink_cookie_secret: "<path:secret/data/k8s-kafka-flink-gui-keycloak-cookiesecret#value>"
  redis_password: "<path:secret/data/redis#password>"
---
apiVersion: v1
kind: Service
metadata:
  name: nifi-hs
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "47"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: nifi
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: nifi
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "47"
    teleport.dev/name: "nifi-gui"
    teleport.dev/description: "Apache NiFi UI"
    teleport.dev/protocol: "https"
    teleport.dev/insecure-skip-verify: "true"
    teleport.dev/public_addr: "nifi-gui.teleport.app.suncoast.systems"
    teleport.dev/labels: "environment=production,service=nifi"
  labels:
    teleport.dev/enroll: "true"
    app.kubernetes.io/name: nifi-gui
    app.kubernetes.io/component: batch
    teleport.dev/app: "nifi-gui"
spec:
  type: ClusterIP
  selector:
    app: nifi
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nifi
  namespace: kafka
  labels:
    platform.suncoast.systems/vpa-exclude: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "47"
spec:
  serviceName: nifi-hs
  replicas: 1
  selector:
    matchLabels:
      app: nifi
  volumeClaimTemplates:
    - metadata:
        name: nifi-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 40Gi
  template:
    metadata:
      labels:
        app: nifi
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-nifi-data
          image: apache/nifi:2.7.1
          command: ["/bin/bash", "-lc"]
          securityContext:
            runAsUser: 0
          env:
            - name: NIFI_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_keystore_password
            - name: NIFI_ADMIN_GROUP_NAME
              value: "platform_batch_internal_ui_user"
            - name: NIFI_LEGACY_ADMIN_GROUP_NAMES
              value: "platform_batch_ui_user"
            - name: NIFI_OPERATOR_CERT_IDENTITY
              value: "CN=nifi.kafka.svc.cluster.local, OU=Platform, O=Suncoast, L=NA, ST=NA, C=US"
          args:
            - |
              set -euo pipefail
              for d in conf flowfile_repository content_repository provenance_repository database_repository state logs; do
                mkdir -p "/data/${d}"
              done
              if [ ! -f /data/conf/nifi.properties ]; then
                cp -a /opt/nifi/nifi-current/conf/. /data/conf/
              fi

              TARGET_ADMIN_GROUP="${NIFI_ADMIN_GROUP_NAME:-platform_batch_internal_ui_user}"
              LEGACY_ADMIN_GROUPS="${NIFI_LEGACY_ADMIN_GROUP_NAMES:-platform_batch_ui_user}"

              migrate_group_name() {
                local file="$1"
                [ -f "${file}" ] || return 0
                local updated="false"
                for legacy_group in ${LEGACY_ADMIN_GROUPS}; do
                  if grep -Fq "${legacy_group}" "${file}"; then
                    sed -i "s/${legacy_group}/${TARGET_ADMIN_GROUP}/g" "${file}"
                    echo "Updated NiFi group in ${file}: ${legacy_group} -> ${TARGET_ADMIN_GROUP}"
                    updated="true"
                  fi
                done
                if [ "${updated}" = "false" ]; then
                  echo "No legacy NiFi group names found in ${file}"
                fi
              }

              migrate_group_name /data/conf/users.xml
              migrate_group_name /data/conf/authorizers.xml

              CERT_ADMIN_IDENTITY="${NIFI_OPERATOR_CERT_IDENTITY:-}"
              if [ -n "${CERT_ADMIN_IDENTITY}" ]; then
                update_xml_property() {
                  local file="$1"
                  local property="$2"
                  local value="$3"
                  [ -f "${file}" ] || return 0
                  local escaped_value=""
                  escaped_value="$(printf '%s' "${value}" | sed 's/[\/&]/\\&/g')"
                  sed -i "s#<property name=\"${property}\">.*</property>#<property name=\"${property}\">${escaped_value}</property>#g" "${file}"
                }

                update_xml_property /data/conf/authorizers.xml "Initial User Identity 1" "${CERT_ADMIN_IDENTITY}"
                update_xml_property /data/conf/authorizers.xml "Initial Admin Identity" "${CERT_ADMIN_IDENTITY}"
                update_xml_property /data/conf/authorizers.xml "Node Identity 1" "${CERT_ADMIN_IDENTITY}"

                cert_user_hash="$(printf '%s' "${CERT_ADMIN_IDENTITY}" | md5sum | awk '{print $1}')"
                CERT_USER_ID="${cert_user_hash:0:8}-${cert_user_hash:8:4}-${cert_user_hash:12:4}-${cert_user_hash:16:4}-${cert_user_hash:20:12}"

                normalize_users_xml_layout() {
                  local file="$1"
                  [ -f "${file}" ] || return 0
                  local users_line=""
                  local groups_line=""
                  users_line="$(grep -n "<users>" "${file}" | head -n1 | cut -d: -f1 || true)"
                  groups_line="$(grep -n "<groups>" "${file}" | head -n1 | cut -d: -f1 || true)"
                  if [ -n "${users_line}" ] && [ -n "${groups_line}" ] && [ "${users_line}" -lt "${groups_line}" ]; then
                    local xml_decl=""
                    xml_decl="$(sed -n '1{/^<?xml /p;}' "${file}")"
                    sed -n '/<groups>/,/<\/groups>/p' "${file}" > /tmp/nifi-groups.xml
                    sed -n '/<users>/,/<\/users>/p' "${file}" > /tmp/nifi-users.xml
                    {
                      if [ -n "${xml_decl}" ]; then
                        printf '%s\n' "${xml_decl}"
                      fi
                      printf '<tenants>\n'
                      cat /tmp/nifi-groups.xml
                      cat /tmp/nifi-users.xml
                      printf '</tenants>\n'
                    } > /tmp/nifi-users-normalized.xml
                    mv /tmp/nifi-users-normalized.xml "${file}"
                    echo "Normalized NiFi users.xml order: groups before users"
                  fi
                }

                if [ -f /data/conf/users.xml ] && ! grep -Fq "identity=\"${CERT_ADMIN_IDENTITY}\"" /data/conf/users.xml; then
                  if grep -Fq "<users>" /data/conf/users.xml; then
                    sed -i "/<users>/a\\    <user identifier=\"${CERT_USER_ID}\" identity=\"${CERT_ADMIN_IDENTITY}\"/>" /data/conf/users.xml
                  elif grep -Fq "</groups>" /data/conf/users.xml; then
                    sed -i "/<\/groups>/a\\  <users>\\n    <user identifier=\"${CERT_USER_ID}\" identity=\"${CERT_ADMIN_IDENTITY}\"/>\\n  </users>" /data/conf/users.xml
                  else
                    sed -i "/<\/tenants>/i\\  <users>\\n    <user identifier=\"${CERT_USER_ID}\" identity=\"${CERT_ADMIN_IDENTITY}\"/>\\n  </users>" /data/conf/users.xml
                  fi
                  normalize_users_xml_layout /data/conf/users.xml
                  echo "Seeded NiFi user identity for operator certificate: ${CERT_ADMIN_IDENTITY}"
                fi

                normalize_users_xml_layout /data/conf/users.xml

                if [ -f /data/conf/authorizations.xml ] && ! grep -Fq "identifier=\"${CERT_USER_ID}\"" /data/conf/authorizations.xml; then
                  awk -v uid="${CERT_USER_ID}" '
                    /<\/policy>/ { print "      <user identifier=\"" uid "\"/>" }
                    { print }
                  ' /data/conf/authorizations.xml > /tmp/authorizations.xml
                  mv /tmp/authorizations.xml /data/conf/authorizations.xml
                  echo "Granted operator certificate identity to existing NiFi policies"
                fi

                ensure_policy() {
                  local auth_file="/data/conf/authorizations.xml"
                  local users_file="/data/conf/users.xml"
                  local action="$1"
                  local resource="$2"
                  local group_id=""
                  local policy_id=""
                  local policy_tmp=""
                  [ -f "${auth_file}" ] || return 0
                  [ -f "${users_file}" ] || return 0
                  [ -n "${CERT_USER_ID:-}" ] || return 0
                  if grep -Eq "<policy[^>]*action=\"${action}\"[^>]*resource=\"${resource}\"" "${auth_file}"; then
                    return 0
                  fi

                  group_id="$(sed -n "s/.*<group identifier=\"\\([^\"]*\\)\" name=\"${TARGET_ADMIN_GROUP}\"\\/>.*/\\1/p" "${users_file}" | head -n1 || true)"
                  policy_id="$(cat /proc/sys/kernel/random/uuid 2>/dev/null || true)"
                  if [ -z "${policy_id}" ]; then
                    policy_id="$(date +%s)-${RANDOM}"
                  fi

                  policy_tmp="/tmp/nifi-policy-${action}-$(printf '%s' "${resource}" | tr '/:' '__').xml"

                  {
                    printf '    <policy action="%s" identifier="%s" resource="%s">\n' "${action}" "${policy_id}" "${resource}"
                    if [ -n "${group_id}" ]; then
                      printf '      <group identifier="%s"/>\n' "${group_id}"
                    fi
                    printf '      <user identifier="%s"/>\n' "${CERT_USER_ID}"
                    printf '    </policy>\n'
                  } > "${policy_tmp}"

                  awk '
                    /<\/policies>/ {
                      while ((getline line < policy_tmp) > 0) {
                        print line
                      }
                      close(policy_tmp)
                    }
                    { print }
                  ' policy_tmp="${policy_tmp}" "${auth_file}" > /tmp/authorizations.xml
                  mv /tmp/authorizations.xml "${auth_file}"
                  echo "Added NiFi policy action=${action} resource=${resource} for operator identity"
                }

                # Global policies needed for operator-managed API actions.
                ensure_policy "R" "/flow"
                ensure_policy "R" "/controller"
                ensure_policy "W" "/controller"
                ensure_policy "R" "/tenants"
                ensure_policy "W" "/tenants"
                ensure_policy "R" "/policies"
                ensure_policy "W" "/policies"
                ensure_policy "R" "/proxy"
                ensure_policy "W" "/proxy"
                ensure_policy "W" "/restricted-components"

                # Component-level root process group policies used by NiFiKop dataflow reconcile.
                # NiFi may authorize root process-group operations against "root", "identifier",
                # or "instanceIdentifier" depending on endpoint/runtime context.
                root_pg_resources="root"
                if [ -f /data/conf/flow.json.gz ]; then
                  flow_json_flat="$(gzip -dc /data/conf/flow.json.gz 2>/dev/null | tr -d '\n' || true)"
                  root_pg_identifier="$(printf '%s' "${flow_json_flat}" | sed -n 's/.*"rootGroup":{"identifier":"\([^"]*\)".*/\1/p' | head -n1 || true)"
                  root_pg_instance_identifier="$(printf '%s' "${flow_json_flat}" | sed -n 's/.*"rootGroup":{"identifier":"[^"]*","instanceIdentifier":"\([^"]*\)".*/\1/p' | head -n1 || true)"
                  if [ -n "${root_pg_identifier}" ] && ! printf '%s\n' "${root_pg_resources}" | tr ' ' '\n' | grep -Fxq "${root_pg_identifier}"; then
                    root_pg_resources="${root_pg_resources} ${root_pg_identifier}"
                  fi
                  if [ -n "${root_pg_instance_identifier}" ] && ! printf '%s\n' "${root_pg_resources}" | tr ' ' '\n' | grep -Fxq "${root_pg_instance_identifier}"; then
                    root_pg_resources="${root_pg_resources} ${root_pg_instance_identifier}"
                  fi
                fi
                echo "NiFi root process-group policy resources: ${root_pg_resources}"
                for root_pg in ${root_pg_resources}; do
                  ensure_policy "R" "/process-groups/${root_pg}"
                  ensure_policy "W" "/process-groups/${root_pg}"
                  ensure_policy "R" "/data/process-groups/${root_pg}"
                  ensure_policy "W" "/data/process-groups/${root_pg}"
                  ensure_policy "W" "/operation/process-groups/${root_pg}"
                  ensure_policy "R" "/policies/process-groups/${root_pg}"
                  ensure_policy "W" "/policies/process-groups/${root_pg}"
                done
              fi

              KEYTOOL_BIN="$(command -v keytool || true)"
              if [ -z "${KEYTOOL_BIN}" ]; then
                KEYTOOL_BIN="$(find /usr/lib/jvm -type f -name keytool 2>/dev/null | head -n1 || true)"
              fi
              if [ -z "${KEYTOOL_BIN}" ]; then
                echo "ERROR: keytool not found in init container"
                exit 1
              fi

              REGENERATE_KEYSTORES="false"
              REQUIRED_CERT_DNS_LIST="nifi-gui.teleport.app.suncoast.systems nifi-0 nifi-0.nifi-hs.kafka.svc.cluster.local"
              if [ ! -f /data/conf/keystore.p12 ] || [ ! -f /data/conf/truststore.p12 ]; then
                REGENERATE_KEYSTORES="true"
              elif ! "${KEYTOOL_BIN}" -list \
                -keystore /data/conf/keystore.p12 \
                -storetype PKCS12 \
                -storepass "${NIFI_KEYSTORE_PASSWORD}" >/dev/null 2>&1; then
                echo "Existing NiFi keystore is unreadable with current password; regenerating"
                REGENERATE_KEYSTORES="true"
              else
                CERT_DUMP="$("${KEYTOOL_BIN}" -list -v \
                  -alias nifi-key \
                  -keystore /data/conf/keystore.p12 \
                  -storetype PKCS12 \
                  -storepass "${NIFI_KEYSTORE_PASSWORD}" 2>/dev/null || true)"
                for required_dns in ${REQUIRED_CERT_DNS_LIST}; do
                  if ! printf '%s\n' "${CERT_DUMP}" | grep -Fq "DNSName: ${required_dns}"; then
                    echo "Existing NiFi certificate missing SAN ${required_dns}; regenerating"
                    REGENERATE_KEYSTORES="true"
                    break
                  fi
                done
              fi

              if [ "${REGENERATE_KEYSTORES}" = "true" ]; then
                rm -f /data/conf/keystore.p12 /data/conf/truststore.p12 /tmp/nifi-cert.pem
                "${KEYTOOL_BIN}" -genkeypair \
                  -alias nifi-key \
                  -keyalg RSA \
                  -keysize 2048 \
                  -validity 3650 \
                  -dname "CN=nifi.kafka.svc.cluster.local, OU=Platform, O=Suncoast, L=NA, ST=NA, C=US" \
                  -ext "SAN=dns:nifi.kafka.svc.cluster.local,dns:nifi-0,dns:nifi-0.nifi-hs.kafka.svc.cluster.local,dns:nifi,dns:nifi-gui.teleport.app.suncoast.systems" \
                  -keystore /data/conf/keystore.p12 \
                  -storetype PKCS12 \
                  -storepass "${NIFI_KEYSTORE_PASSWORD}" \
                  -keypass "${NIFI_KEYSTORE_PASSWORD}"

                "${KEYTOOL_BIN}" -exportcert \
                  -alias nifi-key \
                  -keystore /data/conf/keystore.p12 \
                  -storetype PKCS12 \
                  -storepass "${NIFI_KEYSTORE_PASSWORD}" \
                  -rfc \
                  -file /tmp/nifi-cert.pem

                "${KEYTOOL_BIN}" -importcert \
                  -alias nifi-ca \
                  -file /tmp/nifi-cert.pem \
                  -keystore /data/conf/truststore.p12 \
                  -storetype PKCS12 \
                  -storepass "${NIFI_KEYSTORE_PASSWORD}" \
                  -noprompt
              fi

              # Force deterministic single-node cluster mode so NiFiKop external-cluster
              # resources can reconcile declaratively against /nifi-api/controller/cluster.
              set_nifi_property() {
                local key="$1"
                local value="$2"
                local file="/data/conf/nifi.properties"
                if grep -q "^${key}=" "${file}"; then
                  sed -i "s|^${key}=.*$|${key}=${value}|" "${file}"
                else
                  echo "${key}=${value}" >> "${file}"
                fi
              }

              set_nifi_property "nifi.cluster.is.node" "true"
              set_nifi_property "nifi.cluster.node.address" "nifi-0.nifi-hs.kafka.svc.cluster.local"
              set_nifi_property "nifi.cluster.node.protocol.port" "11443"
              set_nifi_property "nifi.cluster.protocol.is.secure" "true"
              set_nifi_property "nifi.cluster.node.connection.timeout" "30 sec"
              set_nifi_property "nifi.cluster.node.read.timeout" "60 sec"
              set_nifi_property "nifi.zookeeper.connect.string" "nifi-0.nifi-hs.kafka.svc.cluster.local:2181"
              set_nifi_property "nifi.zookeeper.root.node" "/nifi-kafka"
              set_nifi_property "nifi.state.management.embedded.zookeeper.start" "true"
              set_nifi_property "nifi.cluster.flow.election.max.wait.time" "30 sec"
              set_nifi_property "nifi.cluster.flow.election.max.candidates" "1"
              set_nifi_property "nifi.web.request.timeout" "120 secs"

              set_zk_property() {
                local key="$1"
                local value="$2"
                local file="/data/conf/zookeeper.properties"
                if grep -q "^${key}=" "${file}"; then
                  sed -i "s|^${key}=.*$|${key}=${value}|" "${file}"
                else
                  echo "${key}=${value}" >> "${file}"
                fi
              }

              set_zk_property "dataDir" "/opt/nifi/nifi-current/state/zookeeper"
              set_zk_property "clientPort" "2181"
              set_zk_property "server.1" "nifi-0.nifi-hs.kafka.svc.cluster.local:2888:3888;2181"

              mkdir -p /data/state/zookeeper
              echo "1" > /data/state/zookeeper/myid

              chown -R 1000:1000 /data
          volumeMounts:
            - name: nifi-data
              mountPath: /data
      containers:
        - name: nifi
          image: apache/nifi:2.7.1
          ports:
            - name: https
              containerPort: 8443
            - name: cluster-proto
              containerPort: 11443
          env:
            - name: AUTH
              value: "oidc"
            - name: KEYSTORE_PATH
              value: "/opt/nifi/nifi-current/conf/keystore.p12"
            - name: KEYSTORE_TYPE
              value: "PKCS12"
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_keystore_password
            - name: TRUSTSTORE_PATH
              value: "/opt/nifi/nifi-current/conf/truststore.p12"
            - name: TRUSTSTORE_TYPE
              value: "PKCS12"
            - name: TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_keystore_password
            - name: INITIAL_ADMIN_GROUP
              value: "platform_batch_internal_ui_user"
            - name: NIFI_SECURITY_USER_OIDC_DISCOVERY_URL
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: internal_oidc_discovery_url
            - name: NIFI_SECURITY_USER_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_oidc_client_id
            - name: NIFI_SECURITY_USER_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_oidc_client_secret
            - name: NIFI_SECURITY_USER_OIDC_ADDITIONAL_SCOPES
              value: "profile,email"
            - name: NIFI_SECURITY_USER_OIDC_CLAIM_IDENTIFYING_USER
              value: "preferred_username"
            - name: NIFI_SECURITY_USER_OIDC_FALLBACK_CLAIMS_IDENTIFYING_USER
              value: "email,sub"
            - name: NIFI_SECURITY_USER_OIDC_CLAIM_GROUPS
              value: "groups"
            - name: NIFI_SECURITY_USER_OIDC_TRUSTSTORE_STRATEGY
              value: "JDK"
            - name: NIFI_WEB_HTTPS_PORT
              value: "8443"
            - name: NIFI_WEB_HTTPS_HOST
              value: "nifi-0.nifi-hs.kafka.svc.cluster.local"
            - name: NIFI_WEB_PROXY_HOST
              value: "nifi-gui.teleport.app.suncoast.systems"
            - name: NIFI_CLUSTER_IS_NODE
              value: "true"
            - name: NIFI_CLUSTER_ADDRESS
              value: "nifi-0.nifi-hs.kafka.svc.cluster.local"
            - name: NIFI_CLUSTER_NODE_PROTOCOL_PORT
              value: "11443"
            - name: NIFI_CLUSTER_NODE_CONNECTION_TIMEOUT
              value: "30 sec"
            - name: NIFI_CLUSTER_NODE_READ_TIMEOUT
              value: "60 sec"
            - name: NIFI_CLUSTER_FLOW_ELECTION_MAX_WAIT_TIME
              value: "30 sec"
            - name: NIFI_CLUSTER_FLOW_ELECTION_MAX_CANDIDATES
              value: "1"
            - name: NIFI_ZK_CONNECT_STRING
              value: "nifi-0.nifi-hs.kafka.svc.cluster.local:2181"
            - name: NIFI_ZK_ROOT_NODE
              value: "/nifi-kafka"
            - name: NIFI_WEB_REQUEST_TIMEOUT
              value: "120 secs"
            - name: NIFI_JVM_HEAP_INIT
              value: "2g"
            - name: NIFI_JVM_HEAP_MAX
              value: "2g"
            - name: BATCH_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: BATCH_KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: BATCH_KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: BATCH_KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_username
            - name: BATCH_KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_password
          volumeMounts:
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/conf
              subPath: conf
            - name: nifi-example-reference
              mountPath: /opt/nifi/nifi-current/conf/examples
              readOnly: true
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/flowfile_repository
              subPath: flowfile_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/content_repository
              subPath: content_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/provenance_repository
              subPath: provenance_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/database_repository
              subPath: database_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/state
              subPath: state
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/logs
              subPath: logs
          startupProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  # Keep pod unready until processor metadata endpoint is responsive; this
                  # avoids early UI extension-type popup errors during startup.
                  code="$(curl -k -sS -o /dev/null -w '%{http_code}' "https://${NIFI_WEB_HTTPS_HOST}:8443/nifi-api/flow/processor-types" || true)"
                  [ "${code}" = "200" ] || [ "${code}" = "401" ] || [ "${code}" = "403" ]
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      securityContext:
        fsGroup: 1000
      volumes:
        - name: nifi-example-reference
          configMap:
            name: nifi-kafka-example-reference
            optional: true
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "48"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image: flink:1.20.3-scala_2.12-java17
  mode: native
  flinkVersion: v1_20
  serviceAccount: flink
  flinkConfiguration:
    kubernetes.jobmanager.labels: "platform.suncoast.systems/vpa-exclude:true"
    taskmanager.numberOfTaskSlots: "2"
    blob.server.port: "6124"
    jobmanager.rpc.port: "6123"
    taskmanager.rpc.port: "6122"
    kubernetes.jobmanager.cpu.limit-factor: "2.0"
    kubernetes.taskmanager.cpu.limit-factor: "2.0"
    kubernetes.jobmanager.memory.limit-factor: "1.3333334"
    kubernetes.taskmanager.memory.limit-factor: "1.5"
    jobmanager.memory.process.size: 1536m
    taskmanager.memory.process.size: 2048m
    parallelism.default: "2"
    execution.runtime-mode: BATCH
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "3"
    restart-strategy.fixed-delay.delay: "10 s"
  logConfiguration:
    log4j-console.properties: |+
      rootLogger.level = INFO
      rootLogger.appenderRef.console.ref = ConsoleAppender
      rootLogger.appenderRef.rolling.ref = RollingFileAppender
      logger.pekko.name = org.apache.pekko
      logger.pekko.level = INFO
      logger.kafka.name = org.apache.kafka
      logger.kafka.level = INFO
      appender.console.name = ConsoleAppender
      appender.console.type = CONSOLE
      appender.console.layout.type = PatternLayout
      appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
      appender.rolling.name = RollingFileAppender
      appender.rolling.type = RollingFile
      appender.rolling.append = false
      appender.rolling.fileName = ${sys:log.file}
      appender.rolling.filePattern = ${sys:log.file}.%i
      appender.rolling.layout.type = PatternLayout
      appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
      appender.rolling.policies.type = Policies
      appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
      appender.rolling.policies.size.size = 100MB
      appender.rolling.strategy.type = DefaultRolloverStrategy
      appender.rolling.strategy.max = 10
  podTemplate:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
  jobManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: "1536m"
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            env:
              - name: KAFKA_BOOTSTRAP_SERVERS
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: bootstrap_servers
              - name: KAFKA_SECURITY_PROTOCOL
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: security_protocol
              - name: KAFKA_SASL_MECHANISM
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: sasl_mechanism
              - name: KAFKA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: kafka-security-credentials
                    key: flink_username
              - name: KAFKA_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: kafka-security-credentials
                    key: flink_password
            livenessProbe:
              tcpSocket:
                port: 6123
              initialDelaySeconds: 30
              periodSeconds: 60
            readinessProbe:
              tcpSocket:
                port: 6123
              initialDelaySeconds: 20
              periodSeconds: 20
            securityContext:
              runAsUser: 9999
              runAsGroup: 9999
  taskManager:
    replicas: 2
    resource:
      cpu: 1
      memory: "2048m"
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            env:
              - name: KAFKA_BOOTSTRAP_SERVERS
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: bootstrap_servers
              - name: KAFKA_SECURITY_PROTOCOL
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: security_protocol
              - name: KAFKA_SASL_MECHANISM
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: sasl_mechanism
              - name: KAFKA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: kafka-security-credentials
                    key: flink_username
              - name: KAFKA_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: kafka-security-credentials
                    key: flink_password
            livenessProbe:
              tcpSocket:
                port: 6122
              initialDelaySeconds: 30
              periodSeconds: 60
            readinessProbe:
              tcpSocket:
                port: 6122
              initialDelaySeconds: 20
              periodSeconds: 20
            securityContext:
              runAsUser: 9999
              runAsGroup: 9999
