# ============================================================================
# Batch processing platform (waves 47-48)
# - Apache NiFi: flow orchestration and schedule-driven ingestion
# - Apache Flink: distributed batch compute cluster
# ============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-kafka-config
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "47"
data:
  bootstrap_servers: "kafka.kafka.svc.internal.lan:9092"
  security_protocol: "SASL_PLAINTEXT"
  sasl_mechanism: "SCRAM-SHA-256"
---
apiVersion: v1
kind: Secret
metadata:
  name: batch-ui-keycloak-proxy-secrets
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "47"
type: Opaque
stringData:
  internal_oidc_issuer_url: "<path:secret/data/k8s-kafka-keycloak-internal-oidc-issuer-url#value>"
  internal_oidc_discovery_url: "<path:secret/data/k8s-kafka-keycloak-internal-oidc-discovery-url#value>"
  nifi_oidc_client_id: "<path:secret/data/keycloak-client-id-nifi-gui#value>"
  nifi_oidc_client_secret: "<path:secret/data/keycloak-client-secret-nifi-gui#value>"
  nifi_keystore_password: "<path:secret/data/k8s-kafka-nifi-keystore-password#value>"
  flink_client_id: "<path:secret/data/keycloak-client-id-flink-gui-proxy#value>"
  flink_client_secret: "<path:secret/data/keycloak-client-secret-flink-gui-proxy#value>"
  flink_cookie_secret: "<path:secret/data/k8s-kafka-flink-gui-keycloak-cookiesecret#value>"
---
apiVersion: v1
kind: Service
metadata:
  name: nifi-hs
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "47"
spec:
  clusterIP: None
  selector:
    app: nifi
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: nifi
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "47"
    teleport.dev/name: "nifi-gui"
    teleport.dev/description: "Apache NiFi UI"
    teleport.dev/protocol: "https"
    teleport.dev/insecure-skip-verify: "true"
    teleport.dev/public_addr: "nifi-gui.teleport.app.suncoast.systems"
    teleport.dev/labels: "environment=production,service=nifi"
  labels:
    teleport.dev/enroll: "true"
    app.kubernetes.io/name: nifi-gui
    app.kubernetes.io/component: batch
    teleport.dev/app: "nifi-gui"
spec:
  type: ClusterIP
  selector:
    app: nifi
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nifi
  namespace: kafka
  labels:
    platform.suncoast.systems/vpa-exclude: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "47"
spec:
  serviceName: nifi-hs
  replicas: 1
  selector:
    matchLabels:
      app: nifi
  volumeClaimTemplates:
    - metadata:
        name: nifi-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 40Gi
  template:
    metadata:
      labels:
        app: nifi
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-nifi-data
          image: apache/nifi:2.7.1
          command: ["/bin/bash", "-lc"]
          securityContext:
            runAsUser: 0
          env:
            - name: NIFI_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_keystore_password
            - name: NIFI_ADMIN_GROUP_NAME
              value: "platform_batch_internal_ui_user"
            - name: NIFI_LEGACY_ADMIN_GROUP_NAMES
              value: "platform_batch_ui_user"
            - name: NIFI_OPERATOR_CERT_IDENTITY
              value: "CN=nifi.kafka.svc.cluster.local, OU=Platform, O=Suncoast, L=NA, ST=NA, C=US"
          args:
            - |
              set -euo pipefail
              for d in conf flowfile_repository content_repository provenance_repository database_repository state logs; do
                mkdir -p "/data/${d}"
              done
              if [ ! -f /data/conf/nifi.properties ]; then
                cp -a /opt/nifi/nifi-current/conf/. /data/conf/
              fi

              TARGET_ADMIN_GROUP="${NIFI_ADMIN_GROUP_NAME:-platform_batch_internal_ui_user}"
              LEGACY_ADMIN_GROUPS="${NIFI_LEGACY_ADMIN_GROUP_NAMES:-platform_batch_ui_user}"

              migrate_group_name() {
                local file="$1"
                [ -f "${file}" ] || return 0
                local updated="false"
                for legacy_group in ${LEGACY_ADMIN_GROUPS}; do
                  if grep -Fq "${legacy_group}" "${file}"; then
                    sed -i "s/${legacy_group}/${TARGET_ADMIN_GROUP}/g" "${file}"
                    echo "Updated NiFi group in ${file}: ${legacy_group} -> ${TARGET_ADMIN_GROUP}"
                    updated="true"
                  fi
                done
                if [ "${updated}" = "false" ]; then
                  echo "No legacy NiFi group names found in ${file}"
                fi
              }

              migrate_group_name /data/conf/users.xml
              migrate_group_name /data/conf/authorizers.xml

              CERT_ADMIN_IDENTITY="${NIFI_OPERATOR_CERT_IDENTITY:-}"
              if [ -n "${CERT_ADMIN_IDENTITY}" ]; then
                update_xml_property() {
                  local file="$1"
                  local property="$2"
                  local value="$3"
                  [ -f "${file}" ] || return 0
                  local escaped_value=""
                  escaped_value="$(printf '%s' "${value}" | sed 's/[\/&]/\\&/g')"
                  sed -i "s#<property name=\"${property}\">.*</property>#<property name=\"${property}\">${escaped_value}</property>#g" "${file}"
                }

                update_xml_property /data/conf/authorizers.xml "Initial User Identity 1" "${CERT_ADMIN_IDENTITY}"
                update_xml_property /data/conf/authorizers.xml "Initial Admin Identity" "${CERT_ADMIN_IDENTITY}"

                cert_user_hash="$(printf '%s' "${CERT_ADMIN_IDENTITY}" | md5sum | awk '{print $1}')"
                CERT_USER_ID="${cert_user_hash:0:8}-${cert_user_hash:8:4}-${cert_user_hash:12:4}-${cert_user_hash:16:4}-${cert_user_hash:20:12}"

                normalize_users_xml_layout() {
                  local file="$1"
                  [ -f "${file}" ] || return 0
                  local users_line=""
                  local groups_line=""
                  users_line="$(grep -n "<users>" "${file}" | head -n1 | cut -d: -f1 || true)"
                  groups_line="$(grep -n "<groups>" "${file}" | head -n1 | cut -d: -f1 || true)"
                  if [ -n "${users_line}" ] && [ -n "${groups_line}" ] && [ "${users_line}" -lt "${groups_line}" ]; then
                    local xml_decl=""
                    xml_decl="$(sed -n '1{/^<?xml /p;}' "${file}")"
                    sed -n '/<groups>/,/<\/groups>/p' "${file}" > /tmp/nifi-groups.xml
                    sed -n '/<users>/,/<\/users>/p' "${file}" > /tmp/nifi-users.xml
                    {
                      if [ -n "${xml_decl}" ]; then
                        printf '%s\n' "${xml_decl}"
                      fi
                      printf '<tenants>\n'
                      cat /tmp/nifi-groups.xml
                      cat /tmp/nifi-users.xml
                      printf '</tenants>\n'
                    } > /tmp/nifi-users-normalized.xml
                    mv /tmp/nifi-users-normalized.xml "${file}"
                    echo "Normalized NiFi users.xml order: groups before users"
                  fi
                }

                if [ -f /data/conf/users.xml ] && ! grep -Fq "identity=\"${CERT_ADMIN_IDENTITY}\"" /data/conf/users.xml; then
                  if grep -Fq "<users>" /data/conf/users.xml; then
                    sed -i "/<users>/a\\    <user identifier=\"${CERT_USER_ID}\" identity=\"${CERT_ADMIN_IDENTITY}\"/>" /data/conf/users.xml
                  elif grep -Fq "</groups>" /data/conf/users.xml; then
                    sed -i "/<\/groups>/a\\  <users>\\n    <user identifier=\"${CERT_USER_ID}\" identity=\"${CERT_ADMIN_IDENTITY}\"/>\\n  </users>" /data/conf/users.xml
                  else
                    sed -i "/<\/tenants>/i\\  <users>\\n    <user identifier=\"${CERT_USER_ID}\" identity=\"${CERT_ADMIN_IDENTITY}\"/>\\n  </users>" /data/conf/users.xml
                  fi
                  normalize_users_xml_layout /data/conf/users.xml
                  echo "Seeded NiFi user identity for operator certificate: ${CERT_ADMIN_IDENTITY}"
                fi

                normalize_users_xml_layout /data/conf/users.xml

                if [ -f /data/conf/authorizations.xml ] && ! grep -Fq "identifier=\"${CERT_USER_ID}\"" /data/conf/authorizations.xml; then
                  awk -v uid="${CERT_USER_ID}" '
                    /<\/policy>/ { print "      <user identifier=\"" uid "\"/>" }
                    { print }
                  ' /data/conf/authorizations.xml > /tmp/authorizations.xml
                  mv /tmp/authorizations.xml /data/conf/authorizations.xml
                  echo "Granted operator certificate identity to existing NiFi policies"
                fi
              fi

              KEYTOOL_BIN="$(command -v keytool || true)"
              if [ -z "${KEYTOOL_BIN}" ]; then
                KEYTOOL_BIN="$(find /usr/lib/jvm -type f -name keytool 2>/dev/null | head -n1 || true)"
              fi
              if [ -z "${KEYTOOL_BIN}" ]; then
                echo "ERROR: keytool not found in init container"
                exit 1
              fi

              REGENERATE_KEYSTORES="false"
              REQUIRED_CERT_DNS="nifi-gui.teleport.app.suncoast.systems"
              if [ ! -f /data/conf/keystore.p12 ] || [ ! -f /data/conf/truststore.p12 ]; then
                REGENERATE_KEYSTORES="true"
              elif ! "${KEYTOOL_BIN}" -list \
                -keystore /data/conf/keystore.p12 \
                -storetype PKCS12 \
                -storepass "${NIFI_KEYSTORE_PASSWORD}" >/dev/null 2>&1; then
                echo "Existing NiFi keystore is unreadable with current password; regenerating"
                REGENERATE_KEYSTORES="true"
              elif ! "${KEYTOOL_BIN}" -list -v \
                -alias nifi-key \
                -keystore /data/conf/keystore.p12 \
                -storetype PKCS12 \
                -storepass "${NIFI_KEYSTORE_PASSWORD}" 2>/dev/null | grep -Fq "DNSName: ${REQUIRED_CERT_DNS}"; then
                echo "Existing NiFi certificate missing SAN ${REQUIRED_CERT_DNS}; regenerating"
                REGENERATE_KEYSTORES="true"
              fi

              if [ "${REGENERATE_KEYSTORES}" = "true" ]; then
                rm -f /data/conf/keystore.p12 /data/conf/truststore.p12 /tmp/nifi-cert.pem
                "${KEYTOOL_BIN}" -genkeypair \
                  -alias nifi-key \
                  -keyalg RSA \
                  -keysize 2048 \
                  -validity 3650 \
                  -dname "CN=nifi.kafka.svc.cluster.local, OU=Platform, O=Suncoast, L=NA, ST=NA, C=US" \
                  -ext "SAN=dns:nifi.kafka.svc.cluster.local,dns:nifi-0.nifi-hs.kafka.svc.cluster.local,dns:nifi,dns:nifi-gui.teleport.app.suncoast.systems" \
                  -keystore /data/conf/keystore.p12 \
                  -storetype PKCS12 \
                  -storepass "${NIFI_KEYSTORE_PASSWORD}" \
                  -keypass "${NIFI_KEYSTORE_PASSWORD}"

                "${KEYTOOL_BIN}" -exportcert \
                  -alias nifi-key \
                  -keystore /data/conf/keystore.p12 \
                  -storetype PKCS12 \
                  -storepass "${NIFI_KEYSTORE_PASSWORD}" \
                  -rfc \
                  -file /tmp/nifi-cert.pem

                "${KEYTOOL_BIN}" -importcert \
                  -alias nifi-ca \
                  -file /tmp/nifi-cert.pem \
                  -keystore /data/conf/truststore.p12 \
                  -storetype PKCS12 \
                  -storepass "${NIFI_KEYSTORE_PASSWORD}" \
                  -noprompt
              fi

              chown -R 1000:1000 /data
          volumeMounts:
            - name: nifi-data
              mountPath: /data
      containers:
        - name: nifi
          image: apache/nifi:2.7.1
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: AUTH
              value: "oidc"
            - name: KEYSTORE_PATH
              value: "/opt/nifi/nifi-current/conf/keystore.p12"
            - name: KEYSTORE_TYPE
              value: "PKCS12"
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_keystore_password
            - name: TRUSTSTORE_PATH
              value: "/opt/nifi/nifi-current/conf/truststore.p12"
            - name: TRUSTSTORE_TYPE
              value: "PKCS12"
            - name: TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_keystore_password
            - name: INITIAL_ADMIN_GROUP
              value: "platform_batch_internal_ui_user"
            - name: NIFI_SECURITY_USER_OIDC_DISCOVERY_URL
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: internal_oidc_discovery_url
            - name: NIFI_SECURITY_USER_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_oidc_client_id
            - name: NIFI_SECURITY_USER_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: nifi_oidc_client_secret
            - name: NIFI_SECURITY_USER_OIDC_ADDITIONAL_SCOPES
              value: "profile,email"
            - name: NIFI_SECURITY_USER_OIDC_CLAIM_IDENTIFYING_USER
              value: "preferred_username"
            - name: NIFI_SECURITY_USER_OIDC_FALLBACK_CLAIMS_IDENTIFYING_USER
              value: "email,sub"
            - name: NIFI_SECURITY_USER_OIDC_CLAIM_GROUPS
              value: "groups"
            - name: NIFI_SECURITY_USER_OIDC_TRUSTSTORE_STRATEGY
              value: "JDK"
            - name: NIFI_WEB_HTTPS_PORT
              value: "8443"
            - name: NIFI_WEB_PROXY_HOST
              value: "nifi-gui.teleport.app.suncoast.systems"
            - name: NIFI_CLUSTER_IS_NODE
              value: "false"
            - name: NIFI_JVM_HEAP_INIT
              value: "2g"
            - name: NIFI_JVM_HEAP_MAX
              value: "2g"
            - name: BATCH_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: bootstrap_servers
            - name: BATCH_KAFKA_SECURITY_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: security_protocol
            - name: BATCH_KAFKA_SASL_MECHANISM
              valueFrom:
                configMapKeyRef:
                  name: batch-kafka-config
                  key: sasl_mechanism
            - name: BATCH_KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_username
            - name: BATCH_KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-security-credentials
                  key: nifi_password
          volumeMounts:
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/conf
              subPath: conf
            - name: nifi-example-reference
              mountPath: /opt/nifi/nifi-current/conf/examples
              readOnly: true
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/flowfile_repository
              subPath: flowfile_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/content_repository
              subPath: content_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/provenance_repository
              subPath: provenance_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/database_repository
              subPath: database_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/state
              subPath: state
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/logs
              subPath: logs
          startupProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      securityContext:
        fsGroup: 1000
      volumes:
        - name: nifi-example-reference
          configMap:
            name: nifi-kafka-example-reference
            optional: true
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "48"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image: flink:1.20.3-scala_2.12-java17
  mode: native
  flinkVersion: v1_20
  serviceAccount: flink
  flinkConfiguration:
    kubernetes.jobmanager.labels: "platform.suncoast.systems/vpa-exclude:true"
    taskmanager.numberOfTaskSlots: "2"
    blob.server.port: "6124"
    jobmanager.rpc.port: "6123"
    taskmanager.rpc.port: "6122"
    kubernetes.jobmanager.cpu.limit-factor: "2.0"
    kubernetes.taskmanager.cpu.limit-factor: "2.0"
    kubernetes.jobmanager.memory.limit-factor: "1.3333334"
    kubernetes.taskmanager.memory.limit-factor: "1.5"
    jobmanager.memory.process.size: 1536m
    taskmanager.memory.process.size: 2048m
    parallelism.default: "2"
    execution.runtime-mode: BATCH
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "3"
    restart-strategy.fixed-delay.delay: "10 s"
  logConfiguration:
    log4j-console.properties: |+
      rootLogger.level = INFO
      rootLogger.appenderRef.console.ref = ConsoleAppender
      rootLogger.appenderRef.rolling.ref = RollingFileAppender
      logger.pekko.name = org.apache.pekko
      logger.pekko.level = INFO
      logger.kafka.name = org.apache.kafka
      logger.kafka.level = INFO
      appender.console.name = ConsoleAppender
      appender.console.type = CONSOLE
      appender.console.layout.type = PatternLayout
      appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
      appender.rolling.name = RollingFileAppender
      appender.rolling.type = RollingFile
      appender.rolling.append = false
      appender.rolling.fileName = ${sys:log.file}
      appender.rolling.filePattern = ${sys:log.file}.%i
      appender.rolling.layout.type = PatternLayout
      appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
      appender.rolling.policies.type = Policies
      appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
      appender.rolling.policies.size.size = 100MB
      appender.rolling.strategy.type = DefaultRolloverStrategy
      appender.rolling.strategy.max = 10
  podTemplate:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
  jobManager:
    replicas: 1
    resource:
      cpu: 0.5
      memory: "1536m"
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            env:
              - name: KAFKA_BOOTSTRAP_SERVERS
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: bootstrap_servers
              - name: KAFKA_SECURITY_PROTOCOL
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: security_protocol
              - name: KAFKA_SASL_MECHANISM
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: sasl_mechanism
              - name: KAFKA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: kafka-security-credentials
                    key: flink_username
              - name: KAFKA_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: kafka-security-credentials
                    key: flink_password
            livenessProbe:
              tcpSocket:
                port: 6123
              initialDelaySeconds: 30
              periodSeconds: 60
            readinessProbe:
              tcpSocket:
                port: 6123
              initialDelaySeconds: 20
              periodSeconds: 20
            securityContext:
              runAsUser: 9999
              runAsGroup: 9999
  taskManager:
    replicas: 2
    resource:
      cpu: 1
      memory: "2048m"
    podTemplate:
      spec:
        containers:
          - name: flink-main-container
            env:
              - name: KAFKA_BOOTSTRAP_SERVERS
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: bootstrap_servers
              - name: KAFKA_SECURITY_PROTOCOL
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: security_protocol
              - name: KAFKA_SASL_MECHANISM
                valueFrom:
                  configMapKeyRef:
                    name: batch-kafka-config
                    key: sasl_mechanism
              - name: KAFKA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: kafka-security-credentials
                    key: flink_username
              - name: KAFKA_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: kafka-security-credentials
                    key: flink_password
            livenessProbe:
              tcpSocket:
                port: 6122
              initialDelaySeconds: 30
              periodSeconds: 60
            readinessProbe:
              tcpSocket:
                port: 6122
              initialDelaySeconds: 20
              periodSeconds: 20
            securityContext:
              runAsUser: 9999
              runAsGroup: 9999
---
apiVersion: v1
kind: Service
metadata:
  name: flink-oauth2-proxy
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "48"
    teleport.dev/name: "flink-gui"
    teleport.dev/description: "Apache Flink UI"
    teleport.dev/protocol: "http"
    teleport.dev/public_addr: "flink-gui.teleport.app.suncoast.systems"
    teleport.dev/labels: "environment=production,service=flink"
  labels:
    teleport.dev/enroll: "true"
    app.kubernetes.io/name: flink-gui
    app.kubernetes.io/component: batch
    teleport.dev/app: "flink-gui"
spec:
  ports:
    - name: http
      port: 4180
      targetPort: http
  selector:
    app: flink-oauth2-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-oauth2-proxy
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "48"
  labels:
    platform.suncoast.systems/vpa-exclude: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-oauth2-proxy
  template:
    metadata:
      labels:
        app: flink-oauth2-proxy
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.2
          ports:
            - containerPort: 4180
              name: http
          args:
            - --provider=keycloak-oidc
            - --http-address=0.0.0.0:4180
            - --upstream=http://flink-rest.kafka.svc.cluster.local:8081/
            - --upstream-timeout=120s
            - --disable-keep-alives=true
            - --redirect-url=https://flink-gui.teleport.app.suncoast.systems/oauth2/callback
            - --code-challenge-method=S256
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-refresh=1h
            - --cookie-expire=8h
            - --email-domain=*
            - --pass-host-header=false
            - --skip-provider-button=true
            - --allowed-role=platform_batch_internal_ui_user
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: flink_client_id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: flink_client_secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: flink_cookie_secret
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: batch-ui-keycloak-proxy-secrets
                  key: internal_oidc_issuer_url
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
