# ============================================================================
# Kafka (wave 3): KRaft broker/controller cluster
#
# The cluster uses dynamic KRaft membership. Broker/controller identities are
# derived from StatefulSet ordinals, and new controller storage joins without
# initial voters. See ../docs/KAFKA_RF3_ROLLOUT.md. Replicas are raised one at
# a time during Gate 3; topic replication remains a separate Gate 4 change.
# ============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  selector:
    app: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-hs
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  clusterIP: None
  # Controllers must be discoverable while starting, before their broker
  # readiness probe succeeds, so dynamic quorum bootstrap cannot deadlock on
  # Kubernetes endpoint readiness.
  publishNotReadyAddresses: true
  ports: [{ name: controller, port: 9093, targetPort: 9093 }]
  selector: { app: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    platform.suncoast.systems/vpa-exclude: "true"
spec:
  serviceName: kafka-hs
  replicas: 2
  updateStrategy:
    type: RollingUpdate
  selector: { matchLabels: { app: kafka } }
  volumeClaimTemplates:
  - metadata:
      name: kafka-logs
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
  template:
    metadata:
      labels: { app: kafka }
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "data-bootstrap"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/exit-on-error: "false"
        vault.hashicorp.com/agent-inject-secret-gcp-key.json: "secret/data/kafka/bq/config"
        vault.hashicorp.com/agent-inject-template-gcp-key.json: |
          {{- with secret "secret/data/kafka/bq/config" -}}
          {{ .Data.data.sa_json }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-permissions-gcp-key.json: "0644"
    spec:
      serviceAccountName: bq-yb-bootstrap
      securityContext:
        fsGroup: 1000
        runAsUser: 0
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - work-node-t4-gpu
                - work-node-l4-gpu
                - srvr-node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: kafka
            topologyKey: kubernetes.io/hostname
      initContainers:
      - name: format-storage
        image: apache/kafka:4.1.2
        env:
        - name: CLUSTER_ID
          valueFrom: { secretKeyRef: { name: kafka-cluster-id, key: CLUSTER_ID } }
        command: ["/bin/bash","-lc"]
        args:
        - |
          set -eu
          LOG_DIR="/tmp/kraft-combined-logs/kafka-data"
          CONF="/tmp/kraft/server.properties"
          ORDINAL="${HOSTNAME##*-}"
          case "${ORDINAL}" in
            ''|*[!0-9]*) echo "Unable to derive StatefulSet ordinal from HOSTNAME=${HOSTNAME}" >&2; exit 1 ;;
          esac
          NODE_ID="$((ORDINAL + 1))"
          POD_FQDN="${HOSTNAME}.kafka-hs.kafka.svc.internal.lan"
          mkdir -p "$LOG_DIR" /tmp/kraft
          cp /opt/kafka/config/server.properties "$CONF"
          set_property() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" "$CONF"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$CONF"
            else
              printf '\n%s=%s\n' "$key" "$value" >> "$CONF"
            fi
          }
          set_property process.roles "broker,controller"
          set_property node.id "${NODE_ID}"
          set_property controller.listener.names "CONTROLLER"
          sed -i '/^controller\.quorum\.voters=/d' "$CONF"
          set_property controller.quorum.bootstrap.servers "kafka-0.kafka-hs.kafka.svc.internal.lan:9093"
          set_property listeners "SASL_PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093"
          set_property advertised.listeners "SASL_PLAINTEXT://${POD_FQDN}:9092,INTERNAL://${POD_FQDN}:9094"
          set_property listener.security.protocol.map "SASL_PLAINTEXT:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
          set_property inter.broker.listener.name "INTERNAL"
          if grep -q '^log.dirs=' "$CONF"; then
            sed -i "s|^log.dirs=.*|log.dirs=${LOG_DIR}|" "$CONF"
          else
            printf '\nlog.dirs=%s\n' "$LOG_DIR" >> "$CONF"
          fi
          META="${LOG_DIR}/meta.properties"
          if [ ! -f "$META" ]; then
            if [ "${ORDINAL}" -eq 0 ]; then
              FORMAT_MODE="--standalone"
            else
              FORMAT_MODE="--no-initial-controllers"
            fi
            /opt/kafka/bin/kafka-storage.sh format \
              -t "${CLUSTER_ID}" \
              -c "$CONF" \
              "${FORMAT_MODE}" \
              --release-version 3.9-IV0 \
              --ignore-formatted
          fi
        volumeMounts: [{ name: kafka-logs, mountPath: /tmp/kraft-combined-logs }]
      containers:
      - name: broker
        image: apache/kafka:4.1.2
        command: ["/bin/bash","-lc"]
        args:
        - |
          set -euo pipefail
          ORDINAL="${HOSTNAME##*-}"
          case "${ORDINAL}" in
            ''|*[!0-9]*) echo "Unable to derive StatefulSet ordinal from HOSTNAME=${HOSTNAME}" >&2; exit 1 ;;
          esac
          NODE_ID="$((ORDINAL + 1))"
          POD_FQDN="${HOSTNAME}.kafka-hs.kafka.svc.internal.lan"
          u_esc="$(printf '%s' "$KAFKA_ADMIN_USERNAME" | sed 's/[\\"]/\\&/g')"
          p_esc="$(printf '%s' "$KAFKA_ADMIN_PASSWORD" | sed 's/[\\"]/\\&/g')"
          CONF="/tmp/kafka-server.properties"
          set_property() {
            printf '%s=%s\n' "$1" "$2" >> "$CONF"
          }
          : > "$CONF"
          set_property process.roles "$KAFKA_PROCESS_ROLES"
          set_property node.id "$NODE_ID"
          set_property controller.listener.names "$KAFKA_CONTROLLER_LISTENER_NAMES"
          set_property controller.quorum.bootstrap.servers "$KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS"
          set_property listeners "$KAFKA_LISTENERS"
          set_property advertised.listeners "SASL_PLAINTEXT://${POD_FQDN}:9092,INTERNAL://${POD_FQDN}:9094"
          set_property listener.security.protocol.map "$KAFKA_LISTENER_SECURITY_PROTOCOL_MAP"
          set_property inter.broker.listener.name "$KAFKA_INTER_BROKER_LISTENER_NAME"
          set_property sasl.enabled.mechanisms "$KAFKA_SASL_ENABLED_MECHANISMS"
          set_property listener.name.sasl_plaintext.scram-sha-256.sasl.jaas.config \
            "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${u_esc}\" password=\"${p_esc}\";"
          set_property authorizer.class.name "$KAFKA_AUTHORIZER_CLASS_NAME"
          set_property allow.everyone.if.no.acl.found "$KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND"
          set_property super.users "$KAFKA_SUPER_USERS"
          set_property offsets.topic.replication.factor "$KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR"
          set_property transaction.state.log.replication.factor "$KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR"
          set_property transaction.state.log.min.isr "$KAFKA_TRANSACTION_STATE_LOG_MIN_ISR"
          set_property group.initial.rebalance.delay.ms "$KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS"
          set_property log.dirs "$KAFKA_LOG_DIRS"
          set_property log.retention.hours "$KAFKA_LOG_RETENTION_HOURS"
          set_property auto.create.topics.enable "$KAFKA_AUTO_CREATE_TOPICS_ENABLE"
          cat > /tmp/kafka_server_jaas.conf <<EOF
          KafkaServer {
            org.apache.kafka.common.security.scram.ScramLoginModule required username="${u_esc}" password="${p_esc}";
          };
          EOF
          export KAFKA_OPTS="-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf ${KAFKA_OPTS:-}"
          reconcile_controller_membership() {
            if [ "$NODE_ID" -eq 1 ]; then
              return 0
            fi

            if [ "$NODE_ID" -eq 3 ]; then
              until timeout 30 /opt/kafka/bin/kafka-metadata-quorum.sh \
                --command-config "$CONF" \
                --bootstrap-server "$KAFKA_QUORUM_ADMIN_BOOTSTRAP_SERVER" \
                describe --status 2>/dev/null | grep -q '"id": 2'; do
                echo "Waiting for controller 2 to become a voter before adding controller 3"
                sleep 5
              done
            fi

            while true; do
              status="$(timeout 30 /opt/kafka/bin/kafka-metadata-quorum.sh \
                --command-config "$CONF" \
                --bootstrap-server "$KAFKA_QUORUM_ADMIN_BOOTSTRAP_SERVER" \
                describe --status 2>/dev/null || true)"
              if printf '%s\n' "$status" | grep -q "\"id\": ${NODE_ID}"; then
                echo "Controller ${NODE_ID} is already a voter"
                return 0
              fi

              replication="$(timeout 30 /opt/kafka/bin/kafka-metadata-quorum.sh \
                --command-config "$CONF" \
                --bootstrap-server "$KAFKA_QUORUM_ADMIN_BOOTSTRAP_SERVER" \
                describe --replication 2>/dev/null || true)"
              if printf '%s\n' "$replication" | awk -v node_id="$NODE_ID" '$1 == node_id && $4 == 0 { found=1 } END { exit !found }'; then
                if timeout 60 /opt/kafka/bin/kafka-metadata-quorum.sh \
                  --command-config "$CONF" \
                  --bootstrap-server "$KAFKA_QUORUM_ADMIN_BOOTSTRAP_SERVER" \
                  add-controller; then
                  echo "Controller ${NODE_ID} was added to the dynamic quorum"
                  return 0
                fi
              fi

              echo "Waiting for controller ${NODE_ID} to catch up as an observer"
              sleep 5
            done
          }
          reconcile_controller_membership &
          exec /opt/kafka/bin/kafka-server-start.sh "$CONF"
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /vault/secrets/gcp-key.json
        - name: KAFKA_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: kafka-security-credentials
              key: admin_username
        - name: KAFKA_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kafka-security-credentials
              key: admin_password
        - { name: CLUSTER_ID, valueFrom: { secretKeyRef: { name: kafka-cluster-id, key: CLUSTER_ID } } }
        - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
        - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
        - { name: KAFKA_LISTENERS, value: "SASL_PLAINTEXT://:9092,INTERNAL://:9094,CONTROLLER://:9093" }
        - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "SASL_PLAINTEXT:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
        - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL" }
        - { name: KAFKA_SASL_ENABLED_MECHANISMS, value: "SCRAM-SHA-256" }
        - { name: KAFKA_LISTENER_NAME_SASL_PLAINTEXT_SCRAM_SHA_256_SASL_JAAS_CONFIG, value: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"$(KAFKA_ADMIN_USERNAME)\" password=\"$(KAFKA_ADMIN_PASSWORD)\";" }
        - { name: KAFKA_OPTS, value: "-Djava.security.auth.login.config=/tmp/kafka_server_jaas.conf" }
        - { name: KAFKA_AUTHORIZER_CLASS_NAME, value: "org.apache.kafka.metadata.authorizer.StandardAuthorizer" }
        - { name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND, value: "true" }
        - { name: KAFKA_SUPER_USERS, value: "User:kafka_admin;User:ANONYMOUS" }
        - { name: KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS, value: "kafka-0.kafka-hs.kafka.svc.internal.lan:9093" }
        - { name: KAFKA_QUORUM_ADMIN_BOOTSTRAP_SERVER, value: "kafka-0.kafka-hs.kafka.svc.internal.lan:9094" }
        - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
        - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
        - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
        - { name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs/kafka-data" }
        - { name: KAFKA_LOG_RETENTION_HOURS, value: "48" }
        - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
        ports:
        - { containerPort: 9092 }
        - { containerPort: 9093 }
        - { containerPort: 9094 }
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          tcpSocket: { port: 9092 }
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts: [{ name: kafka-logs, mountPath: /tmp/kraft-combined-logs }]
---
